<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطة عبدالله للقدرات</title>
<meta name="description" content="خطة يومية، طريقة حل كل نوع، وخمسة أقسام تجريبية موقوتة لاختبار القدرات العامة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* الفكرة: ورقة إجابة. ورق بارد، حبر أزرق للنموذج المطبوع، رصاص لما يكتبه الطالب، وأصفر قلم التظليل لما يُضغط.
     عمود واحد بعرض الجوال؛ كل بطاقة «ورقة» بصفوف مرقّمة ودوائر تُظلَّل. */
  --paper:#ECEEE9;
  --sheet:#FBFCFA;
  --graphite:#21242A;
  --soft:#59616E;
  --form:#2646B5;
  --form-tint:#E4E9F9;
  --rule:#C7D0EC;
  --mark:#F5C52F;
  --on-mark:#21242A;
  --ok:#1C7A4B; --ok-tint:#E2F3E9;
  --bad:#B4382A; --bad-tint:#FBE9E5;
  --warn:#8A5807; --warn-tint:#FBF0D9;
  --p1:#2646B5; --p2:#F5C52F; --p3:#8A94A6; --p4:#1C7A4B; --p5:#C96A2B;
  --scrim:rgba(20,24,34,.5);
  --mark-bg:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);
  --display:"Aref Ruqaa","Noto Naskh Arabic","Geeza Pro",serif;
  --text:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Times New Roman",serif;
  --ui:-apple-system,"SF Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1015; --sheet:#161A21; --graphite:#ECE8DF; --soft:#9CA4B2;
    --form:#93A9FF; --form-tint:#1D2540; --rule:#2C3654;
    --mark:#F5C52F; --on-mark:#21242A;
    --ok:#62CC92; --ok-tint:#14301F; --bad:#FF8E7D; --bad-tint:#3A1C18; --warn:#EDB458; --warn-tint:#33280F;
    --p1:#93A9FF; --p2:#F5C52F; --p3:#7F8898; --p4:#62CC92; --p5:#F09A5E;
    --scrim:rgba(0,0,0,.6);
    --mark-bg:linear-gradient(transparent 84%,var(--mark) 84%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1015; --sheet:#161A21; --graphite:#ECE8DF; --soft:#9CA4B2;
  --form:#93A9FF; --form-tint:#1D2540; --rule:#2C3654;
  --mark:#F5C52F; --on-mark:#21242A;
  --ok:#62CC92; --ok-tint:#14301F; --bad:#FF8E7D; --bad-tint:#3A1C18; --warn:#EDB458; --warn-tint:#33280F;
  --p1:#93A9FF; --p2:#F5C52F; --p3:#7F8898; --p4:#62CC92; --p5:#F09A5E;
  --scrim:rgba(0,0,0,.6);
  --mark-bg:linear-gradient(transparent 84%,var(--mark) 84%);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--graphite);font-family:var(--ui);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding-inline-start:1.3em}
:focus-visible{outline:2px solid var(--form);outline-offset:2px}
[hidden]{display:none !important}
mark{background:var(--mark-bg);color:inherit;padding:0 .12em}
sup{unicode-bidi:isolate;font-size:.66em;line-height:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2;font-size:.82em;margin:0 .18em}
.fr .fn{padding:0 .3em;border-bottom:1.5px solid currentColor}
.fr .fd{padding:0 .3em}
.num{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
ol{list-style-type:arabic-indic}

/* ---------- الهيكل ---------- */
/* لا شيء يُثبَّت أسفل الشاشة: شريط المستضيف لغير المسجّلين يغطي أسفلها */
#app{max-width:560px;margin:0 auto;padding:0 16px 160px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 2px 8px}
.top h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.25}
.top .who{display:block;font-family:var(--ui);font-weight:400;font-size:12px;color:var(--form);margin-bottom:2px}
.icon-btn{appearance:none;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;min-width:44px;min-height:44px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#view{display:flex;flex-direction:column;gap:14px;outline:0}

.tabs{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1.5px solid var(--form);margin:0 -16px 14px;padding:0 10px}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--soft);min-height:50px}
.tab .b{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--form)}
.tab[aria-current="page"]{color:var(--graphite);font-weight:700}
.tab[aria-current="page"] .b{background:var(--graphite);border-color:var(--graphite)}
.tab .n{font-size:10px;color:var(--bad);font-weight:700;margin-inline-start:2px}

/* ---------- الورقة ---------- */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--form);border-bottom:1px solid var(--rule);padding-bottom:7px}
.eyebrow b{font-weight:700}
h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.35;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.35;text-wrap:balance}
.prose{font-family:var(--text);font-size:18px;line-height:1.95}
.prose.sm{font-size:17px}
.muted{color:var(--soft);font-size:13px}
.src{font-family:var(--ui);font-size:12px;color:var(--soft);line-height:1.7}

.btn{appearance:none;border:1.5px solid var(--graphite);background:var(--mark);color:var(--on-mark);border-radius:4px;padding:10px 16px;font-weight:700;font-size:15px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--graphite);border-color:var(--rule);font-weight:600}
.btn.quiet{background:transparent;border-color:transparent;color:var(--form);font-weight:600;padding-inline:8px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.stretch > *{flex:1 1 140px}

.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--soft);background:transparent;white-space:nowrap}
button.chip{min-height:36px;padding:4px 12px;font-size:13px;color:var(--graphite)}
button.chip.on{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.chip.form{color:var(--form);border-color:var(--form)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.bub{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--form);display:inline-grid;place-items:center;font-family:var(--ui);font-size:13px;line-height:1;color:var(--form);background:transparent}
.bub.on{background:var(--graphite);border-color:var(--graphite);color:var(--sheet);animation:shade .22s ease-out}
@keyframes shade{from{box-shadow:inset 0 0 0 13px var(--sheet)}to{box-shadow:inset 0 0 0 0 var(--sheet)}}

/* صفوف مرقّمة كصفوف ورقة الإجابة */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px dashed var(--rule);min-width:0}
.row:first-child{border-top:0;padding-top:2px}
.row:last-child{padding-bottom:2px}
.row .no{flex:none;min-width:1.5em;font-size:12px;color:var(--form);font-variant-numeric:tabular-nums;padding-top:5px}
.row .body{flex:1;min-width:0;font-family:var(--text);font-size:17.5px;line-height:1.8}
.row .meta{flex:none;font-size:12px;color:var(--soft);padding-top:6px;white-space:nowrap}
.row.done .body{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--rule)}
.task{appearance:none;border:0;background:none;padding:0;display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0;text-align:start}
.tk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.tk-go{padding-inline-start:36px}

/* ---------- الرئيسية ---------- */
.hero .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.2}
.hero .big b{font-weight:700}
.hero .big .to{color:var(--form)}
.ruler{width:100%;height:auto;display:block;overflow:visible}
.ruler .ax{stroke:var(--graphite);stroke-width:1.2}
.ruler .tk{stroke:var(--graphite);stroke-width:1}
.ruler .tk.m{stroke:var(--form)}
.ruler text{font-family:var(--ui);font-size:10px;fill:var(--soft)}
.ruler .z5{fill:var(--form);opacity:.26}
.ruler .z10{fill:var(--form);opacity:.13}
.ruler .me{fill:var(--graphite)}
.ruler .goal{fill:var(--mark);stroke:var(--graphite);stroke-width:1.5}
.ruler .path{stroke:var(--graphite);stroke-width:1.2;stroke-dasharray:3 3;fill:none}
.ruler .lbl{font-size:11px;font-weight:700;fill:var(--graphite)}
.ruler .avg{fill:var(--form)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;margin-inline-end:5px;vertical-align:-1px;background:var(--form)}
.legend .l5 i{opacity:.4}.legend .l10 i{opacity:.2}
.legend .la i{width:0;height:0;background:none;border-inline:5px solid transparent;border-bottom:8px solid var(--form)}
.count{display:flex;align-items:center;gap:14px;border-top:1px solid var(--rule);padding-top:12px}
.count .d{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.count .w{flex:1;min-width:0;font-size:13px;color:var(--soft);line-height:1.6}
.count .w b{display:block;color:var(--graphite);font-size:15px}
.marks{display:flex;flex-wrap:wrap;gap:3px}
.marks i{width:5px;height:13px;background:var(--rule)}
.marks i.past{background:var(--graphite)}
.marks i.now{background:var(--mark);outline:1.5px solid var(--graphite)}
.marks i.end{background:var(--form);width:9px}
.note{font-family:var(--display);font-size:23px;line-height:1.75;color:var(--form);border-inline-start:4px solid var(--mark);padding-inline-start:14px;text-wrap:pretty}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--rule)}
.skill:first-child{border-top:0}
.skill .nm{font-size:14px}
.skill .nm small{color:var(--soft);font-size:11px;margin-inline-start:6px}
.skill .v{font-size:13px;font-variant-numeric:tabular-nums;color:var(--soft)}
.skill .bar{grid-column:1/-1;height:8px;background:var(--form-tint);position:relative}
.skill .bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--graphite)}
.skill.weak .nm{font-weight:700}
.skill.weak .bar i{background:var(--bad)}
.setup .btns .btn{flex:1 1 44%}

/* ---------- الخطة ---------- */
.phase{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:10px 0;border-top:1px dashed var(--rule)}
.phase:first-child{border-top:0}
.phase .k{grid-row:span 2;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--form);display:grid;place-items:center;font-size:14px;color:var(--form);align-self:start;margin-top:3px}
.phase.cur .k{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.phase .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.phase .t b{font-family:var(--display);font-size:21px}
.phase .t span{font-size:12px;color:var(--soft)}
.phase p{font-family:var(--text);font-size:16.5px;line-height:1.85}
.day > .eyebrow b{color:var(--graphite)}
.day.today{border-color:var(--graphite);border-width:1.5px}
details.fold > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;min-height:44px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"";width:8px;height:8px;border-inline-start:1.7px solid var(--form);border-bottom:1.7px solid var(--form);transform:rotate(-45deg);flex:none;margin-inline:6px}
details.fold[open] > summary::after{transform:rotate(135deg)}
details.fold > .in{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.mini{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--rule)}
.mini b{font-size:13px}
.mini span{font-size:13px;color:var(--soft)}

/* ---------- الطريقة ---------- */
details.g > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center}
details.g > summary::-webkit-details-marker{display:none}
details.g > summary .no{grid-row:span 2;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--form);display:grid;place-items:center;font-size:14px;color:var(--form)}
details.g[open] > summary .no{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
details.g > summary .s{grid-column:2;font-size:13px;color:var(--soft)}
details.g > summary::after{content:"";grid-row:1/span 2;grid-column:3;width:8px;height:8px;border-inline-start:1.7px solid var(--form);border-bottom:1.7px solid var(--form);transform:rotate(-45deg);margin-inline:6px}
details.g[open] > summary::after{transform:rotate(135deg)}
.gbody{font-family:var(--text);font-size:18px;line-height:1.95;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule);padding-top:14px}
.gbody h4{font-family:var(--ui);font-size:14px;font-weight:700;color:var(--form);margin-top:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:5px}
.gbody h4 .w{font-weight:400;font-size:12px;color:var(--soft)}
.gbody li{margin-bottom:6px}
.gbody li::marker{color:var(--form);font-family:var(--ui);font-size:.8em}
.gbody .trap{background:var(--warn-tint);border-inline-start:3px solid var(--warn);padding:8px 12px;font-size:17px}
.gbody .ex{background:var(--form-tint);padding:8px 12px;font-size:17px}
.gbody .lbl{font-family:var(--ui);font-size:12px;color:var(--soft)}
.gbody .chips span{font-family:var(--ui);font-size:12.5px;border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-family:var(--text);font-size:16.5px;line-height:1.7}
table.t th{font-family:var(--ui);font-size:12px;font-weight:700;color:var(--form);text-align:start;padding:6px 8px;border-bottom:1.5px solid var(--form);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px dashed var(--rule);vertical-align:top}
table.t td.c,table.t th.c{text-align:center;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid3 div{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:17px;font-variant-numeric:tabular-nums}
.dist{display:flex;flex-direction:column;gap:7px;font-family:var(--ui)}
.dist .d{display:grid;grid-template-columns:108px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;line-height:1.3}
.dist .d .bar{height:14px;background:var(--form-tint);position:relative}
.dist .d .bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--form)}
.dist .d.q .bar i{background:var(--graphite)}
.dist .d .v{font-variant-numeric:tabular-nums;color:var(--soft);text-align:end}
.dist .k{display:flex;gap:14px;font-size:12px;color:var(--soft)}
.dist .k i{display:inline-block;width:10px;height:10px;margin-inline-end:5px;background:var(--form)}
.dist .k .q i{background:var(--graphite)}

/* ---------- الاختبارات ---------- */
.testrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px dashed var(--rule)}
.testrow:first-child{border-top:0}
.testrow .nm{flex:1;min-width:0}
.testrow .nm b{display:block;font-family:var(--display);font-size:21px;line-height:1.3}
.testrow .nm span{font-size:12px;color:var(--soft)}
.testrow .sc{font-size:13px;font-variant-numeric:tabular-nums;color:var(--soft);text-align:center;white-space:nowrap}
.testrow .sc b{display:block;font-size:17px;color:var(--graphite)}

/* ---------- واجهة الحل ---------- */
#runner{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column}
.r-top{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sheet);border-bottom:1.5px solid var(--form)}
.r-top .ttl{flex:1;min-width:0;line-height:1.35}
.r-top .ttl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-top .ttl span{font-size:12px;color:var(--soft)}
.timer{appearance:none;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--graphite);background:var(--sheet);border-radius:4px;min-height:44px;padding:4px 12px;font-family:var(--ui);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.timer.low{border-color:var(--bad);color:var(--bad)}
.r-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 170px}
.r-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.qnav{display:flex;gap:8px;margin-top:4px}
.qnav .btn{flex:1}
.qnav .btn.mapbtn{flex:0 0 auto;padding-inline:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flag{appearance:none;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;min-height:38px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.flag.on{background:var(--warn-tint);border-color:var(--warn);color:var(--warn);font-weight:700}
.flag svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stem{font-family:var(--text);font-size:21px;line-height:1.95;text-wrap:pretty}
.stem.pair{font-size:27px;font-weight:700;text-align:center;padding:10px 0}
.stem u.cand{text-decoration-color:var(--form);text-decoration-thickness:2px;text-underline-offset:6px}
.passage{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:4px 14px}
.passage > summary{font-family:var(--ui);font-size:13px;color:var(--form)}
.passage .ptxt{font-family:var(--text);font-size:18.5px;line-height:2.05;display:flex;flex-direction:column;gap:10px;padding:10px 0 12px;border-top:1px solid var(--rule)}
.passage .ptxt .pn{font-family:var(--ui);font-size:12px;color:var(--form);margin-inline-end:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp > div{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;text-align:center}
.cmp small{display:block;font-family:var(--ui);font-size:12px;color:var(--form);margin-bottom:4px}
.cmp span{font-family:var(--text);font-size:21px;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font-family:var(--text);font-size:19.5px;line-height:1.75;min-height:54px}
.opt .tx{flex:1;min-width:0}
.opt.sel{border-color:var(--graphite);border-width:1.5px}
.opt.right{border-color:var(--ok);background:var(--ok-tint);border-width:1.5px}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint);border-width:1.5px}
.opt .tag{flex:none;font-family:var(--ui);font-size:12px;font-weight:700}
.opt.right .tag{color:var(--ok)}.opt.wrong .tag{color:var(--bad)}
.opt:disabled{opacity:1;cursor:default}
.explain{background:var(--form-tint);border-inline-start:3px solid var(--form);padding:10px 14px;font-family:var(--text);font-size:18px;line-height:1.95}
.explain b{font-family:var(--ui);font-size:12px;color:var(--form);display:block;margin-bottom:2px}
.fig{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}

.fig svg{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.fig svg text{font-family:var(--ui);font-size:11px;fill:var(--soft)}
.fig .grid{stroke:var(--rule);stroke-width:1}
.fig .axis{stroke:var(--graphite);stroke-width:1.2}
.fig .barf{fill:var(--form)}

.map{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;justify-items:center}

.map button.on{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}

.map button.fl::after{content:"";position:absolute;top:-3px;inset-inline-end:-3px;width:11px;height:11px;border-radius:50%;background:var(--warn);border:2px solid var(--sheet)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 0}

details.rev{border-top:1px dashed var(--rule)}

.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--rule)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--rule);border-radius:6px;padding:8px 6px;text-align:center}
.tile small{display:block;font-size:11px;color:var(--soft)}
.tile b{font-family:var(--display);font-size:26px;line-height:1.3}
.tile.off b{color:var(--soft);font-family:var(--ui);font-size:18px}
.notei{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--rule)}
.notei p{flex:1;min-width:0;font-family:var(--text);font-size:17px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- النوافذ ---------- */
#modal{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:12px 12px 120px}

<script>
const DATA={"P":{"p1":["ظلّ الناس زمناً طويلاً يحسبون النوم توقفاً تاماً عن النشاط، كأن الدماغ يُطفأ ليلاً كما يُطفأ المصباح. لكنّ الدراسات الحديثة أظهرت أن الدماغ يبقى في أثناء النوم منشغلاً بعملٍ لا يقل أهمية عن عمله في اليقظة.","ففي ساعات النوم يعيد الدماغ ترتيب ما مرّ به في النهار؛ فيثبّت المعلومات المهمة في الذاكرة طويلة المدى، ويتخلص مما لا حاجة إليه. ولهذا يجد الطالب الذي ينام نوماً كافياً بعد المذاكرة أن استرجاعه للمعلومات أفضل ممن سهر الليل كله يراجع.","ولا تقف فائدة النوم عند الذاكرة؛ فقلّته تُضعف التركيز، وتُبطئ ردّ الفعل، وتجعل صاحبها أسرع غضباً وأقل صبراً. ومن هنا كان السهر قبل الاختبار خسارة مضاعفة: يضيّع ما حُفظ، ويُضعف القدرة على التفكير في ما لم يُحفظ."],"p2":["حين يُذكر النحل يتبادر إلى الذهن العسل، مع أن العسل ليس أثمن ما يقدّمه النحل للإنسان. فالخدمة الكبرى التي يؤديها هي تلقيح النبات؛ إذ ينقل حبوب اللقاح من زهرة إلى أخرى وهو يجمع الرحيق، فتُعقد الثمار وتتكوّن البذور.","ويعتمد قسم كبير من المحاصيل التي يأكلها الإنسان، من فواكه وخضراوات ومكسّرات، على الحشرات الملقِّحة، والنحل في مقدمتها. ولو غابت هذه الحشرات لما اختفى الغذاء كله، لكنّ المائدة ستفقد كثيراً من تنوّعها، وسترتفع أسعار ما يبقى منها.","وقد لاحظ المختصون في العقود الأخيرة تراجعاً في أعداد النحل في مناطق عدة، ويعزونه إلى أسباب متداخلة، منها الإفراط في استخدام المبيدات، وفقدان المراعي الطبيعية، وبعض الآفات. ولذلك لم تعد حماية النحل شأناً يخص النحّالين وحدهم، بل صارت قضية تمسّ الأمن الغذائي."],"p3":["يظن كثيرون أن التغيير الكبير يحتاج إلى قرار كبير، فيبدؤون بحماسة عالية ثم لا يلبثون أن يتوقفوا. والواقع أن أكثر ما يغيّر حياة الإنسان عادات صغيرة يكررها كل يوم حتى تصير جزءاً منه.","فمن قرأ عشر صفحات في اليوم لم يشعر بثقلها، لكنه يكون قد أتمّ في العام أكثر من ثلاثة آلاف وخمسمئة صفحة. ومن ادّخر مبلغاً يسيراً كل شهر وجد بعد سنوات ما لم يكن يتوقعه. فالأثر لا يظهر في يوم أو أسبوع، وإنما يتراكم في صمت حتى يفاجئ صاحبه.","غير أن هذه القاعدة سيف ذو حدّين؛ فالعادة السيئة الصغيرة تتراكم بالطريقة نفسها. دقائق قليلة تُهدر كل يوم تبدو هيّنة، لكنها تصبح في آخر العام أياماً كاملة. ولهذا كان السؤال الأهم ليس: ماذا سأنجز اليوم؟ بل: ما الذي أكرره كل يوم؟"],"p4":["نكتب الأعداد اليوم بسهولة تجعلنا ننسى أن هذه الطريقة لم تكن معروفة في أكثر الحضارات القديمة. فقد كان الرومان، مثلاً، يكتبون الأعداد برموز تُجمع وتُطرح، فإذا كبر العدد طالت كتابته، وصار ضرب عددين عملاً شاقاً لا يتقنه إلا المتخصصون.","ثم ظهر في الهند نظام يقوم على فكرتين: أن قيمة الرقم تتغير بتغيّر موضعه، وأن للفراغ رمزاً هو الصفر. وبهاتين الفكرتين صار في الإمكان كتابة أي عدد، مهما كبر، بعشرة رموز فقط.","وأدرك علماء المسلمين قيمة هذا النظام، فأخذوه وشرحوه وبنوا عليه، ومن أشهرهم الخوارزمي الذي ألّف فيه كتاباً تُرجم لاحقاً إلى اللاتينية. ومن طريق هذه الترجمات عرفته أوروبا، لكنها لم تتقبله سريعاً؛ فقد ظل كثيرون زمناً طويلاً متمسكين بالطريقة القديمة قبل أن يسود النظام الجديد.","وهكذا فإن ما نعدّه اليوم من البديهيات كان في حقيقته ثمرة انتقال المعرفة بين أمم مختلفة، أضافت كل واحدة منها شيئاً ثم سلّمته لمن بعدها."],"p5":["لم يعرف الإنسان عصراً توافرت فيه المعلومات كما توافرت اليوم؛ فكل ما يخطر بالبال صار على بُعد ضغطة زر. ومع ذلك يشكو كثيرون من أنهم يقرؤون أكثر ويفهمون أقل، وأنهم يعجزون عن إتمام كتاب واحد.","وتفسير ذلك أن الوفرة في المعلومات تقابلها ندرة في شيء آخر: الانتباه. فالتطبيقات تتنافس على دقائق المستخدم، وتُصمَّم بعناية لتقطع عليه ما هو فيه بإشعار بعد إشعار. والعقل الذي يتنقل كل دقيقتين بين مهمة وأخرى لا يتعمق في أيٍّ منها، وإن ظنّ صاحبه أنه ينجز أشياء كثيرة في وقت واحد.","والتركيز، مثل العضلة، يقوى بالتمرين ويضعف بالإهمال. ومن أيسر تمارينه أن يخصص المرء وقتاً محدداً لعمل واحد، يُبعد فيه هاتفه عن يده وعينه، ويبدأ بمدة قصيرة يزيدها شيئاً فشيئاً. وقد يجد ذلك ثقيلاً في أول الأمر، لكن الثقل نفسه علامة على أن العضلة تعمل."]},"F":{"f1":{"kind":"bars","title":"عدد الكتب المستعارة من مكتبة المدرسة في أسبوع","labels":["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"],"values":[40,55,35,60,50],"max":70,"step":10},"f2":{"kind":"pie","title":"توزيع مصروف أسرة في الشهر · المجموع 8000 ريال","parts":[["السكن",35],["الغذاء",25],["المواصلات",15],["التعليم",15],["أخرى",10]]},"f3":{"kind":"table","title":"أعضاء أربعة أندية مدرسية ومن حضر منهم إحدى الفعاليات","head":["النادي","عدد الأعضاء","عدد الحاضرين"],"rows":[["العلمي","40","32"],["الرياضي","60","54"],["الثقافي","50","35"],["الفني","25","20"]]},"f4":{"kind":"bars","title":"مبيعات متجر في أرباع السنة (بآلاف الريالات)","labels":["الربع الأول","الربع الثاني","الربع الثالث","الربع الرابع"],"values":[120,150,90,180],"max":210,"step":30},"f5":{"kind":"inscribed","title":"دائرة داخل مربع تمسّ أضلاعه"},"f6":{"kind":"table","title":"درجات 10 طلاب في اختبار قصير","head":["الدرجة","6","7","8","9","10"],"rows":[["عدد الطلاب","2","3","3","1","1"]]}},"Q":[{"id":"s1q1","s":1,"n":1,"t":"an","stem":"قلم : كتابة","e":"القلم أداة وظيفتها الكتابة، والمقص أداة وظيفتها القص. في «قراءة : كتاب» العلاقة مختلفة والترتيب معكوس.","o":["مقص : قص","حبر : قلم","قراءة : كتاب","ورق : كتاب"],"a":0},{"id":"s1q2","s":1,"n":2,"t":"an","stem":"همس : صراخ","e":"تدرّج في الشدة من الأضعف إلى الأقوى: الهمس صوت خافت والصراخ صوت شديد، والنسيم ريح خفيفة والعاصفة ريح شديدة. «ركض : مشي» تدرّج معكوس.","o":["كلام : صمت","ضحك : بكاء","نسيم : عاصفة","ركض : مشي"],"a":2},{"id":"s1q3","s":1,"n":3,"t":"an","stem":"شجرة : غابة","e":"فرد من مجموعة: الغابة مجموعة أشجار والمجرّة مجموعة نجوم. «كتاب : صفحة» كلٌّ ثم جزء، فالترتيب معكوس.","o":["كتاب : صفحة","نجم : مجرة","بحر : سمك","جبل : صخر"],"a":1},{"id":"s1q4","s":1,"n":4,"t":"od","stem":"أيّ الكلمات الآتية لا تنتمي إلى المجموعة؟","e":"السيف والرمح والسهم أسلحة هجوم، والدرع وسيلة وقاية.","o":["درع","سهم","رمح","سيف"],"a":0},{"id":"s1q5","s":1,"n":5,"t":"co","stem":"علمٌ بلا عملٍ كشجرٍ بلا .......","e":"ثمرة العلم العمل به؛ فالعلم الذي لا يُعمل به كالشجر الذي لا يثمر.","o":["ورق","ظل","جذور","ثمر"],"a":3},{"id":"s1q6","s":1,"n":6,"t":"co","stem":"مَن ....... في طلب المعالي هانت عليه .......","e":"الجدّ في الطلب يجعل المصاعب هيّنة. مَن زهد أو تردّد أو تهاون لا تهون عليه الصعاب، فبقية الخيارات تجعل الجملة متناقضة.","o":["تردّد .. المطالب","زهد .. المكارم","جدّ .. المصاعب","تهاون .. المتاعب"],"a":2},{"id":"s1q7","s":1,"n":7,"t":"er","stem":"الرياضة [[ا s1q15","s":1,"n":15,"t":"ar","stem":"قُسّم مبلغ 720 ريالاً بين أحمد وخالد بنسبة 5 : 4 على الترتيب. كم ريالاً نصيب أحمد؟","e":"مجموع الأجزاء 9، وقيمة الجزء 720 ÷ 9 = 80، فنصيب أحمد 5 × 80 = 400.","o":["280","320","360","400"],"a":3},{"id":"s1q16","s":1,"n":16,"t":"ge","stem":"مستطيل محيطه 36 سم وطوله ضعف عرضه. ما مساحته؟","e":"ليكن العرض ع والطول 2ع: 2(ع + 2ع) = 36 فيكون ع = 6 والطول 12، والمساحة 6 × 12 = 72 سم^2.","o":["54 سم^2","64 سم^2","72 سم^2","81 سم^2"],"a":2},{"id":"s1q17","s":1,"n":17,"t":"al","stem":"إذا كان 3س + 7 = 31، فما قيمة 2س − 5؟","e":"3س = 24 فيكون س = 8، والمطلوب 2س − 5 = 16 − 5 = 11. انتبه: المطلوب ليس قيمة س.","o":["8","11","13","16"],"a":1},{"id":"s1q18","s":1,"n":18,"t":"ar","stem":"","e":"بالضرب التبادلي: 5 × 7 = 35 و 3 × 12 = 36. الناتج الأكبر يتبع الكسر {3/7}، فهو الأكبر.","c":["{5/12}","{3/7}"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":1},{"id":"s1q19","s":1,"n":19,"t":"ar","stem":"ارتفع سعر سلعة 20%، ثم انخفض السعر الجديد 20%. كيف تغيّر السعر عن الأصل؟","e":"افرض السعر 100: يصير 120، ثم ينخفض 20% من 120 أي 24 فيصير 96. الانخفاض 4%.","o":["انخفض 4%","لم يتغير","انخفض 2%","ارتفع 4%"],"a":0},{"id":"s1q20","s":1,"n":20,"t":"ar","stem":"ينجز عامل عملاً في 6 أيام، وينجزه عامل آخر في 12 يوماً. في كم يوم ينجزانه معاً؟","e":"في اليوم الواحد ينجزان {1/6} + {1/12} = {1/4} العمل، فيتمّانه في 4 أيام.","o":["4","6","9","18"],"a":0},{"id":"s1q21","s":1,"n":21,"t":"ge","stem":"إذا زاد طول ضلع مربع بنسبة 10%، فبأي نسبة تزيد مساحته؟","e":"افرض الضلع 10 فالمساحة 100. بعد الزيادة يصير الضلع 11 والمساحة 121، فالزيادة 21%.","o":["10%","11%","20%","21%"],"a":3},{"id":"s1q22","s":1,"n":22,"t":"da","stem":"ما متوسط عدد الكتب المستعارة في اليوم الواحد؟","e":"المجموع 40 + 55 + 35 + 60 + 50 = 240، والمتوسط 240 ÷ 5 = 48.","f":"f1","o":["45","48","50","52"],"a":1},{"id":"s1q23","s":1,"n":23,"t":"da","stem":"ما نسبة زيادة كتب يوم الأربعاء على كتب يوم الأحد؟","e":"الزيادة 60 − 40 = 20، وتُنسب إلى يوم الأحد: 20 ÷ 40 = × 1 = 3 م^3، أي 3000 لتر.","o":["300","450","1500","3000"],"a":3},{"id":"s4q15","s":4,"n":15,"t":"ar","stem":"","e":"2^10 = 1024 و 10^3 = 1000. احفظ أن 2^10 = 1024.","c":["2^10","10^3"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":0},{"id":"s4q16","s":4,"n":16,"t":"ar","stem":"اشترى تاجر 50 قطعة بمبلغ 600 ريال، وباع القطعة الواحدة بمبلغ 15 ريالاً. ما نسبة ربحه؟","e":"تكلفة القطعة 600 ÷ 50 = 12 ريالاً وربحها 3 ريالات، ونسبة الربح تُحسب من التكلفة: 3 ÷ 12 = 25%. القسمة على سعر البيع تعطي 20% وهو الفخ.","o":["15%","20%","25%","30%"],"a":2},{"id":"s4q17","s":4,"n":17,"t":"al","stem":"إذا كان (س + 3)^2 = س^2 + 33، فما قيمة س؟","e":"(س + 3)^2 = س^2 + 6س + 9، فيكون 6س + 9 = 33 و 6س = 24 و س = 4.","o":["4","5","6","8"],"a":0},{"id":"s4q18","s":4,"n":18,"t":"ar","stem":"يدق جرس كل 12 دقيقة وجرس آخر كل 18 دقيقة. إذا دقّا معاً الساعة 8:00، فمتى يدقان معاً في المرة التالية؟","e":"المضاعف المشترك الأصغر للعددين 12 و18 هو 36، فيدقان معاً بعد 36 دقيقة، أي الساعة 8:36.","o":["8:30","8:36","8:54","9:36"],"a":1},{"id":"s4q19","s":4,"n":19,"t":"ge","stem":"في المثلث أ ب جـ: قياس الزاوية أ = 50° وقياس الزاوية ب = 60°.","e":"الزاوية جـ = 180° − 50° − 60° = 70°. الضلع أ ب يقابل الزاوية جـ (70°)، والضلع ب جـ يقابل الزاوية أ (50°)، والضلع المقابل للزاوية الأكبر أطول.","c":["طول الضلع ب جـ","طول الضلع أ ب"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":1},{"id":"s4q20","s":4,"n":20,"t":"ge","stem":"مثلث قائم الزاوية ومتطابق الضلعين، طول وتره 10 سم. ما مساحته؟","e":"إذا كان طول كل ضلع قائم ل فإن ل^2 + ل^2 = 100 أي ل^2 = 50، والمساحة = {1/2} × ل × ل = {1/2} × 50 = 25 سم^2. لا تحتاج إلى حساب ل نفسه.","o":["25 سم^2","50 سم^2","75 سم^2","100 سم^2"],"a":0},{"id":"s4q21","s":4,"n":21,"t":"da","stem":"ما نسبة مبيعات الربع الرابع إلى مبيعات السنة كلها؟","e":"مجموع السنة 120 + 150 + 90 + 180 = 540، و180 ÷ 540 = {1/3}.","f":"f4","o":["{1/6}","{1/5}","{1/4}","{1/3}"],"a":3},{"id":"s4q22","s":4,"n":22,"t":"da","stem":"ما نسبة انخفاض مبيعات الربع الثالث عن الربع الثاني؟","e":"الانخفاض 150 − 90 = 60، ويُنسب إلى القيمة القديمة (الربع الثاني): 60 ÷ 150 = 40%.","f":"f4","o":["25%","40%","60%","67%"],"a":1},{"id":"s4q23","s":4,"n":23,"t":"ar","stem":"خزان فيه 40 لتراً من عصير تركيزه 25%. كم لتراً من الماء نضيف ليصير التركيز 20%؟","e":"العصير الصافي 25% من 40 = 10 لترات ولا يتغير. ليكون 10 لترات تساوي 20% يجب أن يكون المجموع 50 لتراً، فنضيف 10 لترات.","o":["5","8","10","20"],"a":2},{"id":"s4q24","s":4,"n":24,"t":"ar","stem":"ما رقم الآحاد في ناتج 3^23؟","e":"آحاد قوى العدد 3 تتكرر كل أربع: 3، 9، 7، 1. و23 = 20 + 3، فبعد خمس دورات كاملة نأخذ الثالث في الدورة: 7.","o":["1","3","7","9"],"a":2},{"id":"s5q1","s":5,"n":1,"t":"an","stem":"شاعر : قصيدة","e":"مبدعٌ وما يبدعه: الشاعر ينظم القصيدة والرسام يرسم اللوحة. «نجار : منشار» صاحب مهنة وأداته.","o":["رسام : لوحة","نجار : منشار","قارئ : كتاب","لوحة : ألوان"],"a":0},{"id":"s5q2","s":5,"n":2,"t":"an","stem":"بذرة : شجرة","e":"طور أول وما يصير إليه: البذرة تنمو شجرة واليرقة تتحول فراشة.","o":["غصن : ورقة","حديقة : زهرة","يرقة : فراشة","ثمرة : بذرة"],"a":2},{"id":"s5q3","s":5,"n":3,"t":"an","stem":"وجل : خوف","e":"ترادف: الوجل هو الخوف، والحبور هو السرور. «شجاعة : جبن» تضاد.","o":["ليل : ظلام","شجاعة : جبن","حزن : دمعة","حبور : سرور"],"a":3},{"id":"s5q4","s":5,"n":4,"t":"od","stem":"أيّ الكلمات الآتية لا تنتمي إلى المجموعة؟","e":"الخشب والقطن والصوف مواد طبيعية من نبات أو حيوان، والبلاستيك مادة مصنّعة.","o":["خشب","صوف","بلاستيك","قطن"],"a":2},{"id":"s5q5","s":5,"n":5,"t":"co","stem":"من اعتاد ....... عمله إلى الغد تراكمت عليه المهام حتى ....... عن إنجازها.","e":"التأجيل سبب التراكم، والتراكم ينتهي بالعجز عن الإنجاز.","o":["تأجيل .. عجز","تأجيل .. استغنى","إنجاز .. عجز","إتقان .. توقف"],"a":0},{"id":"s5q6","s":5,"n":6,"t":"co","stem":"قد يكون الصمت أحياناً أبلغ من ....... ، وقد يكون الإصغاء أنفع من .......","e":"المفاضلة تكون بين الشيء وضدّه: الصمت والكلام، والإصغاء والحديث. «السكوت» مرادف للصمت و«الاستماع» مرادف للإصغاء فلا تصح الم "t":"ar","stem":"عدد إذا أضفنا إلى نصفه ثلثَه كان الناتج 25. ما العدد؟","e":"نصف العدد + ثلثه = {5/6} العدد = 25، فالعدد = 25 × {6/5} = 30. أو جرّب الخيارات: نصف 30 هو 15 وثلثه 10.","o":["30","36","42","60"],"a":0},{"id":"s5q15","s":5,"n":15,"t":"ar","stem":"انطلقت سيارتان في الوقت نفسه من مدينتين بينهما 360 كم، كلٌّ منهما باتجاه الأخرى، بسرعتي 70 كم/س و 50 كم/س. بعد كم ساعة تلتقيان؟","e":"المتقابلان تُجمع سرعتاهما: 70 + 50 = 120 كم/س، والزمن 360 ÷ 120 = 3 ساعات.","o":["1","2","3","6"],"a":2},{"id":"s5q16","s":5,"n":16,"t":"ar","stem":"في كيس 5 كرات حمراء و3 زرقاء وكرتان خضراوان. سُحبت كرة عشوائياً. ما احتمال ألا تكون زرقاء؟","e":"الكرات 10، وغير الزرقاء 7، فالاحتمال {7/10}. و{3/10} احتمال أن تكون زرقاء.","o":["{1/5}","{3/10}","{1/2}","{7/10}"],"a":3},{"id":"s5q17","s":5,"n":17,"t":"ge","stem":"دائرة مرسومة داخل مربع وتمسّ أضلاعه الأربعة. إذا كانت مساحة المربع 64 سم^2، فما مساحة الدائرة؟","e":"ضلع المربع 8 سم وهو قطر الدائرة، فنصف القطر 4 سم والمساحة ط × 4^2 = 16ط سم^2.","f":"f5","o":["8ط سم^2","16ط سم^2","32ط سم^2","64ط سم^2"],"a":1},{"id":"s5q18","s":5,"n":18,"t":"ar","stem":"إذا كان س و ص عددين موجبين، و س أكبر من ص.","e":"{س/ص} أكبر من 1 لأن البسط أكبر من المقام، و{ص/س} أصغر من 1.","c":["{س/ص}","{ص/س}"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":0},{"id":"s5q19","s":5,"n":19,"t":"al","stem":"إذا كان 2^{س} = 32، فما قيمة 3^{س − 3}؟","e":"32 = 2^5 فيكون س = 5، والمطلوب 3^{5 − 3} = 3^2 = 9.","o":["1","3","6","9"],"a":3},{"id":"s5q20","s":5,"n":20,"t":"ge","stem":"أسطوانة أولى نصف قطر قاعدتها 3 سم وارتفاعها 4 سم، وأسطوانة ثانية نصف قطر قاعدتها 4 سم وارتفاعها 3 سم.","e":"الحجم = ط × نق^2 × ع. الأولى: ط × 9 × 4 = 36ط، والثانية: ط × 16 × 3 = 48ط. نصف القطر يُربَّع فأثره أكبر من أثر الارتفاع.","c":["حجم الأسطوانة الأولى","حجم الأسطوانة الثانية"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":1},{"id":"s5q21","s":5,"n":21,"t":"da","stem":"ما وسيط الدرجات؟","e":"الدرجات مرت id: "exam", title: "افهم الاختبار", sum: "محوسب: 120 سؤالاً في 5 أقسام، و25 دقيقة لكل قسم",
html: `
<p>الاختبار 120 سؤالاً، لكل سؤال أربعة خيارات، في 5 أقسام. كل قسم 24 سؤالاً وزمنه 25 دقيقة، والمجموع ساعتان وخمس دقائق. نصيب السؤال الواحد دقيقة تقريباً.</p>
<h4>أين تذهب الدرجات؟</h4>
<div data-w="dist"></div>
<p>في النسخة العلمية (مسارات: العام، الصحة والحياة، علوم الحاسب والهندسة) اللفظي 55% والكمي 45%. ثلاثة أنواع فقط تحمل 61% من الاختبار: ==استيعاب المقروء== و==الحساب== و==التناظر اللفظي==. ابدأ بها.</p>
<h4>ماذا تعني الدرجة؟</h4>
<p>الدرجة ليست نسبة إجاباتك الصحيحة، بل موقعك بين كل من دخلوا الاختبار.</p>
<div data-w="bands"></div>
<p>درجة 79 تقع ضمن أعلى 10%. من وصل إليها يحتاج إلى تقليل أخطائه، لا إلى تعلّم كل شيء من جديد.</p>
<h4>قواعد يجب أن تعرفها</h4>
<ul>
<li>الآلة الحاسبة ممنوعة. الحساب كله ذهني أو على المسودة.</li>
<li>لا تترك سؤالاً بلا إجابة. الهيئة نفسها توصي بالإجابة عن جميع الأسئلة، والتخمين أفضل من الفراغ.</li>
<li>اختبارك محوسب: متاح طوال العام، تختار يومه ومقره عند الحجز، وتظهر نتيجته خلال أيام عمل قليلة.</li>
<li>لكل قسم وقته على الشاشة، ولا يمكن الرجوع إلى قسم انتهى.</li>
<li>بين المحاولتين المحوسبتين 30 يوماً على الأقل، فلا تحجز قبل أن تجهز.</li>
<li>يمكن تعديل الموعد أو حذفه حتى 48 ساعة قبل الاختبار. إن لم تكن جاهزاً فأجّل بدل أن تستهلك فرصة.</li>
<li>لك خمس فرص، وتبقى الدرجة صالحة خمس سنوات. راجع فرصك المتبقية في حسابك بموقع الهيئة قبل الحجز.</li>
</ul>
<p class="src">الأرقام من الدليل الإرشادي لهيئة تقويم التعليم والتدريب وما أعلنته لعام 2026. المواعيد قابلة للتحديث، فتأكد من موقع الهيئة قبل أي حجز.</p>
`},

id: "method", title: "طريقة العمل", sum: "الدورة تشرح، والدرجة تأتي من حلّك ودفتر أخطائك",
html: `
<p>الدورة تشرح لك، لكن الدرجة تأتي من حلّك أنت. سواء كانت دورتك عند إيهاب أو المنصف أو غيرهما، اتبع هذه الحلقة كل يوم:</p>
<ol>
<li><b>تعلّم:</b> درس واحد من الدورة. أوقف المقطع قبل أن يحل المعلّم وحل بنفسك، ثم قارن.</li>
<li><b>طبّق:</b> حل تدريب الدرس في اليوم نفسه. ما لا تطبقه اليوم تنساه غداً.</li>
<li><b>وقّت:</b> بعد التأسيس كل تدريب بساعة إيقاف: 24 سؤالاً في 25 دقيقة.</li>
<li><b>شخّص:</b> كل خطأ يدخل دفتر الأخطاء مع سببه.</li>
<li><b>أعد:</b> أعد حل أخطائك بعد أسبوع. الخطأ الذي يتكرر هو درجتك الضائعة.</li>
</ol>
<h4>الأسباب الأربعة للخطأ</h4>
<table class="t">
<thead><tr><th>السبب</th><th>معناه</th><th>علاجه</th></tr></thead>
<tbody>
<tr><td>ما عرفت</td><td>فجوة في قاعدة أو معنى كلمة</td><td>ارجع إلى درسها في الدورة، ثم حل 10 أسئلة من نوعها</td></tr>
<tr><td>تسرّعت</td><td>عرفت الطريقة وأخطأت في التنفيذ</td><td>اقرأ المطلوب مرتين، واكتب خطواتك</td></tr>
<tr><td>ضاق الوقت</td><td>لم تصل إلى السؤال أو خمّنته</td><td>تدرّب بالساعة، واترك السؤال العنيد بعد 75 ثانية</td></tr>
<tr><td>انخدعت</td><td>اخترت خياراً وُضع ليُغري</td><td>اكتب شكل الفخ بكلمتين لتعرفه حين يعود</td></tr>
</tbody>
</table>
<p>أصحاب الدرجات العالية يخسرون أغلب ما يخسرون في «تسرّعت» و«ضاق الوقت». هذان يعالجهما التدريب الموقوت، لا مشاهدة شروح إضافية.</p>
<h4>ثلاث قواعد للدورات</h4>
<ul>
<li>دورة واحدة للفظي ودورة واحدة للكمي تكفيان. التنقل بين الدورات يعيدك إلى البداية كل مرة.</li>
<li>أكمل التأسيس أولاً ثم انتقل إلى بنوك الأسئلة. الحل قبل التأسيس حفظ بلا فهم.</li>
<li>التجميعات تمارين تفهم طريقة حلها، لا إجابات تحفظها. الأرقام والصياغة تتغير والطريقة تبقى.</li>
</ul>
`},

id: "time", title: "الوقت داخل القسم", sum: "جولتان، وثلاث نظرات إلى الساعة",
html: `
<p>25 دقيقة لحل 24 سؤالاً. لكن الأسئلة ليست متساوية: التناظر يكفيه 20 إلى 30 ثانية، والنص القرائي يحتاج دقيقتين للقراءة قبل أسئلته. وفّر في القصير لتنفق في الطويل.</p>
<h4>طريقة الجولتين</h4>
<ol>
<li><b>الجولة الأولى:</b> حل كل سؤال تعرف طريقه. إذا تجاوزت 75 ثانية في سؤال فاختر أقرب إجابة، دوّن رقمه في المسودة، وامضِ.</li>
<li><b>الجولة الثانية:</b> عد إلى ما دوّنته بما بقي من وقت القسم، وابدأ بالأقرب للحل.</li>
<li><b>آخر دقيقة:</b> تأكد أن لكل سؤال إجابة.</li>
</ol>
<h4>ثلاث نظرات إلى الساعة</h4>
<table class="t">
<thead><tr><th>عند الدقيقة</th><th>يجب أن تكون عند</th></tr></thead>
<tbody>
<tr><td>8</td><td>السؤال 8</td></tr>
<tr><td>16</td><td>السؤال 16</td></tr>
<tr><td>22</td><td>نهاية الجولة الأولى</td></tr>
</tbody>
</table>
<p>إن وجدت نفسك متأخراً فلا تسرع في القراءة. اترك سؤالاً طويلاً واحداً وعوّض.</p>
`},

id: "verbal", title: "اللفظي", sum: "55% من الاختبار: المقروء، التناظر، الخطأ السياقي، إكمال الجمل",
html: `
<h4>استيعاب المقروء <span class="w">21%</span></h4>
<p>أكبر وزن في الاختبار، وأكثر ما يستهلك الوقت.</p>
<ol>
<li>مرّ على رؤوس الأسئلة، لا الخيارات، في 15 ثانية لتعرف عمّ تبحث.</li>
<li>اقرأ النص مرة واحدة بتركيز، وسمِّ فكرة كل فقرة بكلمتين في ذهنك.</li>
<li>ارجع إلى السطر عند كل سؤال. ==الجواب في النص لا في معلوماتك==.</li>
</ol>
<table class="t">
<thead><tr><th>نوع السؤال</th><th>كيف يُحل</th></tr></thead>
<tbody>
<tr><td>العنوان والفكرة العامة</td><td>ما يغطي النص كله. احذف ما يخص فقرة واحدة وما يتجاوز النص</td></tr>
<tr><td>التفصيل</td><td>موجود نصاً. ابحث عن كلمة السؤال في النص</td></tr>
<tr><td>الاستنتاج «يُفهم من النص»</td><td>لا يُذكر حرفياً لكنه يلزم مما ذُكر. ما يحتاج إلى معلومة من خارج النص خطأ</td></tr>
<tr><td>معنى الكلمة</td><td>ضع كل خيار مكانها واقرأ الجملة</td></tr>
<tr><td>عود الضمير</td><td>ارجع إلى أقرب اسم قبله يستقيم معه المعنى</td></tr>
<tr><td>«ما لم يرد»</td><td>احذف ما تجده في النص، والباقي هو الجواب</td></tr>
</tbody>
</table>
<p class="trap"><b>احذر</b> الخيارات المطلقة: «دائماً، جميع، فقط، لا أحد» ما لم يقلها النص.</p>
<p>قراءة حرة 15 دقيقة يومياً، مقالاً أو صفحات من كتاب، ترفع سرعتك وفهمك أكثر من أي حيلة.</p>

<h4>التناظر اللفظي <span class="w">17%</span></h4>
<ol>
<li>كوّن جملة تربط الكلمتين: «القلم أداة للكتابة».</li>
<li>طبّق الجملة نفسها على كل خيار ==بالترتيب نفسه==.</li>
<li>إن بقي خياران فاجعل جملتك أدق: «القلم أداة يمسكها الإنسان ليكتب بها».</li>
</ol>
<p class="lbl">أشهر العلاقات</p>
<p class="chips"><span>ترادف</span><span>تضاد</span><span>جزء من كل</span><span>فرد من مجموعة</span><span>أداة ووظيفتها</span><span>صاحب مهنة وأداته أو مكانه</span><span>سبب ونتيجة</span><span>تدرّج في الشدة</span><span>مادة ومنتَج</span><span>كائن ومسكنه</span><span>طور وما يصير إليه</span><span>فاقد ومفقود</span></p>
<p class="trap"><b>الفخّان:</b> خيار من موضوع السؤال نفسه بعلاقة مختلفة، وخيار بالعلاقة الصحيحة وترتيب معكوس.</p>
<p><b>الارتباط والاختلاف:</b> أربع كلمات، ثلاث منها يجمعها رابط. ابحث عن الصفة المشتركة لا عن الكلمة الغريبة، وإن وجدت أكثر من تصنيف فاختر الأدق الذي يُخرج كلمة واحدة فقط.</p>

<h4>الخطأ السياقي <span class="w">10%</span></h4>
<p>الخطأ في ==المعنى==، لا في الإملاء ولا النحو. كلمة واحدة تناقض بقية الجملة.</p>
<ol>
<li>اقرأ الجملة وافهم ما تريد قوله إجمالاً.</li>
<li>اسأل عن كل كلمة من الخيارات: هل تنسجم مع الباقي؟</li>
<li>جرّب عكسها. إذا استقام المعنى فهي الخطأ؛ فالكلمة الخاطئة غالباً ضدّ الصحيحة.</li>
</ol>
<p class="ex">«كان الطقس بارداً، فخرج الناس بملابس <u>خفيفة</u> اتقاءً للبرد». الصواب: ثقيلة.</p>

<h4>إكمال الجمل <span class="w">7%</span></h4>
<ol>
<li>اقرأ الجملة كاملة وتوقّع الكلمة ==قبل== أن تنظر في الخيارات.</li>
<li>أمسك أداة الربط: «لكنّ، بل، مع أنّ، غير أنّ، على الرغم من» تعكس المعنى. «لذلك، ومن ثَمّ» تبني نتيجة. «و، كما» تواصل المعنى نفسه.</li>
<li>في الفراغين: اختبر فراغاً واحداً لتحذف خيارين، ثم تحقق من الثاني.</li>
<li>اقرأ الجملة بالخيار الذي اخترته قراءة أخيرة.</li>
</ol>
`},

id: "quant", title: "الكمي", sum: "45% من الاختبار: الحساب، الهندسة، البيانات، الجبر، والمقارنة",
html: `
<h4>ست قواعد لكل سؤال كمي</h4>
<ol>
<li><b>اقرأ المطلوب أولاً.</b> قد يُطلب 2س − 5 لا س، أو الباقي لا المصروف.</li>
<li><b>بسّط قبل أن تضرب.</b> لا آلة حاسبة، فاختصر الكسور وقرّب حين تتباعد الخيارات.</li>
<li><b>جرّب الخيارات.</b> ابدأ بالأوسط ليدلّك على الاتجاه.</li>
<li><b>افرض أرقاماً سهلة.</b> في النسب افرض 100، وفي السرعة والعمل افرض عدداً يقبل القسمة.</li>
<li><b>ارسم.</b> كل مسألة هندسة أو حركة تُرسم. والرسم المعطى ليس على القياس، فاعتمد على الأرقام.</li>
<li><b>راقب الوحدات:</b> دقيقة وساعة، متر وكيلومتر، سم^2 و م^2.</li>
</ol>

<h4>أسئلة المقارنة</h4>
<p>خياراتها ثابتة: (أ) القيمة الأولى أكبر، (ب) القيمة الثانية أكبر، (ج) القيمتان متساويتان، (د) المعطيات غير كافية.</p>
<ul>
<li>إذا كانت القيمتان أعداداً معلومة فالجواب ==ليس (د) أبداً==.</li>
<li>بسّط الطرفين معاً: اطرح الشيء نفسه منهما، أو اقسمهما على عدد موجب.</li>
<li>مع المجاهيل جرّب أربعة أنواع: عدداً أكبر من 1، كسراً بين 0 و1، الصفر، عدداً سالباً. إن تغيّرت النتيجة فالجواب (د).</li>
</ul>

<h4>الحساب <span class="w">23%</span></h4>
<table class="t">
<thead><tr><th>القاعدة</th><th>مثال</th></tr></thead>
<tbody>
<tr><td>س% من ص = ص% من س</td><td>16% من 25 = 25% من 16 = 4</td></tr>
<tr><td>زيادة ثم نقص بالنسبة نفسها لا تعيدان الأصل</td><td>زيادة 20% ثم نقص 20% = نقص 4%</td></tr>
<tr><td>السعر قبل الخصم = المدفوع ÷ النسبة الباقية</td><td>دفع 140 بعد خصم 30%: 140 ÷ 0,7 = 200</td></tr>
<tr><td>نسبة التغير = الفرق ÷ القيمة القديمة</td><td>من 40 إلى 60: 20 ÷ 40 = 50%</td></tr>
<tr><td>المجموع = المتوسط × العدد</td><td>متوسط 4 اختبارات 82: مجموعها 328</td></tr>
<tr><td>التناسب العكسي: حاصل الضرب ثابت</td><td>12 × 15 = 20 × 9</td></tr>
<tr><td>المتقابلان تُجمع سرعتاهما</td><td>70 و50 يقتربان بسرعة 120</td></tr>
<tr><td>متوسط السرعة = المسافة الكلية ÷ الزمن الكلي</td><td>60 ذهاباً و40 عودة = 48 لا 50</td></tr>
<tr><td>العمل المشترك: اجمع ما يُنجز في اليوم</td><td>{1/6} + {1/12} = {1/4} أي 4 أيام</td></tr>
<tr><td>مقارنة كسرين بالضرب التبادلي</td><td>{3/7} و {5/12}: 36 أكبر من 35</td></tr>
<tr><td>الأسس: تُجمع عند الضرب وتُطرح عند القسمة</td><td>2^5 × 2^3 = 2^8</td></tr>
</tbody>
</table>
<p><b>قابلية القسمة:</b> على 3 إذا قبل مجموع أرقامه القسمة على 3، وعلى 9 كذلك مع 9. على 4 إذا قبلها آخر رقمين. على 6 إذا كان زوجياً ويقبل القسمة على 3.</p>

<h4>الهندسة <span class="w">10%</span></h4>
<ul>
<li>مجموع زوايا المثلث 180°، والرباعي 360°، والمضلع الذي عدد أضلاعه ن يساوي (ن − 2) × 180°.</li>
<li>مجموع الزوايا الخارجية لأي مضلع 360°.</li>
<li>في المثلث: الضلع المقابل للزاوية الأكبر أطول.</li>
<li>فيثاغورس: مربع الوتر = مجموع مربعي الضلعين القائمين. احفظ الثلاثيات: (3، 4، 5) و (5، 12، 13) و (8، 15، 17) و (7، 24، 25) ومضاعفاتها.</li>
<li>المساحات: المستطيل = الطول × العرض. المثلث = {1/2} × القاعدة × الارتفاع. متوازي الأضلاع = القاعدة × الارتفاع. شبه المنحرف = {1/2} × مجموع القاعدتين × الارتفاع. الدائرة = ط نق^2.</li>
<li>محيط الدائرة = 2 ط نق، و ط تساوي 3,14 أو {22/7} تقريباً.</li>
<li>الحجوم: المكعب = ل^3. متوازي المستطيلات = الطول × العرض × الارتفاع. الأسطوانة = ط نق^2 ع.</li>
<li>المساحة المظللة = مساحة الشكل الكبير − مساحة الشكل الصغير.</li>
<li>إذا تضاعف طول الضلع تضاعفت المساحة 4 مرات والحجم 8 مرات.</li>
</ul>

<h4>تفسير البيانات <span class="w">8%</span></h4>
<ul>
<li>اقرأ العنوان والمحورين والوحدة قبل السؤال. عبارة «بالآلاف» تغيّر الجواب.</li>
<li>القطاع الدائري: زاوية القطاع = النسبة × 360°.</li>
<li>المتوسط = المجموع ÷ العدد. الوسيط = القيمة الوسطى بعد الترتيب. المنوال = الأكثر تكراراً. المدى = الأكبر − الأصغر.</li>
<li>الاحتمال = عدد النواتج المطلوبة ÷ عدد النواتج الممكنة.</li>
</ul>

<h4>الجبر <span class="w">4%</span></h4>
<ul>
<li>ما تفعله في طرف المعادلة افعله في الطرف الآخر.</li>
<li>المتطابقات: (س + ص)^2 = س^2 + 2 س ص + ص^2، و س^2 − ص^2 = (س − ص)(س + ص).</li>
<li>معادلتان بمجهولين: اجمعهما أو اطرحهما ليختفي مجهول.</li>
<li>إذا ضُرب طرفا المتباينة في عدد سالب انعكست إشارتها.</li>
<li>حين تتعقد المعادلة عوّض بالخيارات.</li>
</ul>
`},

html: `

id: "day", title: "يوم الاختبار المحوسب", sum: "قبله بأسبوع، الليلة السابقة، وأمام الشاشة",
html: `
<h4>قبله بأسبوع</h4>
<ul>
<li>حل قسمين على الأقل من شاشة لا من ورق، لتعتاد القراءة والحل بلا كتيّب أسئلة.</li>
<li>درّب يدك على المسودة: انقل معطيات كل مسألة كمية إليها بدل الحساب في الذهن.</li>
<li>اضبط نومك على ساعة اختبارك.</li>
</ul>
<h4>الليلة السابقة</h4>
<ul>
<li>لا معلومة جديدة. تصفّح دفتر الأخطاء نصف ساعة ثم أغلقه.</li>
<li>جهّز أصل إثبات الهوية، وراجع موعد الحضور ومقر الاختبار في حسابك.</li>
<li>نم مبكراً. ساعة نوم أنفع من ساعة مراجعة.</li>
</ul>
<h4>الصباح</h4>
<ul>
<li>فطور خفيف وماء.</li>
<li>احضر قبل الموعد بنصف ساعة على الأقل.</li>
<li>لا آلة حاسبة ولا جوال في القاعة.</li>
</ul>
<h4>أمام الشاشة</h4>
<ul>
<li>اسأل المراقب عن المسودة قبل أن يبدأ الوقت، واستعملها في كل مسألة كمية.</li>
<li>الساعة التنازلية أمامك. طبّق عليها النظرات الثلاث.</li>
<li>لا تترك سؤالاً بلا إجابة قبل انتهاء وقت القسم؛ فالقسم لا يُفتح بعد ذلك.</li>
<li>بين الأقسام: ما مضى مضى. قسم سيئ لا يفسد اختباراً إلا إذا حملته معك.</li>
<li>إذا توترت: ثلاثة أنفاس عميقة، ثم السؤال الذي أمامك فقط.</li>
</ul>
`}

const AR='٠١٢٣٤٥٦٧٨٩';
function ar(s){return String(s).replace(/[0-9]/g,d=>AR[d]).replace(/%/g,'٪');}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fx(s){
  return s
    .replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>')
    .replace(/\^([٠-٩]+)/g,'<sup>$1</sup>')
    .replace(/\{([^{}\/]+)\/([^{}\/]+)\}/g,'<span class="fr"><span class="fn">$1</span><span class="fd">$2</span></span>')
    .replace(/([٠-٩]) (م|سم|كم)(?![\u0600-\u06FF])/g,'$1\u00A0$2')
    .replace(/(كم\/س|م\/ث)/g,'<span class="nw">$1</span>')
    .replace(/\[\[(.+?)\]\]/g,'<u class="cand">$1</u>')
    .replace(/==(.+?)==/g,'<mark>$1</mark>');
}

function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);const t=a[i];a[i]=a[j];a[j]=t;}return a;}

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12);}

function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ymd(d);}

function fdate(s,o){o=o||{};const d=pd(s);return (o.wd===false?'':WD[d.getDay()]+' ')+ar(d.getDate())+' '+MO[d.getMonth()]+(o.y?' '+ar(d.getFullYear()):'');}

function dur(m){if(!m)return '';if(m<60)return ar(m)+' د';const h=Math.floor(m/60),r=m%60;return ar(h)+' س'+(r?' '+ar(r)+' د':'');}
function clock(sec){sec=Math.max(0,Math.ceil(sec));const m=Math.floor(sec/60),s=sec%60;return ar(String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'));}

function clean(s){
  s.runs=(Array.isArray(s.runs)?s.runs:[]).slice(-80).map(r=>{
    r=r&&typeof r==='object'?r:{};const by={};
    GR.forEach(g=>{const a=r.by&&r.by[g.k];if(Array.isArray(a))by[g.k]=[Math.max(0,a[0]|0),Math.max(0,a[1]|0)];});
    return {t:+r.t||0,k:String(r.k||'').slice(0,8),sec:r.sec|0,title:String(r.title||'').slice(0,60),c:Math.max(0,r.c|0),n:Math.max(1,r.n|0),secs:Math.max(0,r.secs|0),by:by};
  });
  const w={},sw=s.wrong&&typeof s.wrong==='object'?s.wrong:{};
  Object.keys(sw).forEach(id=>{if(QBY[id]){const x=sw[id]||{};w[id]={n:Math.max(1,x.n|0),t:+x.t||0,r:REASON[x.r]?x.r:''};}});
  s.wrong=w;
  s.notes=(Array.isArray(s.notes)?s.notes:[]).slice(-300).map((n,i)=>{
    n=n&&typeof n==='object'?n:{};
    return {id:String(n.id||'').replace(/[^a-z0-9]/gi,'').slice(0,16)||('n'+i),t:+n.t||0,p:n.p==='كمي'?'كمي':'لفظي',r:REASON[n.r]?n.r:'know',x:String(n.x||'').slice(0,600)};

  s.done=d;
  s.sprint=Math.max(0,s.sprint|0);s.u=+s.u||0;s.sent=+s.sent||0;
  return s;
}
function norm(o){
  if(!o||typeof o!=='object')o={};
  const s=Object.assign(blank(),o);
  s.cfg=Object.assign(blank().cfg,(o.cfg&&typeof o.cfg==='object')?o.cfg:{});
  clean(s);
  const t=today();
  s.cfg.ok=!!s.cfg.ok;
  if(!validDate(s.cfg.start)||diff(s.cfg.start,t)<0)s.cfg.start=t;
  if(!s.cfg.ok||!validDate(s.cfg.test)){s.cfg.test=addDays(t,DEF_DAYS);s.cfg.start=t;s.cfg.ok=false;}
  s.cfg.target=clamp(Math.round(+s.cfg.target)||90,60,100);
  s.cfg.cur=clamp(Math.round(+s.cfg.cur)||79,0,100);
  const l=s.live;
  if(!l||!Array.isArray(l.parts)||!l.parts.length||!l.parts.every(p=>Array.isArray(p.ids)&&p.ids.every(id=>QBY[id])))s.live=null;
  return s;
}

function snapNorm(o){
  if(!o||typeof o!=='object'||!o.cfg||typeof o.cfg!=='object')throw new Error('bad');
  const s=Object.assign(blank(),o);
  s.cfg=Object.assign(blank().cfg,o.cfg);

  s.cfg.target=clamp(Math.round(+s.cfg.target)||90,60,100);
  s.cfg.cur=clamp(Math.round(+s.cfg.cur)||79,0,100);
  s.live=null;
  return clean(s);
}

let dbp=null;
function idb(){
  if(dbp)return dbp;
  dbp=new Promise(res=>{
    try{
      const r=indexedDB.open('qudurat-abdullah',1);
      r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv');}catch(e){}};
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>res(null);
      r.onblocked=()=>res(null);
    }catch(e){res(null);}
  });
  return dbp;
}
function idbRead(){
  return idb().then(db=>new Promise(res=>{
    if(!db)return res(null);
    try{const q=db.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}
  }));
}
function idbWrite(t){
  return idb().then(db=>new Promise(res=>{
    if(!db)return res(false);
    try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(t,KEY);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);}catch(e){res(false);}
  }));
}

function goalFor(n,target){return Math.min(n,Math.ceil(n*target/100));}
function goalOf(n){return goalFor(n,S.cfg.target);}
let planCache=null;const planMemo={};
function plan(){return planFor(S.cfg);}
function planFor(c){
  const k=c.start+'|'+c.test+'|'+c.target;
  if(planMemo[k])return planMemo[k];
  const n=diff(c.start,c.test),daysA=[],ph=[];
  if(n>0){
    const W=Math.max(0,n-2);
    let a=0,b=0,cc=W;
    if(W>=3){
      const f=W>=33?[.4,.35]:W>=13?[.3,.4]:[.2,.4];
      a=Math.max(1,Math.round(W*f[0]));b=Math.max(1,Math.round(W*f[1]));cc=W-a-b;
      if(cc<1){b=Math.max(1,b-(1-cc));cc=W-a-b;}
    }
    const secAt={};
    for(let s=1;s<=5;s++){const i=W>=5?Math.round((s-1)*(W-1)/4):(s-1);if(i<W&&secAt[i]==null)secAt[i]=s;}
    for(let i=0;i<n;i++){
      const date=addDays(c.start,i),wd=pd(date).getDay();let p,tasks;
      if(i===n-1){p=4;tasks=T.eve();}
      else if(i===n-2){p=4;tasks=T.light();}
      else{
        p=i<a?1:i<a+b?2:3;
        const j=p===1?i:p===2?i-a:i-a-b;
        tasks=T['p'+p](wd,j).slice();
        if(secAt[i])tasks.unshift(T.sec(secAt[i],i===0));
      }
      daysA.push({date,i,ph:p,tasks});
    }
    daysA.push({date:c.test,i:n,ph:5,tasks:T.testday()});
    const add=(kk,from,len,goal)=>{if(len>0)ph.push({k:kk,name:PH[kk],from:addDays(c.start,from),to:addDays(c.start,from+len-1),len,goal});};
    add(1,0,a,'أكمل دروس التأسيس في دورتَي اللفظي والكمي، وحل تدريب كل درس يوم مشاهدته. الغاية ألا يبقى نوع لا تعرف طريقته.');
    add(2,a,b,'بنوك الأسئلة بالساعة، ودفتر الأخطاء كل يوم. هدفك التدريبي: '+goalFor(24,c.target)+' صحيحة من 24 في القسم الموقوت.');
    add(3,a+b,cc,'اختبارات كاملة في ظروف الاختبار. المطلوب ثبات النتيجة والتوقيت، لا معلومات جديدة.');
    add(4,W,n-W,'مراجعة خفيفة ونوم كافٍ. لا جديد.');
  }
  const P={k,n,days:daysA,ph,by:{}};
  daysA.forEach(d=>{P.by[d.date]=d;});
  planMemo[k]=P;
  return P;
}

function ruler(cur,goal){
  const X=v=>300-(clamp(v,60,100)-60)*7;
  let t='';
  for(let v=60;v<=100;v++){
    const x=X(v),h=v%10===0?12:v%5===0?8:4;
    t+='<line class="tk" x1="'+x+'" y1="46" x2="'+x+'" y2="'+(46+h)+'"/>';
    if(v%10===0)t+='<text x="'+x+'" y="72" text-anchor="middle">'+ar(v)+'</text>';
  }
  const xc=X(cur),xg=X(goal);
  let lc=xc,lg=xg;const gap=Math.abs(xc-xg);
  if(gap<50){const sh=(50-gap)/2;if(xc>=xg){lc+=sh;lg-=sh;}else{lc-=sh;lg+=sh;}}

function qLine(q){

  }else{

        +'<details class="fold"><summary><span>الحل والشرح</span></summary><div class="in">'+qBody(q,{chosen:null,reveal:true,live:false,fold:true})+'<div class="explain"><b>الشرح</b>'+mk(q.e)+'</div>'
        +'<div class="btns"><button class="btn sm ghost" type="button" data-act="fixed">أتقنته، احذفه من الدفتر</button></div></div></details></div>';
    });

  }
  h+='</section>';
  h+='<section class="sheet"><div class="eyebrow"><span><b>أخطاء من دورتك</b></span><span>'+(S.notes.length?ar(S.notes.length+''):'تكتبها أنت')+'</span></div>'

    +'<label class="field" for="n-r">السبب<select id="n-r">'+Object.keys(REASON).map(k=>'<option value="'+k+'">'+REASON[k]+'</option>').join('')+'</select></label>'
    +'<label class="field" for="n-text">الخطأ والقاعدة<textarea id="n-text" placeholder="مثال: حسبت نسبة الربح من سعر البيع. القاعدة: الربح يُنسب إلى التكلفة."></textarea></label>'
    +'<div class="btns"><button class="btn" type="button" data-act="note-add">أضف إلى الدفتر</button></div><div>'
    +S.notes.slice().reverse().map(n=>'<div class="notei"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><div class="chips"><span class="chip form">'+esc(n.p)+'</span><span class="chip">'+(REASON[n.r]||'')+'</span><span class="chip">'+fdate(ymd(new Date(n.t)),{wd:false})+'</span></div><p>'+esc(n.x)+'</p></div><button class="btn sm quiet" type="button" data-act="note-del" data-id="'+esc(n.id)+'" aria-label="حذف هذا السطر">حذف</button></div>').join('')

function figHTML(fid){

    for(let v=0;v<=f.max;v+=f.step){const y=t+ph-(v/f.max)*ph;b+='<line class="grid" x1="'+l+'" y1="'+y+'" x2="'+(W-r)+'" y2="'+y+'"/><text x="'+(W-r+16)+'" y="'+(y+4)+'" text-anchor="middle">'+ar(v)+'</text>';}
    f.values.forEach((v,i)=>{const cx=W-r-(i+0.5)*slot,hh=(v/f.max)*ph;b+='<rect class="barf" x="'+(cx-bw/2)+'" y="'+(t+ph-hh)+'" width="'+bw+'" height="'+hh+'"/><text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+esc(f.labels[i])+'</text>';});
    b+='<line class="axis" x1="'+l+'" y1="'+(t+ph)+'" x2="'+(W-r)+'" y2="'+(t+ph)+'"/><line class="axis" x1="'+(W-r)+'" y1="'+t+'" x2="'+(W-r)+'" y2="'+(t+ph)+'"/>';

    f.parts.forEach((p,i)=>{const a1=a0+p[1]/100*2*Math.PI,x0=80+70*Math.cos(a0),y0=80+70*Math.sin(a0),x1=80+70*Math.cos(a1),y1=80+70*Math.sin(a1);
      s+='<path d="M80 80L'+x0.toFixed(2)+' '+y0.toFixed(2)+'A70 70 0 '+(p[1]>50?1:0)+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'Z" style="fill:var(--p'+(i+1)+');stroke:var(--sheet);stroke-width:1.5"/>';a0=a1;});
    b='<svg viewBox="0 0 160 160" style="max-width:190px" role="img" aria-label="'+esc(ar(f.title))+'">'+s+'</svg><div class="pie-leg">'

      +f.rows.map(r=>'<tr>'+r.map((x,i)=>'<td'+(i?' class="c"':'')+'>'+mk(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }else if(f.kind==='inscribed'){

  }

}
function qBody(q,o){
  let h='';

  if(q.f)h+=figHTML(q.f);
  if(q.c){
    h+='<div class="stem"'+(o.live?' id="qs"':'')+'>'+(q.stem?mk(q.stem)+' ':'')+'قارن بين القيمتين:</div>'
      +'<div class="cmp"><div><small>القيمة الأولى</small><span>'+mk(q.c[0])+'</span></div><div><small>القيمة الثانية</small><span>'+mk(q.c[1])+'</span></div></div>';
  }else{
    h+='<div class="stem'+(q.t==='an'?' pair':'')+'"'+(o.live?' id="qs"':'')+'>'+mk(q.stem)+'</div>';
  }
  h+='<div class="opts">'+q.o.map((t,i)=>{
    let cls='opt',tag='';const on=i===o.chosen;

let run=null, sp=null, tickT=null;

}
function startRun(spec){
  sp=null;fw=null;
  run={kind:spec.kind,title:spec.title,sec:spec.sec||0,parts:spec.parts,pi:0,qi:0,ans:{},flag:{},fb:!!spec.fb,acc:0,base:Date.now(),paused:false,used:[],stage:'q',auto:false};

}
function resumeRun(){
  const l=S.live;if(!l)return;
  sp=null;fw=null;
  run={kind:l.kind,title:l.title,sec:l.sec||0,parts:l.parts,pi:l.pi||0,qi:l.qi||0,ans:l.ans||{},flag:l.flag||{},fb:!!l.fb,acc:+l.acc||0,base:Date.now(),paused:true,used:l.used||[],stage:l.stage==='break'?'break':(part0Timed(l)?'paused':'q'),auto:!!l.auto};

function part0Timed(l){const p=l.parts[l.pi||0];return !!(p&&p.limit);}
function openRunner(){runner.hidden=false;document.body.style.overflow='hidden';drawRunner(0);clearInterval(tickT);tickT=setInterval(onTick,250);}
function closeRunner(){clearInterval(tickT);tickT=null;run=null;sp=null;fw=null;runner.hidden=true;runner.innerHTML='';document.body.style.overflow='';closeModal();draw();}
function onTick(){
  if(fw)return;
  if(sp){sprintTick();return;}
  if(!run||run.stage!=='q'||run.paused)return;
  const lim=part().limit;if(!lim)return;
  const left=lim-elapsed(),el=$('#tm');
  if(el){el.textContent=clock(left);el.classList.toggle('low',left<=120);}
  if(left<=0)endPart(true);
}
function pauseRun(){if(!run||run.stage!=='q'||run.paused||!part().limit)return;run.acc=elapsed();run.paused=true;run.stage='paused';persist();drawRunner(0);}
function unpause(){if(!run)return;run.base=Date.now();run.paused=false;run.stage='q';drawRunner(0);}
function drawRunner(scroll){
  if(fw){const b=$('#rb'),k=b?b.scrollTop:0,ta=$('#f-code'),tv=ta?ta.value:'';runner.innerHTML=followScreen();const nb=$('#rb'),nt=$('#f-code');if(nb&&scroll==='keep')nb.scrollTop=k;if(nt&&scroll==='keep')nt.value=tv;return;}
  if(sp){runner.innerHTML=sprintScreen();return;}
  if(!run)return;
  const rb=$('#rb'),keep=rb?rb.scrollTop:0;
  runner.innerHTML=run.stage==='q'?qScreen():run.stage==='paused'?pauseScreen():run.stage==='break'?breakScreen():resScreen();
  const nb=$('#rb');

}
function qScreen(){

function endPart(auto){
  closeModal();
  const p=part();
  run.used[run.pi]=p.limit?Math.min(p.limit,elapsed()):elapsed();
  run.auto=!!auto;
  if(run.pi<run.parts.length-1){run.acc=0;run.paused=true;run.stage='break';persist();drawRunner(0);}
  else finishRun();

function finishRun(){
  const ids=[].concat.apply([],run.parts.map(p=>p.ids)),by={},timed=!!run.parts[0].limit;
  let c=0,skipped=0,added=0;
  ids.forEach(id=>{
    const q=QBY[id],g=GOF[q.t],a=run.ans[id];
    by[g]=by[g]||[0,0];by[g][1]++;
    if(a===q.a){c++;by[g][0]++;if(S.wrong[id])delete S.wrong[id];}
    else{
      if(a==null)skipped++;
      const w=S.wrong[id]||{n:0,r:''};
      if(!S.wrong[id])added++;
      w.n=(w.n||0)+1;w.t=Date.now();
      if(a==null&&timed&&!w.r)w.r='time';
      S.wrong[id]=w;
    }
  });
  const secs=Math.round(run.used.reduce((s,x)=>s+(x||0),0));
  const parts=run.parts.map(p=>({name:p.name,c:p.ids.filter(id=>run.ans[id]===QBY[id].a).length,n:p.ids.length}));
  S.runs.push({t:Date.now(),k:run.kind,sec:run.sec||0,title:run.title,c:c,n:ids.length,secs:secs,by:by});
  if(S.runs.length>80)S.runs=S.runs.slice(-80);
  run.res={c:c,n:ids.length,by:by,secs:secs,skipped:skipped,added:added,parts:parts,ids:ids,timed:timed};
  run.stage='res';S.live=null;save();drawRunner(0);
}
function resScreen(){
  const R=run.res,pc=Math.round(R.c/R.n*100),g=goalOf(R.n);
  let h='<div class="r-top"><div class="ttl"><b>'+esc(ar(run.title))+'</b><span>النتيجة</span></div><button class="btn sm" type="button" data-act="close-run">تم</button></div>'
    +'<div class="r-body" id="rb"><div class="r-in">';
  let msg;
  if(run.kind==='redo')msg=R.c===R.n?'حللتها كلها صحيحة، فخرجت من دفتر الأخطاء.':ar('خرج من الدفتر '+R.c+'، وبقي '+(R.n-R.c)+'. عد إليها بعد أيام.');
  else if(R.c>=g)msg=ar('بلغت هدفك التدريبي ('+g+' من '+R.n+'). ثبّته في القسم التالي.');

  }

    +R.ids.map((id,i)=>{

    }).join('')+'</div></section>';

}

/* ================= سباق الحساب الذهني ================= */
const F2P=[[1,4,25],[3,4,75],[1,5,20],[2,5,40],[3,5,60],[4,5,80],[1,8,12.5],[3,8,37.5],[5,8,62.5],[7,8,87.5],[1,20,5],[3,20,15],[1,25,4],[1,50,2],[1,10,10],[3,10,30]];
function fmtN(v){return String(v).replace('.',',');}
function numOpts(ans,cands){
  const set=[];
  shuffle(cands).forEach(v=>{v=Math.round(v*10)/10;if(v>0&&v!==ans&&set.indexOf(v)<0&&set.length<3)set.push(v);});
  let k=1;
  while(set.length<3){const v=ans+k;if(set.indexOf(v)<0)set.push(v);k++;}
  const all=set.concat([ans]).sort((x,y)=>x-y);
  return {o:all.map(fmtN),a:all.indexOf(ans)};
}
function genSprint(){
  const k=rnd(0,5);let text,ans,r;
  if(k===0){const a=rnd(6,19),b=rnd(3,12);ans=a*b;text=a+' × '+b;r=numOpts(ans,[ans+a,ans-a,ans+b,ans-b,ans+10,ans-10,ans+2]);}
  else if(k===1){const n=rnd(11,25);ans=n*n;text=n+'^2';r=numOpts(ans,[(n+1)*(n+1),(n-1)*(n-1),ans+10,ans-10,ans+20,ans-20,ans+n]);}
  else if(k===2){const p=[5,10,15,20,25,30,40,60,75][rnd(0,8)],n=[40,60,80,120,160,200,240,360][rnd(0,7)];ans=p*n/100;text=p+'% من '+n;r=numOpts(ans,[ans*2,ans/2,ans+n/10,ans-n/10,ans+n/20,ans+5,ans-5,ans*10]);}
  else if(k===3){const f=F2P[rnd(0,F2P.length-1)];ans=f[2];text='{'+f[0]+'/'+f[1]+'} = ؟';const c=shuffle(F2P.map(x=>x[2]).filter(v=>v!==ans));r=numOpts(ans,c);r.o=r.o.map(x=>x+'%');}
  else if(k===4){const b=rnd(3,12),q=rnd(6,19);ans=q;text=(b*q)+' ÷ '+b;r=numOpts(ans,[q+1,q-1,q+2,q-2,q+b,q+3]);}
  else{const a=rnd(23,89),b=rnd(14,68);if(rnd(0,1)){ans=a+b;text=a+' + '+b;}else{const hi=Math.max(a,b)+rnd(11,40),lo=Math.min(a,b);ans=hi-lo;text=hi+' − '+lo;}r=numOpts(ans,[ans+10,ans-10,ans+1,ans-1,ans+2,ans-2,ans+9,ans-9]);}
  return {text:text,o:r.o,a:r.a};
}
function startSprint(){run=null;fw=null;sp={c:0,n:0,q:genSprint(),base:Date.now(),over:false,lock:false,pick:null};openRunner();}
function sprintTick(){
  if(sp.over)return;
  const left=60-(Date.now()-sp.base)/1000,el=$('#tm');
  if(el){el.textContent=clock(left);el.classList.toggle('low',left<=10);}
  if(left<=0){sp.over=true;if(sp.c>S.sprint){sp.best=true;S.sprint=sp.c;save();}drawRunner(0);}
}

      +'<div class="kv"><span>المحاولات <b>'+ar(sp.n)+'</b></span><span>أفضل نتيجة <b>'+ar(S.sprint)+'</b></span></div>'
      +'<p class="prose sm">'+ar((sp.best?'رقم جديد. ':'')+(sp.c>=15?'سرعة ممتازة. حافظ عليها بجولة كل يوم.':sp.c>=9?'جيد. الهدف 15 عملية صحيحة في الدقيقة.':'راجع ورقة القوانين ثم أعد. الهدف الأول 9 صحيحة.'))+'</p>'
      +'<div class="btns stretch" style="width:100%"><button class="btn" type="button" data-act="sprint">جولة أخرى</button><button class="btn ghost" type="button" data-act="close-run">تم</button></div></div>';
  }else{
    h+='<div class="sprint-q">'+mk(sp.q.text)+'</div><div class="sprint-o">'+sp.q.o.map((t,i)=>{

/* ================= رمز التقدم: إرسال واستعادة ================= */
function b64enc(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s);}
function b64dec(t){const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function shareable(st){return {v:1,u:st.u,cfg:st.cfg,done:st.done,runs:st.runs,wrong:st.wrong,notes:st.notes,sprint:st.sprint};}
function pack(st){
  const bytes=new TextEncoder().encode(JSON.stringify(shareable(st)));
  const plain=()=>'Q1.'+b64enc(bytes);
  if(typeof CompressionStream!=='function'||typeof Response!=='function')return Promise.resolve(plain());
  try{
    const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Response(stream).arrayBuffer().then(b=>'Q2.'+b64enc(new Uint8Array(b)),plain);
  }catch(e){return Promise.resolve(plain());}
}
function unpack(text){
  text=String(text||'');
  const RX=/Q([12])\.([A-Za-z0-9+\/=]{16,})/;
  const dec=m=>{
    const bytes=b64dec(m[2]);
    const parse=b=>({o:JSON.parse(new TextDecoder().decode(b)),code:'Q'+m[1]+'.'+m[2]});
    if(m[1]==='1')return Promise.resolve(parse(bytes));
    if(typeof DecompressionStream!=='function')return Promise.reject(new Error('unsupported'));
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(b=>parse(new Uint8Array(b)));
  };
  const attempt=x=>{const m=x.match(RX);if(!m)return Promise.reject(new Error('none'));try{return dec(m);}catch(e){return Promise.reject(e);}};
  const flat=text.replace(/\s+/g,'');
  return attempt(text).catch(()=>attempt(flat)).catch(()=>new Promise((res,rej)=>{
    try{res({o:JSON.parse(decodeURIComponent(escape(atob(flat)))),code:flat});}catch(e){rej(e);}
  }));
}
function tally(st){
  const t=today(),P=planFor(st.cfg);
  const cnt=d=>d.tasks.filter((x,i)=>st.done[d.date+'#'+i]).length;
  const past=P.days.filter(d=>d.date<=t&&d.ph!==5);
  let dn=0,tot=0;past.forEach(d=>{dn+=cnt(d);tot+=d.tasks.length;});
  const last7=past.slice(-7);let d7=0,t7=0;last7.forEach(d=>{d7+=cnt(d);t7+=d.tasks.length;});
  const td=P.by[t]&&P.by[t].ph!==5?P.by[t]:null;
  const timed=st.runs.filter(r=>r.k==='sec'||r.k==='full');
  return {t:t,P:P,cnt:cnt,past:past,last7:last7,dn:dn,tot:tot,d7:d7,t7:t7,td:td,tdDone:td?cnt(td):0,lastT:timed.length?timed[timed.length-1]:null,left:diff(t,st.cfg.test)};
}
function lastDays(n){return n===1?'يوم':n===2?'يومين':days(n);}
function tw(n){return n>=3&&n<=10?'مهام':'مهمة';}
function messageText(st){
  const y=tally(st),L=[];
  L.push('تقدّمي في القدرات · '+fdate(y.t));
  if(y.td)L.push(ar('مهام اليوم: '+y.tdDone+' من '+y.td.tasks.length));
  if(y.t7&&y.last7.length>=2)L.push('آخر '+lastDays(y.last7.length)+ar(': '+y.d7+' من '+y.t7+' ')+tw(y.t7));
  L.push(y.lastT?ar('آخر اختبار موقوت: '+y.lastT.title+'، '+y.lastT.c+' من '+y.lastT.n):'لم أحل اختباراً موقوتاً بعد');
  L.push(ar('في دفتر الأخطاء: '+Object.keys(st.wrong).length));
  if(y.left>0)L.push('باقٍ على الاختبار: '+days(y.left));
  L.push('رمز المتابعة، الصق الرسالة كلها في لوحة المتابعة:');
  return L.join('\n');
}
function bestSec(st,n){let b=null;st.runs.forEach(r=>{if(r.k==='sec'&&r.sec===n&&(b==null||r.c>b))b=r.c;});return b;}
function summaryObj(st){
  const y=tally(st),best={};
  [1,2,3,4,5].forEach(n=>{const b=bestSec(st,n);if(b!=null)best['s'+n]=b;});
  return {lastActivity:st.u?new Date(st.u).toISOString():'',testDate:st.cfg.test,dateConfirmed:!!st.cfg.ok,current:st.cfg.cur,target:st.cfg.target,
    tasksDone7:y.d7,tasksPlanned7:y.t7,tasksDoneAll:y.dn,tasksPlannedAll:y.tot,runs:st.runs.length,
    lastTimed:y.lastT?{title:y.lastT.title,correct:y.lastT.c,of:y.lastT.n,date:ymd(new Date(y.lastT.t))}:{},
    bestBySection:best,mistakes:Object.keys(st.wrong).length,courseNotes:st.notes.length,sprintBest:st.sprint};
}
