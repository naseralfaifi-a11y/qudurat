function bandText(c){
  if(c>=81)return 'ضمن أعلى 5% من المختبرين';
  if(c>=78)return 'ضمن أعلى 10% من المختبرين';
  if(c>=73)return 'ضمن أعلى 20% من المختبرين';
  if(c>=70)return 'ضمن أعلى 30% من المختبرين';
  if(c>=65)return 'فوق متوسط المختبرين';
  return 'دون متوسط المختبرين، وهو 65';
}
/* مسطرة الدرجات. cur = 0 تعني أن لا درجة حقيقية بعد، فيُرسم الهدف وحده. */
function ruler(cur,goal){
  const X=v=>300-(clamp(v,60,100)-60)*7;
  let t='';
  for(let v=60;v<=100;v++){
    const x=X(v),h=v%10===0?12:v%5===0?8:4;
    t+='<line class="tk" x1="'+x+'" y1="46" x2="'+x+'" y2="'+(46+h)+'"/>';
    if(v%10===0)t+='<text x="'+x+'" y="72" text-anchor="middle">'+ar(v)+'</text>';
  }
  const xc=X(cur||60),xg=X(goal);
  let lc=xc,lg=xg;const gap=Math.abs(xc-xg);
  if(cur&&gap<50){const sh=(50-gap)/2;if(xc>=xg){lc+=sh;lg-=sh;}else{lc-=sh;lg+=sh;}}
  lc=clamp(lc,24,296);lg=clamp(lg,24,296);
  return '<svg class="ruler" viewBox="0 0 320 78" role="img" aria-label="'+ar('مسطرة الدرجات من 60 إلى 100: '+(cur?'درجتك '+cur+' و':'')+'هدفك '+goal)+'">'
    +'<rect class="z5" x="'+X(100)+'" y="37" width="'+(X(81)-X(100))+'" height="9"/>'
    +'<rect class="z10" x="'+X(81)+'" y="37" width="'+(X(78)-X(81))+'" height="9"/>'
    +'<line class="ax" x1="20" y1="46" x2="300" y2="46"/>'+t
    +'<path class="avg" d="M'+X(65)+' 46l-4.5 -8h9z"/>'
    +(cur&&cur<goal?'<line class="path" x1="'+(xc-9)+'" y1="27" x2="'+(xg+9)+'" y2="27"/>':'')
    +'<circle class="goal" cx="'+xg+'" cy="27" r="7"/>'
    +(cur?'<circle class="me" cx="'+xc+'" cy="27" r="7"/><text class="lbl" x="'+lc+'" y="12" text-anchor="middle">'+ar('أنت '+cur)+'</text>':'')
    +'<text class="lbl" x="'+lg+'" y="12" text-anchor="middle">'+ar('الهدف '+goal)+'</text>'
    +'</svg>';
}
const LEGEND='<div class="legend"><span class="l5"><i></i>'+ar('أعلى 5%: من 81')+'</span><span class="l10"><i></i>'+ar('أعلى 10%: من 78')+'</span><span class="la"><i></i>'+ar('المتوسط 65')+'</span></div>';
function marks(P,t){
  if(P.n<=0||P.n>140)return '';
  let h='';
  P.days.forEach(d=>{h+='<i class="'+(d.ph===5?'end':d.date<t?'past':d.date===t?'now':'')+'"></i>';});
  return '<div class="marks" role="img" aria-label="'+ar('علامة لكل يوم حتى الاختبار')+'">'+h+'</div>';
}
/* شبكة العادة: عمود لكل أسبوع (الأقدم يميناً)، وصف لكل يوم من الأحد إلى السبت */
function heat(st,weeks,ref){
  const t=ref||today(),end=addDays(t,6-pd(t).getDay()),P=planFor(st.cfg);
  let h='',act=0;
  for(let i=weeks*7-1;i>=0;i--){
    const d=addDays(end,-i);let cls;
    if(d>t)cls='fut';
    else{
      const day=P.by[d],on=activeOn(st,d);
      if(on)act++;
      cls=day&&day.tasks.length&&doneCount(st,day)>=day.tasks.length?'full':on?'some':d<st.cfg.start?'pre':pd(d).getDay()===5?'rest':'';
      if(d===t)cls+=' now';
    }
    h+='<i class="'+cls+'"></i>';
  }
  return '<div class="heat" role="img" aria-label="'+ar('نشاط آخر '+weeks+' أسبوعاً: '+act+' يوماً نشطاً')+'"><div class="hd" aria-hidden="true">'
    +['ح','ن','ث','ر','خ','ج','س'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="hg">'+h+'</div></div>'
    +'<div class="legend hl"><span><i class="full"></i>أُنجزت مهامه كلها</span><span><i class="some"></i>فيه نشاط</span><span><i></i>بلا نشاط</span></div>';
}
function tile(l,v,off){return '<div class="tile'+(off?' off':'')+'"><small>'+l+'</small><b class="num">'+v+'</b></div>';}
function statTiles(st,ref){
  const v=vocStats(st,ref),sk=streakOf(st,ref),a30=activeCount(st,30,ref),q7=answeredIn(st,7,ref)[0];
  return '<div class="tiles">'+tile('سلسلة الأيام',sk?ar(sk):'—',!sk)+tile(ar('نشط من آخر 30 يوماً'),a30?ar(a30):'—',!a30)
    +tile('كلمات أتقنها',v.mast?ar(v.mast):'—',!v.mast)+tile('كلمات عرفها',v.seen?ar(v.seen):'—',!v.seen)
    +tile(ar('أسئلة آخر 7 أيام'),q7?ar(q7):'—',!q7)+tile('سباق الحساب',st.sprint?ar(st.sprint):'—',!st.sprint)+'</div>';
}

function taskRows(d){
  const live=d.date===today();
  return '<div class="rows">'+d.tasks.map((x,i)=>{
    const k=d.date+'#'+i,on=isDone(S,d.date,i),go=live?goBtn(x):'';
    return '<div class="row'+(on?' done':'')+'"><span class="no">'+ar(i+1)+'</span>'
      +'<div class="tk-main">'
      +'<button class="task" type="button" data-act="task" data-k="'+k+'" aria-pressed="'+on+'"><span class="bub'+(on?' on':'')+'"></span><span class="body">'+mk(taskText(x))+'</span></button>'
      +(go?'<div class="tk-go">'+go+'</div>':'')
      +'</div>'
      +(x.m?'<span class="meta">'+dur(x.m)+'</span>':'')+'</div>';
  }).join('')+'</div>';
}
function dayCard(d,t){
  const isT=d.date===t,tot=d.tasks.reduce((s,x)=>s+(x.m||0),0);
  if(!d.tasks.length)return '<section class="sheet day'+(isT?' today':'')+'"><div class="eyebrow"><span><b>'+(isT?'اليوم راحة':fdate(d.date))+'</b>'+(isT?' · '+fdate(d.date):'')+'</span><span>'+PH[d.ph]+'</span></div>'
    +'<p class="prose sm">الجمعة بلا مهام، ولا تنقطع بها السلسلة. إن قرأت شيئاً تحبه فهو مكسب.</p></section>';
  return '<section class="sheet day'+(isT?' today':'')+'">'
    +'<div class="eyebrow"><span><b>'+(isT?'مهام اليوم':fdate(d.date))+'</b>'+(isT?' · '+fdate(d.date):'')+'</span><span>'+PH[d.ph]+(tot?'، '+dur(tot):'')+'</span></div>'
    +taskRows(d)+'</section>';
}
/* المستوى حسب النوع من آخر شهرين فيهما تدريب، حتى يظهر التحسّن ولا تطمسه بدايات السنة */
function skillStatsOf(st){
  const agg={};
  Object.keys(st.sk).sort().slice(-2).forEach(m=>{Object.keys(st.sk[m]).forEach(g=>{agg[g]=agg[g]||[0,0];agg[g][0]+=st.sk[m][g][0];agg[g][1]+=st.sk[m][g][1];});});
  return agg;
}
function weakest(agg){
  return GR.filter(g=>agg[g.k]&&agg[g.k][1]>=4&&agg[g.k][0]/agg[g.k][1]<0.85)
    .sort((x,y)=>agg[x.k][0]/agg[x.k][1]-agg[y.k][0]/agg[y.k][1]).slice(0,2).map(g=>g.k);
}
function skillRows(agg,weak){
  return GR.map(g=>{
    const a=agg[g.k],p=a&&a[1]?Math.round(a[0]/a[1]*100):null;
    return '<div class="skill'+(weak.indexOf(g.k)>=0?' weak':'')+'"><span class="nm">'+g.n+'<small>'+ar(g.w+'% من الاختبار')+'</small></span><span class="v">'+(p==null?'لا بيانات':ar(a[0]+' من '+a[1]+'، '+p+'%'))+'</span><span class="bar"><i style="width:'+(p||0)+'%"></i></span></div>';
  }).join('');
}
function skillsHTML(){
  const agg=skillStatsOf(S),weak=weakest(agg);
  if(!Object.keys(agg).length)return '<p class="prose sm">لا بيانات بعد. كل سؤال تحله في الصفحة يُحسب هنا تحت نوعه، فتعرف مع الأيام أين قوتك وأين تحتاج إلى تدريب.</p>';
  let h=skillRows(agg,weak);
  if(weak.length)h+='<p class="prose sm">الأضعف عندك الآن: <mark>'+weak.map(k=>GRN[k].n).join('</mark> و<mark>')+'</mark>. زد منهما في تبويب «تدريب».</p>';
  return h;
}

function ago(ts){

  return '<section class="sheet"><div class="eyebrow"><span><b>محطات القياس</b></span><span>'+ar('قسم موقوت من 24 سؤالاً')+'</span></div>'
    +'<p class="prose sm">القسم الموقوت مقياس لا تدريب، فلا تحله قبل موعده. نتيجته هي ما يدل على أن العادة اليومية تعمل.</p><div>'
    +P.ck.map(x=>{
      const b=bestOf(x.sec),past=x.date<t;
      return '<div class="mini"><b>'+ar('القسم '+x.sec)+'، '+fdate(x.date,{y:x.date.slice(0,4)!==t.slice(0,4)})+'</b><span>'
        +(b!=null?ar('أفضل نتيجة: '+b+' من 24'):past?'فات موعده ولم يُحل. حله في أقرب سبت.':x.date===t?'موعده اليوم':'لم يحن موعده')+'</span></div>';
    }).join('')+'</div></section>';
}
function vPlan(){
  const t=today(),c=S.cfg,P=plan();
  if(P.n<=0)return '<section class="sheet"><div class="eyebrow"><span>الخطة</span><span></span></div><h2>لا موعد قادم</h2><p class="prose sm">حدّد موعد اختبارك القادم لتُبنى الخطة يوماً بيوم.</p><div class="btns"><button class="btn" type="button" data-act="settings">حدّد الموعد</button></div></section>';
  const cur=P.by[t]?P.by[t].ph:0,long=P.n>70;
  let dn=0,tot=0;
  P.days.forEach(d=>{if(d.date<=t&&d.ph!==5){tot+=d.tasks.length;dn+=doneCount(S,d);}});
  let h='<section class="sheet"><div class="eyebrow"><span>'+fdate(c.start,{wd:false})+' ← '+fdate(c.test,{wd:false,y:1})+'</span><span>'+(tot?ar('أنجزت '+dn+' من '+tot+' ')+tw(tot)+' حتى اليوم':'')+'</span></div>'
    +'<h2>الطريق إلى يوم الاختبار</h2>'
    +'<p class="prose sm">'+(long?'لا توجد خطة تضمن درجة بعينها. هذه الخطة تضمن شيئاً آخر: أن تصل إلى شهرَي الاختبار وقد صارت القراءة والحساب الذهني وأنواع الأسئلة مألوفة عندك، فتبدأ الخطة المكثفة من مكان متقدم.'
      :'لا توجد خطة تضمن درجة بعينها. هذه الخطة تضمن أن وقتك يذهب إلى ما يرفع الدرجة: تأسيس، ثم حل بالساعة، ثم محاكاة، ودفتر أخطاء كل يوم.')+'</p>'
    +(c.cur>0?'':ruler(0,c.target)+LEGEND)+'<div>';
  P.ph.forEach((p,i)=>{
    h+='<div class="phase'+(p.k===cur?' cur':'')+'"><span class="k">'+ar(i+1)+'</span><div class="t"><b>'+p.name+'</b><span>'+fdate(p.from,{wd:false})+(p.len>1?' – '+fdate(p.to,{wd:false}):'')+'، '+days(p.len)+'</span></div><p>'+mk(p.goal)+'</p></div>';
  });
  h+='</div><p class="muted">'+(long?'إذا ضاق يومك فاكتفِ بالمفردات وربع ساعة القراءة، ولا تترك اليوم فارغاً. يوم ناقص خير من يوم منقطع. وفي الإجازات فعّل «وضع الإجازة» من الإعدادات.'
    :'إذا ضاق يومك فاحذف من كمية الأسئلة، لا من مراجعة الأخطاء. وإن لم تنتهِ دروس التأسيس بنهاية مرحلتها فأكملها بدرس واحد يومياً مع الحل الموقوت، ولا تؤجل الحل.')+'</p></section>';
  h+=ckRows(P,t);
  const up=P.days.filter(d=>d.date>=t),past=P.days.filter(d=>d.date<t);
  up.slice(0,7).forEach(d=>{h+=dayCard(d,t);});
  const rest=up.slice(7),lim=long?21:rest.length;
  for(let i=0;i<Math.min(rest.length,lim);i+=7){
    const w=rest.slice(i,i+7);
    h+='<details class="sheet fold"><summary><span><b>'+fdate(w[0].date,{wd:false})+(w.length>1?' – '+fdate(w[w.length-1].date,{wd:false}):'')+'</b></span><span class="muted">'+[...new Set(w.map(d=>PH[d.ph]))].join(' · ')+'</span></summary><div class="in">'
      +w.map(d=>'<div><div class="eyebrow"><span><b>'+fdate(d.date)+'</b></span><span>'+PH[d.ph]+'</span></div>'+(d.tasks.length?taskRows(d):'<p class="muted">راحة</p>')+'</div>').join('')+'</div></details>';
  }
  if(rest.length>lim)h+='<p class="muted" style="padding:0 4px">بقية الأسابيع على النمط نفسه، وتظهر هنا كلما اقتربت.</p>';
  if(past.length){
    const show=past.slice(-28);
    h+='<details class="sheet fold"><summary><span><b>ما مضى</b></span><span class="muted">'+days(past.length)+'</span></summary><div class="in"><div>'
      +(past.length>show.length?'<p class="muted">'+ar('المعروض آخر '+show.length+' يوماً.')+'</p>':'')
      +show.reverse().map(d=>'<div class="mini"><b>'+fdate(d.date)+' · '+PH[d.ph]+'</b><span>'+(d.tasks.length?ar('أنجزت '+doneCount(S,d)+' من '+d.tasks.length):'راحة')+'</span></div>').join('')+'</div></div></details>';
  }
  return h;
}

const WKT=['الطريق والخريطة','سفينة الصحراء','خمس دقائق فقط','رحلة الورق','المشي والذهن','الحاجة والرغبة','جذور الكلمات','أطوار القمر'];
function secIds(n){return D.Q.filter(q=>q.s===n).map(q=>q.id);}
function bestOf(n){let b=null;S.runs.forEach(r=>{if(r.k==='sec'&&r.sec===n&&(b==null||r.c>b))b=r.c;});return b;}
function secDone(n){return S.runs.some(r=>r.k==='full'||(r.k==='sec'&&r.sec===n));}
function gqTotal(st){return Object.keys(st.gq).reduce((s,k)=>[s[0]+st.gq[k][0],s[1]+st.gq[k][1]],[0,0]);}

function scoreOne(q,a,timed){
  const ok=a===q.a;
  logSkill(GOF[q.t],ok);logAct(1,ok?1:0,0);
  if(q.k&&GEN.META[q.k]){const x=S.gq[q.k]||[0,0];x[1]++;if(ok)x[0]++;S.gq[q.k]=x;}
  if(q.g)return 0;
  if(ok){if(S.wrong[q.id])delete S.wrong[q.id];return 0;}
  const isNew=!S.wrong[q.id],w=S.wrong[q.id]||{n:0,r:''};
  w.n=(w.n||0)+1;w.t=Date.now();
  if(a==null&&timed&&!w.r)w.r='time';
  S.wrong[q.id]=w;
  return isNew?1:0;
}

function specType(g){

  if(!pool.length)return null;

/* ================= سباق الحساب الذهني ================= */
const F2P=[[1,4,25],[3,4,75],[1,5,20],[2,5,40],[3,5,60],[4,5,80],[1,8,12.5],[3,8,37.5],[5,8,62.5],[7,8,87.5],[1,20,5],[3,20,15],[1,25,4],[1,50,2],[1,10,10],[3,10,30]];
function fmtN(v){return String(v).replace('.',',');}
function numOpts(ans,cands){
  const set=[];
  shuffle(cands).forEach(v=>{v=Math.round(v*10)/10;if(v>0&&v!==ans&&set.indexOf(v)<0&&set.length<3)set.push(v);});
  let k=1;
  while(set.length<3){const v=ans+k;if(set.indexOf(v)<0)set.push(v);k++;}
  const all=set.concat([ans]).sort((x,y)=>x-y);
  return {o:all.map(fmtN),a:all.indexOf(ans)};
}
function genSprint(){
  const k=rnd(0,5);let text,ans,r;
  if(k===0){const a=rnd(6,19),b=rnd(3,12);ans=a*b;text=a+' × '+b;r=numOpts(ans,[ans+a,ans-a,ans+b,ans-b,ans+10,ans-10,ans+2]);}
  else if(k===1){const n=rnd(11,25);ans=n*n;text=n+'^2';r=numOpts(ans,[(n+1)*(n+1),(n-1)*(n-1),ans+10,ans-10,ans+20,ans-20,ans+n]);}
  else if(k===2){const p=[5,10,15,20,25,30,40,60,75][rnd(0,8)],n=[40,60,80,120,160,200,240,360][rnd(0,7)];ans=p*n/100;text=p+'% من '+n;r=numOpts(ans,[ans*2,ans/2,ans+n/10,ans-n/10,ans+n/20,ans+5,ans-5,ans*10]);}
  else if(k===3){const f=F2P[rnd(0,F2P.length-1)];ans=f[2];text='{'+f[0]+'/'+f[1]+'} = ؟';const c=shuffle(F2P.map(x=>x[2]).filter(v=>v!==ans));r=numOpts(ans,c);r.o=r.o.map(x=>x+'%');}
  else if(k===4){const b=rnd(3,12),q=rnd(6,19);ans=q;text=(b*q)+' ÷ '+b;r=numOpts(ans,[q+1,q-1,q+2,q-2,q+b,q+3]);}
  else{const a=rnd(23,89),b=rnd(14,68);if(rnd(0,1)){ans=a+b;text=a+' + '+b;}else{const hi=Math.max(a,b)+rnd(11,40),lo=Math.min(a,b);ans=hi-lo;text=hi+' − '+lo;}r=numOpts(ans,[ans+10,ans-10,ans+1,ans-1,ans+2,ans-2,ans+9,ans-9]);}
  return {text:text,o:r.o,a:r.a};
}
function startSprint(){run=null;fw=null;vs=null;sp={c:0,n:0,q:genSprint(),base:Date.now(),over:false,lock:false,pick:null};openRunner();}
function sprintTick(){
  if(sp.over)return;
  const left=60-(Date.now()-sp.base)/1000,el=$('#tm');
  if(el){el.textContent=clock(left);el.classList.toggle('low',left<=10);}
  if(left<=0){sp.over=true;if(sp.c>S.sprint){sp.best=true;S.sprint=sp.c;}if(sp.n>=3){logAct(0,0,1);autoTick('sprint');}save();drawRunner(0);}
}

/* ================= جلسة المفردات ================= */
/* تكرار متباعد: الكلمة تبدأ في الصندوق 1 وتُراجع غداً، وكل إجابة صحيحة ترفعها صندوقاً وتبعد موعدها. الخطأ يعيدها إلى الصندوق 1. */
const VINT=[0,1,3,7,16,35,90], VNEW=3;
function vocPlan(){
  const t=dayNo(today()),due=[];
  S.voc.forEach((x,i)=>{if(x[1]<=t)due.push(i);});
  due.sort((a,b)=>S.voc[a][1]-S.voc[b][1]||S.voc[a][0]-S.voc[b][0]);
  const rev=due.slice(0,8),cap=Math.max(0,VNEW-(S.vd[0]===t?S.vd[1]:0));
  return {rev:rev,nNew:Math.min(D.V.length-S.voc.length,cap,rev.length>=6?2:rev.length>=3?3:VNEW)};
}
function startVoc(){
  const p=vocPlan(),learn=[],first=S.voc.length;
  let quiz=p.rev.map(i=>({i:i,kind:'quiz',mode:D.V[i][2]&&S.voc[i][0]>=2&&Math.random()<0.5?'a':'m'}));
  for(let k=0;k<p.nNew;k++){learn.push({i:first+k,kind:'learn'});quiz.push({i:first+k,kind:'quiz',mode:'m',fresh:1});}
  let free=false;
  if(!quiz.length){
    if(!S.voc.length){toast('لا كلمات بعد');return;}
    free=true;
    quiz=shuffle(S.voc.map((x,i)=>i)).slice(0,8).map(i=>({i:i,kind:'quiz',mode:D.V[i][2]&&Math.random()<0.5?'a':'m',free:1}));
  }
  run=null;sp=null;fw=null;
  vs={items:learn.concat(shuffle(quiz)),p:0,c:0,n:0,pick:null,q:null,free:free,newN:p.nNew,done:false,retried:{}};
  vocPrep();openRunner();
}

function vocPick(i){
  if(!vs||vs.done||vs.pick!=null||!vs.q)return;
  const it=vs.items[vs.p],ok=i===vs.q.a,t=dayNo(today()),x=S.voc[it.i];
  vs.pick=i;vs.n++;if(ok)vs.c++;
  logAct(1,ok?1:0,0);
  if(!it.retry&&x){
    if(!ok){x[0]=1;x[1]=t+1;}
    else if(!it.fresh&&!it.free){x[0]=Math.min(6,x[0]+1);x[1]=t+VINT[x[0]];}
    if(!ok&&!vs.retried[it.i]){vs.retried[it.i]=1;vs.items.push({i:it.i,kind:'quiz',mode:'m',retry:1});}
  }
  save();drawRunner('keep');
}
function vocNext(){
  if(!vs||vs.done)return;
  const it=vs.items[vs.p],t=dayNo(today());
  if(it.kind==='learn'){
    if(S.voc.length===it.i){S.voc.push([1,t+1]);S.vd=S.vd[0]===t?[t,S.vd[1]+1]:[t,1];save();}
  }else if(vs.pick==null)return;
  if(vs.p>=vs.items.length-1){vs.done=true;autoTick('voc');save();drawRunner(0);return;}
  vs.p++;vocPrep();drawRunner(0);
}

/* الرمز يبدأ بـ M حتى لا يختلط برمز صفحة أخرى من الأسرة */
function b64enc(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s);}
function b64dec(t){const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function shareable(st){return {v:1,u:st.u,cfg:st.cfg,done:st.done,runs:st.runs,wrong:st.wrong,notes:st.notes,sprint:st.sprint,voc:st.voc,vd:st.vd,act:st.act,sk:st.sk,gq:st.gq,wk:st.wk};}
function pack(st){
  const bytes=new TextEncoder().encode(JSON.stringify(shareable(st)));
  const plain=()=>'M1.'+b64enc(bytes);
  if(typeof CompressionStream!=='function'||typeof Response!=='function')return Promise.resolve(plain());
  try{
    const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Response(stream).arrayBuffer().then(b=>'M2.'+b64enc(new Uint8Array(b)),plain);
  }catch(e){return Promise.resolve(plain());}
}
function unpack(text){
  text=String(text||'');
  const RX=/M([12])\.([A-Za-z0-9+\/=]{16,})/;
  const dec=m=>{
    const bytes=b64dec(m[2]);
    const parse=b=>({o:JSON.parse(new TextDecoder().decode(b)),code:'M'+m[1]+'.'+m[2]});
    if(m[1]==='1')return Promise.resolve(parse(bytes));
    if(typeof DecompressionStream!=='function')return Promise.reject(new Error('unsupported'));
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(b=>parse(new Uint8Array(b)));
  };
  const attempt=x=>{const m=x.match(RX);if(!m)return Promise.reject(new Error('none'));try{return dec(m);}catch(e){return Promise.reject(e);}};
  return attempt(text).catch(()=>attempt(text.replace(/\s+/g,'')));
}
function otherCode(text){return /Q[12]\.[A-Za-z0-9+\/=]{16,}/.test(String(text||'').replace(/\s+/g,''))&&!/M[12]\.[A-Za-z0-9+\/=]{16,}/.test(String(text||'').replace(/\s+/g,''));}
function tally(st,ref){
  const t=ref||today(),P=planFor(st.cfg);
  const cnt=d=>doneCount(st,d);
  const past=P.days.filter(d=>d.date<=t&&d.ph!==5&&d.tasks.length);
  let dn=0,tot=0;past.forEach(d=>{dn+=cnt(d);tot+=d.tasks.length;});
  const last7=past.filter(d=>diff(d.date,t)<7);let d7=0,t7=0;last7.forEach(d=>{d7+=cnt(d);t7+=d.tasks.length;});
  const td=P.by[t]&&P.by[t].ph!==5&&P.by[t].tasks.length?P.by[t]:null;
  const timed=st.runs.filter(r=>r.k==='sec'||r.k==='full');
  return {t:t,P:P,cnt:cnt,past:past,last7:last7,dn:dn,tot:tot,d7:d7,t7:t7,td:td,tdDone:td?cnt(td):0,lastT:timed.length?timed[timed.length-1]:null,left:diff(today(),st.cfg.test),
    ph:P.by[t]?P.by[t].ph:0,streak:streakOf(st,t),a7:activeCount(st,7,t),a30:activeCount(st,30,t),q7:answeredIn(st,7,t),voc:vocStats(st,t)};
}
function refOf(st){const t=today(),d=st.u?ymd(new Date(st.u)):t;return d<t?d:t;}
function lastDays(n){return n===1?'يوم':n===2?'يومين':days(n);}
function tw(n){return n>=3&&n<=10?'مهام':'مهمة';}
function messageText(st){
  const y=tally(st),L=[];
  L.push('تقدّمي في القدرات · '+fdate(y.t));
  L.push(ar('سلسلة الأيام: '+y.streak+'، ونشط '+y.a7+' من آخر 7 أيام'));
  if(y.t7)L.push(ar('مهام آخر 7 أيام: '+y.d7+' من '+y.t7));
  L.push(ar('الكلمات: عرفت '+y.voc.seen+' وأتقنت '+y.voc.mast));
  if(y.q7[0])L.push(ar('أسئلة آخر 7 أيام: '+y.q7[0]+'، الصحيح '+Math.round(y.q7[1]/y.q7[0]*100)+'%'));
  if(y.lastT)L.push(ar('آخر قسم موقوت: '+y.lastT.title+'، '+y.lastT.c+' من '+y.lastT.n));
  if(y.left>0)L.push('باقٍ على الاختبار: '+days(y.left));
  L.push('رمز المتابعة، الصق الرسالة كلها في لوحة المتابعة:');
  return L.join('\n');
}
function bestSec(st,n){let b=null;st.runs.forEach(r=>{if(r.k==='sec'&&r.sec===n&&(b==null||r.c>b))b=r.c;});return b;}
function summaryObj(st){
  const y=tally(st,refOf(st)),best={},gt=gqTotal(st),agg=skillStatsOf(st);
  [1,2,3,4,5].forEach(n=>{const b=bestSec(st,n);if(b!=null)best['s'+n]=b;});
  return {student:NAME,lastActivity:st.u?new Date(st.u).toISOString():'',testDate:st.cfg.test,dateConfirmed:!!st.cfg.ok,phase:PH[y.ph]||'',realScore:st.cfg.cur||0,target:st.cfg.target,
    streak:y.streak,activeDays7:y.a7,activeDays30:y.a30,tasksDone7:y.d7,tasksPlanned7:y.t7,tasksDoneAll:y.dn,tasksPlannedAll:y.tot,
    answered7:y.q7[0],correct7:y.q7[1],wordsSeen:y.voc.seen,wordsMastered:y.voc.mast,wordsDue:y.voc.due,quantSolved:gt[1],quantCorrect:gt[0],
    weeklyPassages:Object.keys(st.wk).length,lastTimed:y.lastT?{title:y.lastT.title,correct:y.lastT.c,of:y.lastT.n,date:ymd(new Date(y.lastT.t))}:{},
    bestBySection:best,weakest:weakest(agg).map(k=>GRN[k].n),weakQuant:weakTemplates(st,3).map(k=>GEN.META[k][2]),
    mistakes:Object.keys(st.wrong).length,notes:st.notes.length,sprintBest:st.sprint,vacationMode:!!st.cfg.boost};
}

function parentBoot(){

function followSave(code,st){
  const rec={code:code,u:st.u,at:Date.now()};
  try{localStorage.setItem(FKEY,JSON.stringify(rec));}catch(e){}
  if(fw)fw.saved='local';
  if(!DB)return;

  let ref=null,log=null;
  try{ref=DB.doc('follow/latest');log=DB.doc('followlog/'+ymd(new Date(st.u||Date.now())));}catch(e){return;}
  ref.set(body).then(()=>{if(fw===my&&fw){fw.saved='cloud';drawRunner('keep');}return log.set(body);}).catch(()=>{});
}
function applyFollow(text,minU,src,store){
  const my=fw;
  return unpack(text).then(r=>{
    if(fw!==my||!fw)return;
    const st=snapNorm(r.o);
    if(st.u<minU){if(store){fw.msg='هذه الرسالة أقدم مما هو معروض. الصق أحدث رسالة وصلتك.';drawRunner('keep');}return;}
    fw.st=st;fw.code=r.code;fw.u=st.u;fw.msg='';if(src&&!store)fw.saved=src;
    if(store)followSave(r.code,st);
    drawRunner(store?0:'keep');
  });
}
function openFollow(mode){
  run=null;sp=null;vs=null;
  fw={mode:mode,st:mode==='self'?S:null,code:'',u:0,msg:'',saved:'',busy:false};
  openRunner();
  if(mode==='self')return;
  const my=fw;
  let rec=null;try{rec=JSON.parse(localStorage.getItem(FKEY)||'null');}catch(e){}
  const fromCloud=()=>{
    if(!DB||fw!==my)return;
    let ref=null;try{ref=DB.doc('follow/latest');}catch(e){return;}
    my.busy=true;if(!my.st)drawRunner('keep');
    let settled=false;
    const end=()=>{settled=true;clearTimeout(tm);if(fw===my){my.busy=false;drawRunner('keep');}};
    const tm=setTimeout(()=>{if(settled||fw!==my)return;settled=true;my.busy=false;if(!my.st)my.msg='تعذّر الوصول إلى النسخة المحفوظة في حسابك الآن. الصق آخر رسالة وصلتك.';drawRunner('keep');},10000);
    ref.get().then(snap=>{
      if(settled||fw!==my)return;
      const d=snap&&snap.exists?snap.data():null;
      if(d&&typeof d.code==='string'&&(+d.u||0)>(my.u||0)){settled=true;clearTimeout(tm);my.busy=false;applyFollow(d.code,my.u||0,'cloud',false).catch(()=>{if(fw===my)drawRunner('keep');});}
      else{if(d&&my.st)my.saved='cloud';end();}
    },end);
  };
  if(rec&&typeof rec.code==='string')applyFollow(rec.code,0,'local',false).then(fromCloud,fromCloud);
  else fromCloud();
}

/* جوال الابن يرسل رمز تقدمه إلى جدول في حساب ولي الأمر، وجوال ولي الأمر يقرؤه برمز المتابعة. */
const QS=(HOSTED&&window.QSYNC&&window.QSYNC.url)?window.QSYNC:null;
let upT=null,upU=0;
function syncUp(){
  if(!QS||PARENT||!S||!S.u||S.u<=upU)return;
  const u=S.u;
  pack(S).then(code=>{
    if(code.length>44000)return;
    upU=u;
    return fetch(QS.url,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({kid:QS.kid,code:code})})
      .then(()=>{try{localStorage.setItem(KEY+'-up',String(u));}catch(e){}},()=>{upU=0;});
  }).catch(()=>{});
}
function syncSoon(){if(!QS||PARENT)return;clearTimeout(upT);upT=setTimeout(syncUp,6000);}
function syncDown(){
  if(!QS||!fw||fw.mode!=='parent')return;
  const my=fw;let pass='';try{pass=localStorage.getItem('qudurat-pass')||'';}catch(e){}
  if(!pass){my.sync='nopass';drawRunner('keep');return;}
  if(!my.st){my.sync='busy';drawRunner('keep');}
  fetch(QS.url+'?pass='+encodeURIComponent(pass)+'&t='+Date.now()).then(r=>r.json()).then(d=>{
    if(fw!==my)return;
    if(!d||!d.ok){my.sync='badpass';drawRunner('keep');return;}
    const k=d.kids&&d.kids[QS.kid];
    if(!k||typeof k.code!=='string'){my.sync='empty';drawRunner('keep');return;}
    my.sync='ok';
    return applyFollow(k.code,my.u||0,'auto',false).then(()=>{
      if(fw!==my)return;
      my.saved='auto';
      try{localStorage.setItem(FKEY,JSON.stringify({code:my.code,u:my.u,at:Date.now()}));}catch(e){}
      drawRunner('keep');
    });
  }).catch(()=>{if(fw===my){my.sync='err';drawRunner('keep');}});
}

      +'<label class="field" for="sh-text">الرسالة<textarea id="sh-text" class="code" rows="8" readonly>جارٍ التجهيز…</textarea></label>'
      +'<div class="btns stretch">'+(canShare?'<button class="btn" type="button" data-sh data-act="share-send" disabled>أرسل الرسالة</button>':'')+'<button class="btn'+(canShare?' ghost':'')+'" type="button" id="sh-btn" data-sh data-act="share-copy" disabled>انسخ الرسالة</button></div>');
    pack(S).then(code=>{const ta=$('#sh-text');if(!ta)return;ta.value=messageText(S)+'\n'+code;modal.querySelectorAll('[data-sh]').forEach(x=>{x.disabled=false;});});
  },
  'share-send':()=>{
    const ta=$('#sh-text');if(!ta||!ta.value)return;
    try{
      navigator.share({text:ta.value}).then(()=>{S.sent=Date.now();save();closeModal();draw();toast('تم. تأكد أن الرسالة وصلت لوالدك');},
        e=>{if(!e||e.name!=='AbortError')ACT['share-copy']();});
    }catch(e){ACT['share-copy']();}
  },
  'share-copy':()=>{
    const ta=$('#sh-text');if(!ta)return;
    const ok=()=>{S.sent=Date.now();save();toast('نُسخت الرسالة. الصقها لوالدك في واتساب');};
    const fb=()=>{try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);}catch(e){}toast('حدّد النص كله وانسخه يدوياً');};
    try{navigator.clipboard.writeText(ta.value).then(ok,fb);}catch(e){fb();}
  },
  report:()=>openFollow('self'),
  follow:()=>{closeModal();openFollow('parent');},
  'follow-load':()=>{
    if(!fw)return;
    const ta=$('#f-code'),txt=ta?ta.value.trim():'';
    if(!txt){fw.msg='الصق الرسالة أولاً.';drawRunner('keep');return;}
    applyFollow(txt,fw.u||0,'local',true).catch(()=>{if(!fw)return;fw.msg=otherCode(txt)?'هذا رمز من صفحة أخرى، لا من صفحة '+NAME+'. الصقه في لوحة المتابعة في تلك الصفحة.':'لم أجد رمزاً صالحاً في النص. الصق الرسالة كلها كما وصلتك.';drawRunner('keep');});
  },
  'follow-copy':()=>{
    if(!fw||!fw.code)return;
    const fb=()=>{const ta=$('#f-code');if(ta){ta.value=fw.code;try{ta.focus();ta.select();}catch(e){}}toast('الرمز في الخانة. حدّده وانسخه');};
    try{navigator.clipboard.writeText(fw.code).then(()=>toast('نُسخ الرمز'),fb);}catch(e){fb();}
  },
  restore:b=>{
    const box=b&&b.closest?(b.closest('.dialog')||b.closest('.sheet')):null,ta=box?box.querySelector('textarea.code'):$('#s-code');
    unpack(ta?ta.value:'').then(r=>{
      if(!r.o||typeof r.o!=='object'||!r.o.cfg)throw new Error('bad');
      S=norm(r.o);save();closeModal();draw();toast('استُعيد التقدم');
    }).catch(()=>toast(otherCode(ta?ta.value:'')?'هذا رمز من صفحة أخرى، لا من هذه الصفحة':'لم أجد رمزاً صالحاً. الصق الرسالة أو الرمز كاملاً'));
  },
  wipe:b=>{
    if(b.dataset.sure){S=norm({});save();closeModal();go('today');toast('مُسح التقدم');}
    else{b.dataset.sure='1';b.textContent='اضغط مرة أخرى للتأكيد';}
  },
  start:b=>{
    const kind=b.dataset.kind;
    if(kind==='type'){const st=specType(b.dataset.g);if(!st||!st.parts[0].ids.length){toast('يُفتح هذا التدريب بعد أن تحل أول قسم قياس');return;}closeModal();startRun(st);return;}
    if(kind==='redo'){if(Object.keys(S.wrong).length)startRun(specRedo());return;}
    const full=kind==='full',n=+b.dataset.sec||1;
    openModal('<div class="dh"><h3>'+(full?'الاختبار الكامل':ar('القسم '+n))+'</h3><button class="icon-btn" type="button" data-act="close-modal" aria-label="إغلاق">'+ICON.x+'</button></div>'
      +'<p class="prose sm">'+ar(full?'120 سؤالاً في خمسة أقسام، 25 دقيقة لكل قسم، ولا رجوع إلى قسم انتهى. احجز ساعتين وخمس دقائق بلا مقاطعة.':'24 سؤالاً في 25 دقيقة: 13 لفظياً ثم 11 كمياً. تتنقل بين الأسئلة كما تشاء حتى ينتهي الوقت.')+'</p>'
      +'<ul class="prose sm"><li>فعّل «عدم الإزعاج» في الجوال.</li><li>جهّز ورقة وقلماً. لا آلة حاسبة.</li><li>لا تترك سؤالاً بلا إجابة.</li></ul>'
      +(S.live?'<p class="muted">بدء محاولة جديدة يحذف المحاولة التي لم تكتمل.</p>':'')
      +'<div class="btns stretch"><button class="btn" type="button" data-act="start-now" data-kind="'+kind+'" data-sec="'+n+'">ابدأ الآن</button><button class="btn ghost" type="button" data-act="close-modal">لاحقاً</button></div>');
  },
  'start-now':b=>{closeModal();startRun(b.dataset.kind==='full'?specFull():specSec(+b.dataset.sec||1));},
  resume:()=>resumeRun(),
  discard:()=>{S.live=null;save();draw();},
  sprint:()=>startSprint(),
  voc:()=>{closeModal();startVoc();},
  'voc-pick':b=>vocPick(+b.dataset.i),
  'voc-next':()=>vocNext(),
  'voc-list':()=>openModal(vocListHTML()),
  gen:b=>{closeModal();const d=b.dataset;startRun(specGen(clamp(+d.n||5,3,15),{type:d.type||'',weak:!!d.weak,only:GEN.META[d.only]?d.only:''}));},
  ana:b=>{closeModal();startRun(specAna(clamp(+b.dataset.n||8,3,15)));},
  wk:b=>{const id=b.dataset.id&&D.W.indexOf(b.dataset.id)>=0?b.dataset.id:nextWk();if(!id){toast('أنهيت نصوص الأسبوع كلها');return;}closeModal();startRun(specWk(id));},
  pick:b=>{
    if(!run||run.stage!=='q')return;
    const q=curQ(),i=+b.dataset.i;
    if(run.fb&&run.ans[q.id]!=null)return;
    run.ans[q.id]=(!run.fb&&run.ans[q.id]===i)?null:i;
    if(run.ans[q.id]==null)delete run.ans[q.id];
    else if(run.fb)run.added=(run.added||0)+scoreOne(q,i,false);
    persist();drawRunner('keep');
    if(run.fb){const ex=$('.explain',runner);if(ex)try{ex.scrollIntoView({block:'nearest'});}catch(e){}}
  },
  next:()=>{if(!run)return;const prev=curQ();if(run.qi<part().ids.length-1){run.qi++;persist();drawRunner(curQ().p&&curQ().p===prev.p?'stem':0);}},
  prev:()=>{if(!run)return;const prev=curQ();if(run.qi>0){run.qi--;persist();drawRunner(curQ().p&&curQ().p===prev.p?'stem':0);}},
  flag:()=>{if(!run)return;const id=curQ().id;if(run.flag[id])delete run.flag[id];else run.flag[id]=1;persist();drawRunner('keep');},
  map:()=>{
    if(!run)return;const p=part();
    openModal('<div class="dh"><h3>خريطة الأسئلة</h3><button class="icon-btn" type="button" data-act="close-modal" aria-label="إغلاق">'+ICON.x+'</button></div>'
      +'<p class="muted">'+ar('المظلَّلة مُجابة · النقطة البرتقالية معلَّمة للمراجعة · أجبت عن '+countAns(p)+' من '+p.ids.length)+'</p>'
      +'<div class="map">'+p.ids.map((id,i)=>'<button type="button" data-act="jump" data-i="'+i+'" class="'+(run.ans[id]!=null?'on':'')+(run.flag[id]?' fl':'')+(i===run.qi?' cur':'')+'" aria-label="'+ar('السؤال '+(i+1))+'">'+ar(i+1)+'</button>').join('')+'</div>'
      +'<div class="btns stretch"><button class="btn ghost" type="button" data-act="finish">'+(p.limit?'أنهِ القسم':'النتيجة')+'</button></div>');
  },
  jump:b=>{if(!run)return;run.qi=clamp(+b.dataset.i,0,part().ids.length-1);closeModal();persist();drawRunner(0);},
  finish:()=>{
    if(!run)return;const p=part(),un=p.ids.length-countAns(p),fl=p.ids.filter(id=>run.flag[id]).length;
    if(!p.limit&&!un){endPart(false);return;}
    openModal('<div class="dh"><h3>'+(p.limit?'تنهي القسم الآن؟':'تعرض النتيجة الآن؟')+'</h3><button class="icon-btn" type="button" data-act="close-modal" aria-label="إغلاق">'+ICON.x+'</button></div>'
      +'<p class="prose sm">'+ar((un?'بقي '+un+' بلا إجابة. ':'أجبت عن كل الأسئلة. ')+(fl?'وعلّمت '+fl+' للمراجعة. ':'')+(p.limit?'الوقت المتبقي '+clock(p.limit-elapsed())+'.':''))+'</p>'
      +'<div class="btns stretch"><button class="btn ghost" type="button" data-act="close-modal">عد للمراجعة</button><button class="btn" type="button" data-act="finish-yes">'+(p.limit?'أنهِ القسم':'اعرض النتيجة')+'</button></div>');
  },
  'finish-yes':()=>{if(run)endPart(false);},
  nextpart:()=>{if(!run||run.stage!=='break')return;run.pi++;run.qi=0;run.acc=0;run.base=Date.now();run.paused=false;run.auto=false;run.stage='q';persist();drawRunner(0);},
  pause:()=>pauseRun(),
  unpause:()=>unpause(),
  exit:()=>{
    if(!run){closeRunner();return;}
    if(run.stage==='res'){closeRunner();return;}
    if(run.vol){
      openModal(dh('تخرج من التدريب؟')+'<p class="prose sm">ما أجبت عنه حُسب لك. الأسئلة الباقية لا تُحفظ، وتأتيك غيرها في الجلسة القادمة.</p>'
        +'<div class="btns stretch"><button class="btn" type="button" data-act="close-modal">أكمل</button><button class="btn ghost" type="button" data-act="exit-drop">اخرج</button></div>');
      return;
    }
    openModal('<div class="dh"><h3>تخرج من المحاولة؟</h3><button class="icon-btn" type="button" data-act="close-modal" aria-label="إغلاق">'+ICON.x+'</button></div>'
      +'<p class="prose sm">يمكنك حفظها والعودة إليها لاحقاً من تبويب «اختبارات»، أو حذفها.</p>'
      +'<div class="btns stretch"><button class="btn" type="button" data-act="exit-keep">احفظها واخرج</button><button class="btn danger" type="button" data-act="exit-drop">احذفها</button></div>');
  },
  'exit-keep':()=>{if(run){if(run.stage==='q'&&part().limit){run.acc=elapsed();run.paused=true;}persist();flush();}closeRunner();},
  'exit-drop':()=>{if(run&&!run.vol)S.live=null;save();closeRunner();},
  'close-run':()=>{if(PARENT&&fw&&fw.mode==='parent'){location.href='./';return;}closeRunner();},
  'be-student':()=>{try{localStorage.setItem('qudurat-role','student');}catch(e){}location.reload();},
  sp:b=>{
    if(!sp||sp.over||sp.lock)return;
    const i=+b.dataset.i,ok=i===sp.q.a;
    sp.n++;if(ok)sp.c++;
    sp.lock=true;sp.pick=i;drawRunner(0);
    setTimeout(()=>{if(!sp||sp.over)return;sp.lock=false;sp.pick=null;sp.q=genSprint();drawRunner(0);},ok?160:650);
  },
  reason:b=>{
    const m=b.closest('.mis'),id=m&&m.dataset.id,w=id&&S.wrong[id];if(!w)return;
    w.r=w.r===b.dataset.r?'':b.dataset.r;save();
    m.querySelectorAll('[data-act="reason"]').forEach(x=>{const on=x.dataset.r===w.r;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
  },
  fixed:b=>{const m=b.closest('.mis'),id=m&&m.dataset.id;if(id){delete S.wrong[id];save();const y=window.scrollY;draw();try{window.scrollTo(0,y);}catch(e){}}},
  'note-add':()=>{
    const x=$('#n-text').value.trim();
    if(!x){toast('اكتب الخطأ والقاعدة أولاً');return;}
    S.notes.push({id:Date.now().toString(36),t:Date.now(),p:$('#n-part').value,r:$('#n-r').value,x:x.slice(0,600)});
    if(S.notes.length>300)S.notes=S.notes.slice(-300);
    save();const y=window.scrollY;draw();try{window.scrollTo(0,y);}catch(e){}toast('أُضيف إلى الدفتر');
  },
  'note-del':b=>{S.notes=S.notes.filter(n=>n.id!==b.dataset.id);save();const y=window.scrollY;draw();try{window.scrollTo(0,y);}catch(e){}}
};
document.addEventListener('click',e=>{
  const b=e.target.closest?e.target.closest('[data-act]'):null;
  if(!b){if(e.target===modal)closeModal();return;}
  const f=ACT[b.dataset.act];
  if(f)f(b,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(run&&run.stage==='q'&&!run.paused&&part().limit)pauseRun();if(saveT)flush();}
  else if(runner.hidden&&modal.hidden&&today()!==drawnDay)draw();
});
window.addEventListener('pagehide',()=>{if(run&&run.stage!=='res')persist();flush();});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(TABS[h]&&h!==tab&&runner.hidden)go(h);});

/* ================= الإقلاع ================= */
function start(data){
  S=norm((data&&data.S)||lsRead());
  const h=(location.hash||'').replace('#','');
  tab=TABS[h]?h:(data&&TABS[data.tab]?data.tab:'today');
  draw();
  initCloud();
  if(PARENT)parentBoot();
  else{try{upU=+localStorage.getItem(KEY+'-up')||0;}catch(e){}syncSoon();}
  idbRead().then(t=>{
    if(!t)return;
    try{const o=JSON.parse(t);if(o&&(+o.u||0)>(+S.u||0)&&!run&&!sp&&!vs){S=norm(o);lsWrite(t);draw();}}catch(e){}
  });
}
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>{if(run&&run.stage!=='res')persist();return {S:S,tab:tab};});}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();

</script>
</body>
