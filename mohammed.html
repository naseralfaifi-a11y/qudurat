<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطة محمد للقدرات</title>
<meta name="description" content="خطة سنة لاختبار القدرات العامة: جرعة يومية قصيرة، مفردات ومسائل متجددة، وأقسام قياس موقوتة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* الفكرة: ورقة إجابة. ورق بارد، حبر أزرق للنموذج المطبوع، رصاص لما يكتبه الطالب، وأصفر قلم التظليل لما يُضغط.
     عمود واحد بعرض الجوال؛ كل بطاقة «ورقة» بصفوف مرقّمة ودوائر تُظلَّل. */
  --paper:#ECEEE9;
  --sheet:#FBFCFA;
  --graphite:#21242A;
  --soft:#59616E;
  --form:#2646B5;
  --form-tint:#E4E9F9;
  --rule:#C7D0EC;
  --mark:#F5C52F;
  --on-mark:#21242A;
  --ok:#1C7A4B; --ok-tint:#E2F3E9;
  --bad:#B4382A; --bad-tint:#FBE9E5;
  --warn:#8A5807; --warn-tint:#FBF0D9;
  --p1:#2646B5; --p2:#F5C52F; --p3:#8A94A6; --p4:#1C7A4B; --p5:#C96A2B;
  --scrim:rgba(20,24,34,.5);
  --mark-bg:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);
  --display:"Aref Ruqaa","Noto Naskh Arabic","Geeza Pro",serif;
  --text:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Times New Roman",serif;
  --ui:-apple-system,"SF Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1015; --sheet:#161A21; --graphite:#ECE8DF; --soft:#9CA4B2;
    --form:#93A9FF; --form-tint:#1D2540; --rule:#2C3654;
    --mark:#F5C52F; --on-mark:#21242A;
    --ok:#62CC92; --ok-tint:#14301F; --bad:#FF8E7D; --bad-tint:#3A1C18; --warn:#EDB458; --warn-tint:#33280F;
    --p1:#93A9FF; --p2:#F5C52F; --p3:#7F8898; --p4:#62CC92; --p5:#F09A5E;
    --scrim:rgba(0,0,0,.6);
    --mark-bg:linear-gradient(transparent 84%,var(--mark) 84%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1015; --sheet:#161A21; --graphite:#ECE8DF; --soft:#9CA4B2;
  --form:#93A9FF; --form-tint:#1D2540; --rule:#2C3654;
  --mark:#F5C52F; --on-mark:#21242A;
  --ok:#62CC92; --ok-tint:#14301F; --bad:#FF8E7D; --bad-tint:#3A1C18; --warn:#EDB458; --warn-tint:#33280F;
  --p1:#93A9FF; --p2:#F5C52F; --p3:#7F8898; --p4:#62CC92; --p5:#F09A5E;
  --scrim:rgba(0,0,0,.6);
  --mark-bg:linear-gradient(transparent 84%,var(--mark) 84%);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--graphite);font-family:var(--ui);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding-inline-start:1.3em}
:focus-visible{outline:2px solid var(--form);outline-offset:2px}
[hidden]{display:none !important}
mark{background:var(--mark-bg);color:inherit;padding:0 .12em}
sup{unicode-bidi:isolate;font-size:.66em;line-height:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2;font-size:.82em;margin:0 .18em}
.fr .fn{padding:0 .3em;border-bottom:1.5px solid currentColor}
.fr .fd{padding:0 .3em}
.num{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
ol{list-style-type:arabic-indic}

/* ---------- الهيكل ---------- */
/* لا شيء يُثبَّت أسفل الشاشة: شريط المستضيف لغير المسجّلين يغطي أسفلها */
#app{max-width:560px;margin:0 auto;padding:0 16px 160px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 2px 8px}
.top h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.25}
.top .who{display:block;font-family:var(--ui);font-weight:400;font-size:12px;color:var(--form);margin-bottom:2px}
.icon-btn{appearance:none;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;min-width:44px;min-height:44px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#view{display:flex;flex-direction:column;gap:14px;outline:0}

.tabs{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1.5px solid var(--form);margin:0 -16px 14px;padding:0 10px}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--soft);min-height:50px}
.tab .b{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--form)}
.tab[aria-current="page"]{color:var(--graphite);font-weight:700}
.tab[aria-current="page"] .b{background:var(--graphite);border-color:var(--graphite)}
.tab .n{font-size:10px;color:var(--bad);font-weight:700;margin-inline-start:2px}

/* ---------- الورقة ---------- */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--form);border-bottom:1px solid var(--rule);padding-bottom:7px}
.eyebrow b{font-weight:700}
h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.35;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.35;text-wrap:balance}
.prose{font-family:var(--text);font-size:18px;line-height:1.95}
.prose.sm{font-size:17px}
.muted{color:var(--soft);font-size:13px}
.src{font-family:var(--ui);font-size:12px;color:var(--soft);line-height:1.7}

.btn{appearance:none;border:1.5px solid var(--graphite);background:var(--mark);color:var(--on-mark);border-radius:4px;padding:10px 16px;font-weight:700;font-size:15px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--graphite);border-color:var(--rule);font-weight:600}
.btn.quiet{background:transparent;border-color:transparent;color:var(--form);font-weight:600;padding-inline:8px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.stretch > *{flex:1 1 140px}

.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--soft);background:transparent;white-space:nowrap}
button.chip{min-height:36px;padding:4px 12px;font-size:13px;color:var(--graphite)}
button.chip.on{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.chip.form{color:var(--form);border-color:var(--form)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.bub{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--form);display:inline-grid;place-items:center;font-family:var(--ui);font-size:13px;line-height:1;color:var(--form);background:transparent}
.bub.on{background:var(--graphite);border-color:var(--graphite);color:var(--sheet);animation:shade .22s ease-out}
@keyframes shade{from{box-shadow:inset 0 0 0 13px var(--sheet)}to{box-shadow:inset 0 0 0 0 var(--sheet)}}

/* صفوف مرقّمة كصفوف ورقة الإجابة */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px dashed var(--rule);min-width:0}
.row:first-child{border-top:0;padding-top:2px}
.row:last-child{padding-bottom:2px}
.row .no{flex:none;min-width:1.5em;font-size:12px;color:var(--form);font-variant-numeric:tabular-nums;padding-top:5px}
.row .body{flex:1;min-width:0;font-family:var(--text);font-size:17.5px;line-height:1.8}
.row .meta{flex:none;font-size:12px;color:var(--soft);padding-top:6px;white-space:nowrap}
.row.done .body{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--rule)}
.task{appearance:none;border:0;background:none;padding:0;display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0;text-align:start}
.tk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.tk-go{padding-inline-start:36px}

/* ---------- الرئيسية ---------- */
.hero .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.2}
.hero .big b{font-weight:700}
.hero .big .to{color:var(--form)}
.ruler{width:100%;height:auto;display:block;overflow:visible}
.ruler .ax{stroke:var(--graphite);stroke-width:1.2}
.ruler .tk{stroke:var(--graphite);stroke-width:1}
.ruler .tk.m{stroke:var(--form)}
.ruler text{font-family:var(--ui);font-size:10px;fill:var(--soft)}
.ruler .z5{fill:var(--form);opacity:.26}
.ruler .z10{fill:var(--form);opacity:.13}
.ruler .me{fill:var(--graphite)}
.ruler .goal{fill:var(--mark);stroke:var(--graphite);stroke-width:1.5}
.ruler .path{stroke:var(--graphite);stroke-width:1.2;stroke-dasharray:3 3;fill:none}
.ruler .lbl{font-size:11px;font-weight:700;fill:var(--graphite)}
.ruler .avg{fill:var(--form)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;margin-inline-end:5px;vertical-align:-1px;background:var(--form)}
.legend .l5 i{opacity:.4}.legend .l10 i{opacity:.2}
.legend .la i{width:0;height:0;background:none;border-inline:5px solid transparent;border-bottom:8px solid var(--form)}
.count{display:flex;align-items:center;gap:14px;border-top:1px solid var(--rule);padding-top:12px}
.count .d{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.count .w{flex:1;min-width:0;font-size:13px;color:var(--soft);line-height:1.6}
.count .w b{display:block;color:var(--graphite);font-size:15px}
.marks{display:flex;flex-wrap:wrap;gap:3px}
.marks i{width:5px;height:13px;background:var(--rule)}
.marks i.past{background:var(--graphite)}
.marks i.now{background:var(--mark);outline:1.5px solid var(--graphite)}
.marks i.end{background:var(--form);width:9px}
.note{font-family:var(--display);font-size:23px;line-height:1.75;color:var(--form);border-inline-start:4px solid var(--mark);padding-inline-start:14px;text-wrap:pretty}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--rule)}
.skill:first-child{border-top:0}
.skill .nm{font-size:14px}
.skill .nm small{color:var(--soft);font-size:11px;margin-inline-start:6px}
.skill .v{font-size:13px;font-variant-numeric:tabular-nums;color:var(--soft)}
.skill .bar{grid-column:1/-1;height:8px;background:var(--form-tint);position:relative}
.skill .bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--graphite)}
.skill.weak .nm{font-weight:700}
.skill.weak .bar i{background:var(--bad)}
.setup .btns .btn{flex:1 1 44%}

/* ---------- الخطة ---------- */
.phase{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:10px 0;border-top:1px dashed var(--rule)}
.phase:first-child{border-top:0}
.phase .k{grid-row:span 2;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--form);display:grid;place-items:center;font-size:14px;color:var(--form);align-self:start;margin-top:3px}
.phase.cur .k{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.phase .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.phase .t b{font-family:var(--display);font-size:21px}
.phase .t span{font-size:12px;color:var(--soft)}
.phase p{font-family:var(--text);font-size:16.5px;line-height:1.85}
.day > .eyebrow b{color:var(--graphite)}
.day.today{border-color:var(--graphite);border-width:1.5px}
details.fold > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;min-height:44px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"";width:8px;height:8px;border-inline-start:1.7px solid var(--form);border-bottom:1.7px solid var(--form);transform:rotate(-45deg);flex:none;margin-inline:6px}
details.fold[open] > summary::after{transform:rotate(135deg)}
details.fold > .in{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.mini{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--rule)}
.mini b{font-size:13px}
.mini span{font-size:13px;color:var(--soft)}

/* ---------- الطريقة ---------- */
details.g > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center}
details.g > summary::-webkit-details-marker{display:none}
details.g > summary .no{grid-row:span 2;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--form);display:grid;place-items:center;font-size:14px;color:var(--form)}
details.g[open] > summary .no{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
details.g > summary .s{grid-column:2;font-size:13px;color:var(--soft)}
details.g > summary::after{content:"";grid-row:1/span 2;grid-column:3;width:8px;height:8px;border-inline-start:1.7px solid var(--form);border-bottom:1.7px solid var(--form);transform:rotate(-45deg);margin-inline:6px}
details.g[open] > summary::after{transform:rotate(135deg)}
.gbody{font-family:var(--text);font-size:18px;line-height:1.95;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule);padding-top:14px}
.gbody h4{font-family:var(--ui);font-size:14px;font-weight:700;color:var(--form);margin-top:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:5px}
.gbody h4 .w{font-weight:400;font-size:12px;color:var(--soft)}
.gbody li{margin-bottom:6px}
.gbody li::marker{color:var(--form);font-family:var(--ui);font-size:.8em}
.gbody .trap{background:var(--warn-tint);border-inline-start:3px solid var(--warn);padding:8px 12px;font-size:17px}
.gbody .ex{background:var(--form-tint);padding:8px 12px;font-size:17px}
.gbody .lbl{font-family:var(--ui);font-size:12px;color:var(--soft)}
.gbody .chips span{font-family:var(--ui);font-size:12.5px;border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-family:var(--text);font-size:16.5px;line-height:1.7}
table.t th{font-family:var(--ui);font-size:12px;font-weight:700;color:var(--form);text-align:start;padding:6px 8px;border-bottom:1.5px solid var(--form);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px dashed var(--rule);vertical-align:top}
table.t td.c,table.t th.c{text-align:center;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid3 div{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:17px;font-variant-numeric:tabular-nums}
.dist{display:flex;flex-direction:column;gap:7px;font-family:var(--ui)}
.dist .d{display:grid;grid-template-columns:108px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;line-height:1.3}
.dist .d .bar{height:14px;background:var(--form-tint);position:relative}
.dist .d .bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--form)}
.dist .d.q .bar i{background:var(--graphite)}
.dist .d .v{font-variant-numeric:tabular-nums;color:var(--soft);text-align:end}
.dist .k{display:flex;gap:14px;font-size:12px;color:var(--soft)}
.dist .k i{display:inline-block;width:10px;height:10px;margin-inline-end:5px;background:var(--form)}
.dist .k .q i{background:var(--graphite)}

/* ---------- الاختبارات ---------- */
.testrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px dashed var(--rule)}
.testrow:first-child{border-top:0}
.testrow .nm{flex:1;min-width:0}
.testrow .nm b{display:block;font-family:var(--display);font-size:21px;line-height:1.3}
.testrow .nm span{font-size:12px;color:var(--soft)}
.testrow .sc{font-size:13px;font-variant-numeric:tabular-nums;color:var(--soft);text-align:center;white-space:nowrap}
.testrow .sc b{display:block;font-size:17px;color:var(--graphite)}

/* ---------- واجهة الحل ---------- */
#runner{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column}
.r-top{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sheet);border-bottom:1.5px solid var(--form)}
.r-top .ttl{flex:1;min-width:0;line-height:1.35}
.r-top .ttl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-top .ttl span{font-size:12px;color:var(--soft)}
.timer{appearance:none;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--graphite);background:var(--sheet);border-radius:4px;min-height:44px;padding:4px 12px;font-family:var(--ui);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.timer.low{border-color:var(--bad);color:var(--bad)}
.r-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 170px}
.r-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.qnav{display:flex;gap:8px;margin-top:4px}
.qnav .btn{flex:1}
.qnav .btn.mapbtn{flex:0 0 auto;padding-inline:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flag{appearance:none;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;min-height:38px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.flag.on{background:var(--warn-tint);border-color:var(--warn);color:var(--warn);font-weight:700}
.flag svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stem{font-family:var(--text);font-size:21px;line-height:1.95;text-wrap:pretty}
.stem.pair{font-size:27px;font-weight:700;text-align:center;padding:10px 0}
.stem u.cand{text-decoration-color:var(--form);text-decoration-thickness:2px;text-underline-offset:6px}
.passage{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:4px 14px}
.passage > summary{font-family:var(--ui);font-size:13px;color:var(--form)}
.passage .ptxt{font-family:var(--text);font-size:18.5px;line-height:2.05;display:flex;flex-direction:column;gap:10px;padding:10px 0 12px;border-top:1px solid var(--rule)}
.passage .ptxt .pn{font-family:var(--ui);font-size:12px;color:var(--form);margin-inline-end:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp > div{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;text-align:center}
.cmp small{display:block;font-family:var(--ui);font-size:12px;color:var(--form);margin-bottom:4px}
.cmp span{font-family:var(--text);font-size:21px;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font-family:var(--text);font-size:19.5px;line-height:1.75;min-height:54px}
.opt .tx{flex:1;min-width:0}
.opt.sel{border-color:var(--graphite);border-width:1.5px}
.opt.right{border-color:var(--ok);background:var(--ok-tint);border-width:1.5px}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint);border-width:1.5px}
.opt .tag{flex:none;font-family:var(--ui);font-size:12px;font-weight:700}
.opt.right .tag{color:var(--ok)}.opt.wrong .tag{color:var(--bad)}
.opt:disabled{opacity:1;cursor:default}
.explain{background:var(--form-tint);border-inline-start:3px solid var(--form);padding:10px 14px;font-family:var(--text);font-size:18px;line-height:1.95}
.explain b{font-family:var(--ui);font-size:12px;color:var(--form);display:block;margin-bottom:2px}
.fig{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fig figcaption{font-size:13px;color:var(--soft);font-family:var(--ui)}
.fig svg{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.fig svg text{font-family:var(--ui);font-size:11px;fill:var(--soft)}
.fig .grid{stroke:var(--rule);stroke-width:1}
.fig .axis{stroke:var(--graphite);stroke-width:1.2}
.fig .barf{fill:var(--form)}
.fig .shape{fill:none;stroke:var(--graphite);stroke-width:1.6}
.fig .shape.c{stroke:var(--form)}
.pie-leg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
.pie-leg span{display:flex;align-items:center;gap:6px}
.pie-leg i{width:11px;height:11px;flex:none}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;justify-items:center}
.map button{appearance:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--form);background:transparent;color:var(--form);font-size:14px;font-variant-numeric:tabular-nums;position:relative}
.map button.on{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.map button.cur{outline:2px solid var(--mark);outline-offset:2px}
.map button.fl::after{content:"";position:absolute;top:-3px;inset-inline-end:-3px;width:11px;height:11px;border-radius:50%;background:var(--warn);border:2px solid var(--sheet)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 0}
.score{font-family:var(--display);font-weight:700;font-size:64px;line-height:1.05}
.score small{font-size:28px;color:var(--soft)}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:13px;color:var(--soft)}
.kv b{color:var(--graphite);font-variant-numeric:tabular-nums}
details.rev{border-top:1px dashed var(--rule)}
details.rev:first-child{border-top:0}
details.rev > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 0;min-height:46px}
details.rev > summary::-webkit-details-marker{display:none}
details.rev > summary .q{flex:1;min-width:0;font-family:var(--text);font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.rev > summary .st{flex:none;font-size:12px;font-weight:700}
details.rev .st.ok{color:var(--ok)}details.rev .st.no{color:var(--bad)}details.rev .st.sk{color:var(--warn)}
details.rev .rin{display:flex;flex-direction:column;gap:10px;padding:2px 0 14px}
details.rev .stem{font-size:19px}
details.rev .stem.pair{font-size:23px}
details.rev .opt{font-size:17.5px;min-height:44px;padding:7px 10px}
.sprint-q{font-family:var(--text);font-size:44px;font-weight:700;line-height:1.6;text-align:center;padding:26px 0 10px;min-height:128px}
.sprint-o{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sprint-o button{appearance:none;border:1.5px solid var(--form);background:var(--sheet);border-radius:6px;min-height:72px;font-family:var(--text);font-size:27px;font-variant-numeric:tabular-nums}
.sprint-o button.right{background:var(--ok-tint);border-color:var(--ok)}
.sprint-o button.wrong{background:var(--bad-tint);border-color:var(--bad)}

/* ---------- الأخطاء ---------- */
.mis{display:flex;flex-direction:column;gap:9px;padding:13px 0;border-top:1px dashed var(--rule)}
.mis:first-child{border-top:0;padding-top:2px}
.mis .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--soft)}
.mis .q{font-family:var(--text);font-size:18px;line-height:1.85}
.mis .q.pair{font-weight:700;font-size:20px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--soft)}
.field input,.field select,.field textarea{font:inherit;font-size:16px;color:var(--graphite);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:10px;min-height:46px;width:100%}
.field textarea{min-height:92px;font-family:var(--text);font-size:17px;line-height:1.8;resize:vertical}
.field textarea.code{font-family:var(--ui);font-size:13px;line-height:1.6;unicode-bidi:plaintext;text-align:start;word-break:break-all;min-height:110px}
.facts{font-family:var(--text);font-size:17px;line-height:1.9;display:flex;flex-direction:column;gap:2px}
.facts li::marker{color:var(--form)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--rule)}
.drow:first-child{border-top:0}
.drow .dd b{display:block;font-size:14px}
.drow .dd small{font-size:11px;color:var(--soft)}
.drow .bubs{display:flex;gap:4px}
.drow .bubs i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--form)}
.drow .bubs i.on{background:var(--graphite);border-color:var(--graphite)}
.drow .v{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--rule);border-radius:6px;padding:8px 6px;text-align:center}
.tile small{display:block;font-size:11px;color:var(--soft)}
.tile b{font-family:var(--display);font-size:26px;line-height:1.3}
.tile.off b{color:var(--soft);font-family:var(--ui);font-size:18px}
.notei{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--rule)}
.notei p{flex:1;min-width:0;font-family:var(--text);font-size:17px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- النوافذ ---------- */
#modal{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:12px 12px 120px}
.dialog{background:var(--sheet);width:100%;max-width:560px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1.5px solid var(--form);padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.dialog .dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;inset-inline:16px;top:72px;z-index:40;margin:0 auto;max-width:420px;background:var(--graphite);color:var(--sheet);border-radius:6px;padding:10px 14px;font-size:14px;text-align:center}

}

}

.heat .hg i.rest{border-style:dotted}

.vq{text-align:center;padding:16px 0 4px}
.vq small{display:block;font-size:13px;color:var(--form)}
.vq b{display:block;font-family:var(--display);font-weight:700;font-size:54px;line-height:1.6}
.cmp.one{grid-template-columns:1fr}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--soft);line-height:1.7}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--graphite);flex:none}
.check b{display:block;color:var(--graphite);font-size:14px}
.vlist{display:flex;flex-direction:column}
.vrow{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px dashed var(--rule);font-size:14px}

.vrow b{font-family:var(--text);font-size:19px;flex:none;min-width:76px}
.vrow span{flex:1;min-width:0;color:var(--soft)}
.vrow i{font-style:normal;font-size:11px;color:var(--ok);flex:none}
.vrow i.d{color:var(--form)}

<script>
const DATA={"P":{"p1":["ظلّ الناس زمناً طويلاً يحسبون النوم توقفاً تاماً عن النشاط، كأن الدماغ يُطفأ ليلاً كما يُطفأ المصباح. لكنّ الدراسات الحديثة أظهرت أن الدماغ يبقى في أثناء النوم منشغلاً بعملٍ لا يقل أهمية عن عمله في اليقظة.","ففي ساعات النوم يعيد الدماغ ترتيب ما مرّ به في النهار؛ فيثبّت المعلومات المهمة في الذاكرة طويلة المدى، ويتخلص مما لا حاجة إليه. ولهذا يجد الطالب الذي ينام نوماً كافياً بعد المذاكرة أن استرجاعه للمعلومات أفضل ممن سهر الليل كله يراجع.","ولا تقف فائدة النوم عند الذاكرة؛ فقلّته تُضعف التركيز، وتُبطئ ردّ الفعل، وتجعل صاحبها أسرع غضباً وأقل صبراً. ومن هنا كان السهر قبل الاختبار خسارة مضاعفة: يضيّع ما حُفظ، ويُضعف القدرة على التفكير في ما لم يُحفظ."],"p2":["حين يُذكر النحل يتبادر إلى الذهن العسل، مع أن العسل ليس أثمن ما يقدّمه النحل للإنسان. فالخدمة الكبرى التي يؤديها هي تلقيح النبات؛ إذ ينقل حبوب اللقاح من زهرة إلى أخرى وهو يجمع الرحيق، فتُعقد الثمار وتتكوّن البذور.","ويعتمد قسم كبير من المحاصيل التي يأكلها الإنسان، من فواكه وخضراوات ومكسّرات، على الحشرات الملقِّحة، والنحل في مقدمتها. ولو غابت هذه الحشرات لما اختفى الغذاء كله، لكنّ المائدة ستفقد كثيراً من تنوّعها، وسترتفع أسعار ما يبقى منها.","وقد لاحظ المختصون في العقود الأخيرة تراجعاً في أعداد النحل في مناطق عدة، ويعزونه إلى أسباب متداخلة، منها الإفراط في استخدام المبيدات، وفقدان المراعي الطبيعية، وبعض الآفات. ولذلك لم تعد حماية النحل شأناً يخص النحّالين وحدهم، بل صارت قضية تمسّ الأمن الغذائي."],"p3":["يظن كثيرون أن التغيير الكبير يحتاج إلى قرار كبير، فيبدؤون بحماسة عالية ثم لا يلبثون أن يتوقفوا. والواقع أن أكثر ما يغيّر حياة الإنسان عادات صغيرة يكررها كل يوم حتى تصير جزءاً منه.","فمن قرأ عشر صفحات في اليوم لم يشعر بثقلها، لكنه يكون قد أتمّ في العام أكثر من ثلاثة آلاف وخمسمئة صفحة. ومن ادّخر مبلغاً يسيراً كل شهر وجد بعد سنوات ما لم يكن يتوقعه. فالأثر لا يظهر في يوم أو أسبوع، وإنما يتراكم في صمت حتى يفاجئ صاحبه.","غير أن هذه القاعدة سيف ذو حدّين؛ فالعادة السيئة الصغيرة تتراكم بالطريقة نفسها. دقائق قليلة تُهدر كل يوم تبدو هيّنة، لكنها تصبح في آخر العام أياماً كاملة. ولهذا كان السؤال الأهم ليس: ماذا سأنجز اليوم؟ بل: ما الذي أكرره كل يوم؟"],"p4":["نكتب الأعداد اليوم بسهولة تجعلنا ننسى أن هذه الطريقة لم تكن معروفة في أكثر الحضارات القديمة. فقد كان الرومان، مثلاً، يكتبون الأعداد برموز تُجمع وتُطرح، فإذا كبر العدد طالت كتابته، وصار ضرب عددين عملاً شاقاً لا يتقنه إلا المتخصصون.","ثم ظهر في الهند نظام يقوم على فكرتين: أن قيمة الرقم تتغير بتغيّر موضعه، وأن للفراغ رمزاً هو الصفر. وبهاتين الفكرتين صار في الإمكان كتابة أي عدد، مهما كبر، بعشرة رموز فقط.","وأدرك علماء المسلمين قيمة هذا النظام، فأخذوه وشرحوه وبنوا عليه، ومن أشهرهم الخوارزمي الذي ألّف فيه كتاباً تُرجم لاحقاً إلى اللاتينية. ومن طريق هذه الترجمات عرفته أوروبا، لكنها لم تتقبله سريعاً؛ فقد ظل كثيرون زمناً طويلاً متمسكين بالطريقة القديمة قبل أن يسود النظام الجديد.","وهكذا فإن ما نعدّه اليوم من البديهيات كان في حقيقته ثمرة انتقال المعرفة بين أمم مختلفة، أضافت كل واحدة منها شيئاً ثم سلّمته لمن بعدها."],"p5":["لم يعرف الإنسان عصراً توافرت فيه المعلومات كما توافرت اليوم؛ فكل ما يخطر بالبال صار على بُعد ضغطة زر. ومع ذلك يشكو كثيرون من أنهم يقرؤون أكثر ويفهمون أقل، وأنهم يعجزون عن إتمام كتاب واحد.","وتفسير ذلك أن الوفرة في المعلومات تقابلها ندرة في شيء آخر: الانتباه. فالتطبيقات تتنافس على دقائق المستخدم، وتُصمَّم بعناية لتقطع عليه ما هو فيه بإشعار بعد إشعار. والعقل الذي يتنقل كل دقيقتين بين مهمة وأخرى لا يتعمق في أيٍّ منها، وإن ظنّ صاحبه أنه ينجز أشياء كثيرة في وقت واحد.","والتركيز، مثل العضلة، يقوى بالتمرين ويضعف بالإهمال. ومن أيسر تمارينه أن يخصص المرء وقتاً محدداً لعمل واحد، يُبعد فيه هاتفه عن يده وعينه، ويبدأ بمدة قصيرة يزيدها شيئاً فشيئاً. وقد يجد ذلك ثقيلاً في أول الأمر، لكن الثقل نفسه علامة على أن العضلة تعمل."],"w1":["كان المسافر قديماً لا يخرج إلا ومعه دليل يعرف الطريق، أو خريطة مرسومة باليد قد تخطئ في مسافة أو تُسقط وادياً. ومع ذلك وصل الناس إلى أقاصي الأرض، لأنهم تعلّموا قراءة ما حولهم: النجوم ليلاً، والشمس نهاراً، ومعالم الطريق.","واليوم يكفي أن يكتب المرء اسم المكان في هاتفه ليدلّه صوتٌ على كل منعطف. وقد جعل ذلك التنقل أيسر وأسرع، لكنه أضعف عند كثيرين مهارة كانت بديهية: أن يعرف الإنسان أين هو، وأن يرسم في ذهنه صورة للمكان.","وليس المطلوب أن نترك هذه الأدوات، بل ألا نسلّم لها كل شيء. فمن نظر إلى الخريطة كاملة قبل أن يتحرك، وانتبه لما يمرّ به من معالم، جمع بين راحة الأداة ويقظة العقل."],"w2":["يظن كثيرون أن الجمل يخزن الماء في سنامه، والصحيح أن السنام مخزن للدهن، يستمد منه الجمل طاقته إذا قلّ الطعام أياماً. أما صبره على العطش فله أسباب أخرى؛ فجسمه يقتصد في الماء اقتصاداً شديداً، ويحتمل أن يفقد منه قدراً كبيراً لا تحتمله أكثر الحيوانات.","وإذا وجد الماء عوّض ما فقده سريعاً، فيشرب في دقائق عشرات اللترات. وله في الصحراء عُدّة كاملة: أهداب طويلة تردّ الرمل عن عينيه، ومنخران يُغلقهما عند هبوب العاصفة، وخفّ عريض لا يغوص في الرمل.","ولهذا لم يكن غريباً أن يسمّيه العرب «سفينة الصحراء»؛ فقد حمل تجارتهم وأسفارهم قروناً في أرض لا يصبر عليها غيره."],"w3":["أثقل ما في العمل بدايته. فالمرء يؤجل الواجب لا لأنه طويل، بل لأن الشروع فيه يبدو في ذهنه أكبر من حقيقته. فإذا بدأ وجد أن ما كان يهابه أهون مما ظن.","ومن الحيل النافعة أن يَعِد الإنسان نفسه بخمس دقائق فقط: يفتح الكتاب ويقرأ خمس دقائق، ثم له أن يتوقف إن شاء. وفي أكثر الأحوال لا يتوقف، لأن العقبة كانت في البداية لا في الاستمرار.","وكل تأجيل يُكسب صاحبه راحة قصيرة، ثم يردّها عليه قلقاً أطول؛ فالواجب المؤجل لا يغيب عن الذهن، بل يبقى فيه يزاحم كل متعة."],"w4":["قبل الورق كتب الناس على ما تيسّر: ألواح الطين، وورق البردي، وجلود الحيوان. وكانت كلها غالية أو ثقيلة أو سريعة التلف، فبقيت الكتب قليلة لا يملكها إلا القادرون.","ثم عُرفت في الصين صناعة الورق من ألياف النبات، وانتقلت منها إلى العالم الإسلامي، فقامت له مصانع في مدن كبغداد ودمشق، ورخص ثمنه حتى كثرت به المكتبات ودكاكين الورّاقين. ومن هناك عرفته أوروبا بعد قرون.","ولم يكن أثر الورق في الكتب وحدها؛ فحين رخصت الكتابة كثر المتعلمون، وحُفظت العلوم، وتناقلتها الأمم. وكثيراً ما يغيّر العالمَ اختراعٌ بسيط يجعل النافع في يد الجميع."],"w5":["يعرف الناس أن الرياضة تقوّي الجسم، وأقل منهم من يعرف أثرها في الذهن. فالمشي السريع نصف ساعة يحسّن المزاج ساعات بعده، ويجعل صاحبه أقدر على التركيز.","ولا يلزم لذلك نادٍ ولا أدوات؛ فالمهم الانتظام لا الشدة. ومن مشى كل يوم قليلاً نال ما لا يناله من أجهد نفسه يوماً ثم انقطع أسبوعاً.","ولهذا يُنصح الطالب إذا أثقلته المذاكرة ألا يزيد ساعاتها، بل يقطعها بحركة قصيرة: يمشي دقائق ثم يعود، فيجد ذهنه أصفى مما تركه."],"w6":["من أول ما يتعلمه من يدبّر ماله أن يفرّق بين الحاجة والرغبة. فالحاجة ما لا تستقيم الحياة بدونه، كالطعام والسكن والدواء. والرغبة ما نحبه ونقدر على العيش بدونه.","والحدّ بينهما ليس ثابتاً؛ فالهاتف حاجة لمن يعمل به، ورغبة إذا كان الغرض استبدال جديدٍ بآخر يؤدي العمل نفسه. والإعلان بارع في أن يُلبس الرغبة ثوب الحاجة، فيُقنع المرء أنه لا يستغني عمّا لم يكن يعرفه بالأمس.","وليس في الرغبات عيب، وإنما العيب أن تتقدم على الحاجات، أو أن يُشترى بالدَّين ما يُستغنى عنه. ومن اعتاد أن يسأل نفسه قبل الشراء: «أأحتاجه أم أريده؟» حفظ ماله وراحة باله."],"w7":["تمتاز العربية بأن أكثر كلماتها ترجع إلى جذور من ثلاثة أحرف، يُشتق من الجذر الواحد عشرات الكلمات المتقاربة في المعنى. فمن «ك ت ب» جاءت: كتب، وكاتب، وكتاب، ومكتبة، ومكتوب.","ولهذا يستطيع القارئ أن يخمّن معنى كلمة لم يرها من قبل إذا عرف جذرها ووزنها. فمن عرف أن وزن «مَفعَل» يدل غالباً على المكان، فهم أن «المَصنَع» مكان الصنع، و«المَلعَب» مكان اللعب، وإن لم يفتح معجماً.","وهذه مهارة تنفع في اختبارات اللغة أكثر من حفظ القوائم؛ فالقوائم تُنسى، وطريقة الاستنتاج تبقى."],"w8":["القمر جسم معتم لا يضيء بنفسه، وما نراه من نوره هو ضوء الشمس منعكساً عن سطحه. والشمس تضيء نصفه دائماً، لكننا لا نرى من هذا النصف إلا الجزء المقابل لنا.","والقمر يدور حول الأرض مرة في نحو شهر، فيتغير في كل ليلة مقدار ما نراه من نصفه المضيء. فإذا كان بيننا وبين الشمس لم نرَ منه شيئاً يُذكر، وهذا المحاق. ثم يظهر هلالاً نحيلاً، ويكبر حتى يصير بدراً حين تكون الأرض بينه وبين الشمس تقريباً، ثم ينقص حتى يعود كما بدأ.","ويخلط بعض الناس بين هذه الأطوار وبين الخسوف. فالأطوار تتكرر كل شهر وسببها تغيّر موضع القمر، أما الخسوف فيحدث حين يقع ظل الأرض على القمر، وهو أقل حدوثاً."]},"F":{"f1":{"kind":"bars","title":"عدد الكتب المستعارة من مكتبة المدرسة في أسبوع","labels":["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"],"values":[40,55,35,60,50],"max":70,"step":10},"f2":{"kind":"pie","title":"توزيع مصروف أسرة في الشهر · "a":0},{"id":"s2q15","s":2,"n":15,"t":"ge","stem":"دائرة محيطها 14ط سم. ما مساحتها؟","e":"المحيط = 2 ط نق = 14ط فيكون نق = 7، والمساحة = ط نق^2 = 49ط سم^2.","o":["7ط سم^2","14ط سم^2","28ط سم^2","49ط سم^2"],"a":3},{"id":"s2q16","s":2,"n":16,"t":"ar","stem":"متوسط درجات طالب في 4 اختبارات 82. كم يجب أن تكون درجته في الاختبار الخامس ليصبح متوسطه 85؟","e":"المجموع المطلوب 5 × 85 = 425، والمجموع الحالي 4 × 82 = 328، فالدرجة المطلوبة 425 − 328 = 97.","o":["88","94","97","100"],"a":2},{"id":"s2q17","s":2,"n":17,"t":"al","stem":"إذا كان س + ص = 10 و س − ص = 4، فما قيمة س × ص؟","e":"بجمع المعادلتين: 2س = 14 فيكون س = 7 و ص = 3، وحاصل ضربهما 21.","o":["14","21","24","40"],"a":1},{"id":"s2q18","s":2,"n":18,"t":"ge","stem":"سلّم طوله 13 م يستند إلى جدار رأسي، وتبعد قاعدته عن الجدار 5 م. إلى أي ارتفاع يصل على الجدار؟","e":"مثلث قائم وتره 13 وأحد ضلعيه 5، فالضلع الآخر 12 (الثلاثية 5، 12، 13).","o":["8 م","12 م","14 م","18 م"],"a":1},{"id":"s2q19","s":2,"n":19,"t":"ar","stem":"في مدرسة 600 طالب، 45% منهم في المرحلة المتوسطة والباقون في الثانوية. إذا شارك 20% من طلاب الثانوية في النادي العلمي، فكم طالباً من الثانوية يشارك فيه؟","e":"طلاب الثانوية 55% من 600 = 330، و20% منهم = 66. من حسب 20% من طلاب المتوسطة حصل على 54.","o":["54","60","66","120"],"a":2},{"id":"s2q20","s":2,"n":20,"t":"ar","stem":"إذا كان س عدداً موجباً.","e":"جرّب: س = 2 مربعه 4 وهو أكبر منه. س = {1/2} مربعه {1/4} وهو أصغر منه. س = 1 مربعه يساويه. النتيجة تتغير، فالمعطيات غير كافية.","c":["س^2","س"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":3},{"id":"s2q21","s":2,"n":21,"t":"ge","stem":"مربع طول ضلعه 6 سم، ودائرة طول قطرها 6 سم.","e":"مساحة المربع 36 سم^2، ومساحة الدائرة ط × 3^2 = 9ط أي نحو 28 سم^2. والدائرة التي قطرها يساوي ضلع المربع تقع داخله، فمساحتها أصغر.","c":["مساحة المربع","مساحة الدائرة"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":0},{"id":"s2q22","s":2,"n":22,"t":"da","stem":"كم ريالاً تنفق الأسرة على ":"s3q7","s":3,"n":7,"t":"er","stem":"يُعدّ النوم [[الكافي]] ليلاً من أهم أسباب [[الخمول]] والنشاط، إذ [[يجدّد]] طاقة الجسم ويعينه على [[التركيز]].","e":"النوم الكافي سبب «للحيوية» والنشاط؛ والخمول ضدّ النشاط فلا يُعطف عليه هنا.","o":["الكافي","الخمول","يجدّد","التركيز"],"a":1},{"id":"s3q8","s":3,"n":8,"t":"er","stem":"كان القائد [[حكيماً]]؛ يستشير أهل [[الخبرة]] قبل كل قرار، ولذلك كانت قراراته [[متهورة]] تحظى [[بثقة]] الجميع.","e":"من يستشير أهل الخبرة تكون قراراته «صائبة»، وهي التي تحظى بالثقة.","o":["حكيماً","الخبرة","متهورة","بثقة"],"a":2},{"id":"s3q9","s":3,"n":9,"t":"rd","stem":"أنسب عنوان للنص:","e":"القراءة والادخار مثالان فقط، والفكرة الجامعة أن العادات الصغيرة المتكررة تصنع الأثر الكبير.","p":"p3","o":["القرارات المصيرية","فوائد القراءة اليومية","طرق ادخار المال","أثر العادات الصغيرة"],"a":3},{"id":"s3q10","s":3,"n":10,"t":"rd","stem":"وفق الفقرة (1)، ما أكثر ما يغيّر حياة الإنسان؟","e":"نص الفقرة: «أكثر ما يغيّر حياة الإنسان عادات صغيرة يكررها كل يوم».","p":"p3","o":["الحماسة العالية عند البداية","القرارات الكبيرة","عادات صغيرة يكررها كل يوم","الظروف المحيطة به"],"a":2},{"id":"s3q11","s":3,"n":11,"t":"rd","stem":"لماذا ذكر الكاتب مثال قراءة عشر صفحات؟","e":"المثال يوضح القاعدة: عشر صفحات لا يُشعر بثقلها، لكنها تتجاوز ثلاثة آلاف وخمسمئة صفحة في العام.","p":"p3","o":["ليبيّن أن القليل الدائم يتراكم إلى كثير","ليحثّ على قراءة الكتب الطويلة","ليقارن بين القراءة والادخار","ليبيّن صعوبة الالتزام اليومي"],"a":0},{"id":"s3q12","s":3,"n":12,"t":"rd","stem":"المقصود بعبارة «سيف ذو حدّين» في الفقرة (3):","e":"بعدها مباشرة: «فالعادة السيئة الصغيرة تتراكم بالطريقة نفسها».","p":"p3","o":["أن العادات خطرة دائماً","أن التراكم يعمل في النافع والضار معاً","أن العادة السيئة أقوى من الحسنة","أن التغيير يحتاج إلى قوة"],"a":1},{"id":"s3q13","s":3,"n":13,"t":"rd","stem":"يُفهم من خاتمة النص أن الكاتب يدعو إلى:","e":"جعل الكاتب السؤال الأهم: «ما الذي أكرره كل يوم؟» لا «ماذا سأنجز اليوم؟».","p":"p3","o":["ترك التخطيط للمستقبل","تجنّب العادات كلها","زيادة ما ننجزه في اليوم الواحد","الانتباه لما نكرره كل يوم"],"a":3},{"id":"s3q14","s":3,"n":14,"t":"ar","stem":"ما ناتج: {1/2} + {1/3} + {1/6}؟","e":"بتوحيد المقامات على 6: {3/6} + {2/6} + {1/6} = {6/6} = 1. جمع البسوط مع البسوط والمقامات مع المقامات يعطي {3/11} وهو خطأ.","o":["{3/11}","{2/3}","{5/6}","1"],"a":3},{"id":"s3q15","s":3,"n":15,"t":"ge","stem":"مكعب مساحة أحد أوجهه 16 سم^2. ما حجمه؟","e":"طول الحرف 4 سم لأن 4 × 4 = 16، والحجم 4 × 4 × 4 = 64 سم^3.","o":["32 سم^3","64 سم^3","96 سم^3","256 سم^3"],"a":1},{"id":"s3q16","s":3,"n":16,"t":"ar","stem":"يكفي مخزون علف 12 حصاناً مدة 15 يوماً. كم يوماً يكفي المخزون نفسه 20 حصاناً؟","e":"تناسب عكسي: المخزون = 12 × 15 = 180 حصة يومية، و180 ÷ 20 = 9 أيام. كلما زادت الخيل قلّت الأيام.","o":["9","10","12","25"],"a":0},{"id":"s3q17","s":3,"n":17,"t":"ar","stem":"","e":"س% من ص = ص% من س دائماً، وكلاهما هنا 9.","c":["15% من 60","60% من 15"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":2},{"id":"s3q18","s":3,"n":18,"t":"al","stem":"إذا كان {س/3} + {س/6} = 5، فما قيمة س؟","e":"بتوحيد المقامات: {2س/6} + {س/6} = {3س/6} = {س/2}، و{س/2} = 5 فيكون س = 10.","o":["10","15","18","30"],"a":0},{"id":"s3q19","s":3,"n":19,"t":"ar","stem":"اشترى فهد قميصاً بعد خصم 30% فدفع 140 ريالاً. كم كان سعره قبل الخصم؟","e":"المدفوع 70% من السعر الأصلي: 140 ÷ 0,7 = 200 ريال. إضافة 30% إلى 140 تعطي 182 وهو الفخ.","o":["170","182","190","200"],"a":3},{"id":"s3q20","s":3,"n":20,"t":"ar","stem":"ما العدد التالي في النمط: 2، 6، 12، 20، 30، ...؟","e":"الفروق 4، 6، 8، 10 تزيد 2 كل مرة، فالفرق التالي 12 والعدد 30 + 12 = 42.","o":["40","42","44","56"],"a":1},{"id":"s3q21","s":3,"n":21,"t":"ge","stem":"مضلع منتظم قياس كل زاوية خارجية فيه 30°. كم عدد أضلاعه؟","e":"مجموع الزوايا الخارجية لأي مضلع 360°، فعدد الأضلاع 360 ÷ 30 = 12.","o":["12","15","24","30"],"a":0},{"id":"s3q22","s":3,"n":22,"t":"da","stem":"في أيّ الأندية كانت نسبة الحضور أعلى؟","e":"العلمي 32 ÷ 40 = 80%، الرياضي 54 ÷ 60 = 90%، الثقافي 35 ÷ 50 = 70%، الفني 20 ÷ 25 = 80%.","f":"f3","o":["العلمي","الرياضي","الثقافي","الفني"],"a":1},{"id":"s3q23","s":3,"n":23,"t":"da","stem":"ما نسبة الحاضرين إلى مجموع أعضاء الأندية الأربعة تقريباً؟","e":"الحاضرون 32 + 54 + 35 + 20 = 141 والأعضاء 175. و80% من 175 = 140، فالنسبة أعلى قليلاً من 80%، وأقرب خيار 81%.","f":"f3","o":["75%","78%","81%","85%"],"a":2},{"id":"s3q24","s":3,"n":24,"t":"ar","stem":"عمر أب الآن 4 أمثال عمر ابنه، وبعد 20 سنة يصير عمره مثلَي عمر ابنه. كم عمر الابن الآن؟","e":"ليكن عمر الابن س والأب 4س: 4س + 20 = 2(س + 20) فيكون 2س = 20 و س = 10. تحقق: الآن 10 و40، وبعد 20 سنة 30 و60.","o":["5","10","15","20"],"a":1},{"id":"s4q1","s":4,"n":1,"t":"an","stem":"ربّان : سفينة","e":"قائدٌ ومركبته: الربّان يقود السفينة والطيار يقود الطائرة. السائق يقود السيارة لا الطريق.","o":["طيار : طائرة","مسافر : حقيبة","سائق : طريق","قطار : محطة"],"a":0},{"id":"s4q2","s":4,"n":2,"t":"an","stem":"جدب : خصب","e":"تضاد: الجدب ضد الخصب والشحّ ضد الوفرة. «مطر : غيث» ترادف.","o":["مطر : غيث","زرع : حصاد","شحّ : وفرة","صحراء : رمل"],"a":2},{"id":"s4q3","s":4,"n":3,"t":"an","stem":"مسطرة : طول","e":"أداة قياس وما تقيسه. الكيلوغرام وحدة لا أداة، و«وقت : ساعة» ترتيبها معكوس.","o":["وقت : ساعة","كيلوغرام : وزن","مطر : مظلة","ميزان : وزن"],"a":3},{"id":"s4q4","s":4,"n":4,"t":"od","stem":"أيّ الكلمات الآتية لا تنتمي إلى المجموعة؟","e":"الغضب والحزن والفرح مشاعر، والابتسامة تعبير ظاهر عن شعور وليست شعوراً.","o":["ابتسامة","فرح","غضب","حزن"],"a":0},{"id":"s4q5","s":4,"n":5,"t":"co","stem":"لا يُقاس رقيّ الأمم بما تملكه من ثروات، بل بما ....... من عقول أبنائها.","e":"الرقيّ يقاس بما يُستثمر من العقول، أما الإهدار والإهمال فمقياس تأخّر لا رقيّ.","o":["تهدره","تهمله","تخشاه","تستثمره"],"a":3},{"id":"s4q6","s":4,"n":6,"t":"er","stem":"[[انخفضت]] أسعار السلع كثيراً هذا العام، فاشتكى [[المستهلكون]] من [[الغلاء]] وطالبوا [[بتشديد]] الرقابة على الأسواق.","e":"الشكوى من الغلاء والمطالبة بالرقابة تدلان على أن الأسعار «ارتفعت».","o":["انخفضت","المستهلكون","الغلاء","بتشديد"],"a":0},{"id":"s4q7","s":4,"n":7,"t":"er","stem":"كلما ازداد 4","s":4,"n":14,"t":"ge","stem":"حوض على شكل متوازي مستطيلات أبعاده 2 م و 1,5 م و 1 م. كم لتراً من الماء يملؤه؟ (المتر المكعب = 1000 لتر)","e":"الحجم 2 × 1,5 × 1 = 3 م^3، أي 3000 لتر.","o":["300","450","1500","3000"],"a":3},{"id":"s4q15","s":4,"n":15,"t":"ar","stem":"","e":"2^10 = 1024 و 10^3 = 1000. احفظ أن 2^10 = 1024.","c":["2^10","10^3"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":0},{"id":"s4q16","s":4,"n":16,"t":"ar","stem":"اشترى تاجر 50 قطعة بمبلغ 600 ريال، وباع القطعة الواحدة بمبلغ 15 ريالاً. ما نسبة ربحه؟","e":"تكلفة القطعة 600 ÷ 50 = 12 ريالاً وربحها 3 ريالات، ونسبة الربح تُحسب من التكلفة: 3 ÷ 12 = 25%. القسمة على سعر البيع تعطي 20% وهو الفخ.","o":["15%","20%","25%","30%"],"a":2},{"id":"s4q17","s":4,"n":17,"t":"al","stem":"إذا كان (س + 3)^2 = س^2 + 33، فما قيمة س؟","e":"(س + 3)^2 = س^2 + 6س + 9، فيكون 6س + 9 = 33 و 6س = 24 و س = 4.","o":["4","5","6","8"],"a":0},{"id":"s4q18","s":4,"n":18,"t":"ar","stem":"يدق جرس كل 12 دقيقة وجرس آخر كل 18 دقيقة. إذا دقّا معاً الساعة 8:00، فمتى يدقان معاً في المرة التالية؟","e":"المضاعف المشترك الأصغر للعددين 12 و18 هو 36، فيدقان معاً بعد 36 دقيقة، أي الساعة 8:36.","o":["8:30","8:36","8:54","9:36"],"a":1},{"id":"s4q19","s":4,"n":19,"t":"ge","stem":"في المثلث أ ب جـ: قياس الزاوية أ = 50° وقياس الزاوية ب = 60°.","e":"الزاوية جـ = 180° − 50° − 60° = 70°. الضلع أ ب يقابل الزاوية جـ (70°)، والضلع ب جـ يقابل الزاوية أ (50°)، والضلع المقابل للزاوية الأكبر أطول.","c":["طول الضلع ب جـ","طول الضلع أ ب"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":1},{"id":"s4q20","s":4,"n":20,"t":"ge","stem":"مثلث قائم الزاوية ومتطابق الضلعين، طول وتره 10 سم. ما مساحته؟","e":"إذا كان طول كل ضلع قائم ل فإن ل^2 + ل^2 = 100 أي ل^2 = 50، والمساحة = {1/2} × ل × ل = {1/2} × 50 = 25 سم^2. لا تحتاج إلى حساب ل نفسه.","o":["25 سم^2","50 سم^2","75 سم^2","100 سم^2"],"a":0},{"id":"s4q21","s":4,"n":21,"t":"da","stem":"ما نسبة مبيعات الربع الرابع إلى مبيعات السنة كلها؟","e":"مجموع السنة 120 + 150 + 90 + 180 = 540، و180 ÷ 540 = {1/3}.","f":"f4","o":["{1/6}","{1/5}","{1/4}","{1/3}"],"a":3},{"id":"s4q22","s":4,"n":22,"t":"da","stem":"ما نسبة انخفاض مبيعات الربع الثالث عن الربع الثاني؟","e":"الانخفاض 150 − 90 = 60، ويُنسب إلى القيمة القديمة (الربع الثاني): 60 ÷ 150 = 40%.","f":"f4","o":["25%","40%","60%","67%"],"a":1},{"id":"s4q23","s":4,"n":23,"t":"ar","stem":"خزان فيه 40 لتراً من عصير تركيزه 25%. كم لتراً من الماء نضيف ليصير التركيز 20%؟","e":"العصير الصافي 25% من 40 = 10 لترات ولا يتغير. ليكون 10 لترات تساوي 20% يجب أن يكون المجموع 50 لتراً، فنضيف 10 لترات.","o":["5","8","10","20"],"a":2},{"id":"s4q24","s":4,"n":24,"t":"ar","stem":"ما رقم الآحاد في ناتج 3^23؟","e":"آحاد قوى العدد 3 تتكرر كل أربع: 3، 9، 7، 1. و23 = 20 + 3، فبعد خمس دورات كاملة نأخذ الثالث في الدورة: 7.","o":["1","3","7","9"],"a":2},{"id":"s5q1","s":5,"n":1,"t":"an","stem":"شاعر : قصيدة","e":"مبدعٌ وما يبدعه: الشاعر ينظم القصيدة والرسام يرسم اللوحة. «نجار : منشار» صاحب مهنة وأداته.","o":["رسام : لوحة","نجار : منشار","قارئ : كتاب","لوحة : ألوان"],"a":0},{"id":"s5q2","s":5,"n":2,"t":"an","stem":"بذرة : شجرة","e":"طور أول وما يصير إليه: البذرة تنمو شجرة واليرقة تتحول فراشة.","o":["غصن : ورقة","حديقة : زهرة","يرقة : فراشة","ثمرة : بذرة"],"a":2},{"id":"s5q3","s":5,"n":3,"t":"an","stem":"وجل : خوف","e":"ترادف: الوجل هو الخوف، والحبور هو السرور. «شجاعة : جبن» تضاد.","o":["ليل : ظلام","شجاعة : جبن","حزن : دمعة","حبور : سرور"],"a":3},{"id":"s5q4","s":5,"n":4,"t":"od","stem":"أيّ الكلمات الآتية لا تنتمي إلى المجموعة؟","e":"الخشب والقطن والصوف مواد طبيعية من نبات أو حيوان، والبلاستيك مادة مصنّعة.","o":["خشب","صوف","بلاستيك","قطن"],"a":2},{"id":"s5q5","s":5,"n":5,"t":"co","stem":"من اعتاد ....... عمله إلى الغد تراكمت عليه المهام حتى ....... عن إنجازها.","e":"التأجيل سبب التراكم، والتراكم ينتهي بالعجز عن الإنجاز.","o":["تأجيل .. عجز","تأجيل .. استغنى","إنجاز .. عجز","إتقان .. توقف"],"a":0},{"id":"s5q6","s":5,"n":6,"t":"co","stem":"قد يكون الصمت أحياناً أبلغ من ....... ، وقد يكون الإصغاء أنفع من .......","e":"المفاضلة تكون بين الشيء وضدّه: الصمت والكلام، والإصغاء والحديث. «السكوت» مرادف للصمت و«الاستماع» مرادف للإصغاء فلا تصح المفاضلة بهما.","o":["الهدوء .. الصبر","الكلام .. الاستماع","السكوت .. الكلام","الكلام .. الحديث"],"a":3},{"id":"s5q7","s":5,"n":7,"t":"er","stem":"المؤمن القوي لا [[يستسلم]] [[للصعاب]]، بل يراها [[فرصة]] تدفعه إلى مزيد من [[التراخي]].","e":"من لا يستسلم للصعاب تدفعه إلى مزيد من «الاجتهاد» لا التراخي.","o":["يستسلم","للصعاب","فرصة","التراخي"],"a":3},{"id":"s5q8","s":5,"n":8,"t":"er","stem":"[[أدّى]] انتشار وسائل الاتصال إلى [[تباعد]] المسافات بين الناس، فصار [[التواصل]] مع من في أقاصي الأرض أمراً [[ميسوراً]].","e":"ما جعل التواصل ميسوراً هو «تقارب» المسافات لا تباعدها.","o":["أدّى","تباعد","التواصل","ميسوراً"],"a":1},{"id":"s5q9","s":5,"n":9,"t":"rd","stem":"ما المفارقة التي يبدأ بها النص؟","e":"الفقرة (1): المعلومات متوافرة كما لم تتوافر من قبل، «ومع ذلك» يقرأ كثيرون أكثر ويفهمون أقل.","p":"p5","o":["كثرة الكتب وقلة القرّاء","كثرة التطبيقات وقلة فائدتها","وفرة المعلومات مع ضعف الفهم","تقدّم التقنية وتراجع الصحة"],"a":2},{"id":"s5q10","s":5,"n":10,"t":"rd","stem":"ما الشيء النادر الذي يقصده الكاتب في الفقرة (2)؟","e":"«الوفرة في المعلومات تقابلها ندرة في شيء آخر: الانتباه».","p":"p5","o":["الانتباه","الوقت","المعلومات","التطبيقات"],"a":0},{"id":"s5q11","s":5,"n":11,"t":"rd","stem":"ما رأي الكاتب في تنقّل العقل السريع بين المهام؟","e":"«لا يتعمق في أيٍّ منها، وإن ظنّ صاحبه أنه ينجز أشياء كثيرة»: كثرة الإنجاز ظنٌّ يردّه الكاتب.","p":"p5","o":["يزيد الإنجاز","يمنع التعمق في أيٍّ منها","لا أثر له","يقوّي الذاكرة"],"a":1},{"id":"s5q12","s":5,"n":12,"t":"rd","stem":"لماذا شبّه الكاتب التركيز بالعضلة؟","e":"وجه الشبه مذكور في النص: «يقوى بالتمرين ويضعف بالإهمال».","p":"p5","o":["ليبيّن أنه يضعف مع التقدم في العمر","ليبيّن أنه مرهق للجسم","ليبيّن أنه موهبة فطرية","ليبيّن أنه يقوى بالتدريب"],"a":3},{"id":"s5q13","s":5,"n":13,"t":"rd","stem":"يُفهم من خاتمة النص أن الشعور بالثقل عند بدء التمرين:","e":"«الثقل نفسه علامة على أن العضلة تعمل».","p":"p5","o":["سبب كافٍ للتوقف","أمر طبيعي يدل على أن التمرين يؤثر","دليل على الفشل","علامة ضعف لا يزول"],"a":1},{"id":"s5q14","s":5,"n":14,"t":"ar","stem":"عدد إذا أضفنا إلى نصفه ثلثَه كان الناتج 25. ما العدد؟","e":"نصف العدد + ثلثه = {5/6} العدد = 25، فالعدد = 25 × {6/5} = 30. أو جرّب الخيارات: نصف 30 هو 15 وثلثه 10.","o":["30","36","42","60"],"a":0},{"id":"s5q15","s":5,"n":15,"t":"ar","stem":"انطلقت سيارتان في الوقت نفسه من مدينتين بينهما 360 كم، كلٌّ منهما باتجاه الأخرى، بسرعتي 70 كم/س و 50 كم/س. بعد كم ساعة تلتقيان؟","e":"المتقابلان تُجمع سرعتاهما: 70 + 50 = 120 كم/س، والزمن 360 ÷ 120 = 3 ساعات.","o":["1","2","3","6"],"a":2},{"id":"s5q16","s":5,"n":16,"t":"ar","stem":"في كيس 5 كرات حمراء و3 زرقاء وكرتان خضراوان. سُحبت كرة عشوائياً. ما احتمال ألا تكون زرقاء؟","e":"الكرات 10، وغير الزرقاء 7، فالاحتمال {7/10}. و{3/10} احتمال أن تكون زرقاء.","o":["{1/5}","{3/10}","{1/2}","{7/10}"],"a":3},{"id":"s5q17","s":5,"n":17,"t":"ge","stem":"دائرة مرسومة داخل مربع وتمسّ أضلاعه الأربعة. إذا كانت مساحة المربع 64 سم^2، فما مساحة الدائرة؟","e":"ضلع المربع 8 سم وهو قطر الدائرة، فنصف القطر 4 سم والمساحة ط × 4^2 = 16ط سم^2.","f":"f5","o":["8ط سم^2","16ط سم^2","32ط سم^2","64ط سم^2"],"a":1},{"id":"s5q18","s":5,"n":18,"t":"ar","stem":"إذا كان س و ص عددين موجبين، و س أكبر من ص.","e":"{س/ص} أكبر من 1 لأن البسط أكبر من المقام، و{ص/س} أصغر من 1.","c":["{س/ص}","{ص/س}"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":0},{"id":"s5q19","s":5,"n":19,"t":"al","stem":"إذا كان 2^{س} = 32، فما قيمة 3^{س − 3}؟","e":"32 = 2^5 فيكون س = 5، والمطلوب 3^{5 − 3} = 3^2 = 9.","o":["1","3","6","9"],"a":3},{"id":"s5q20","s":5,"n":20,"t":"ge","stem":"أسطوانة أولى نصف قطر قاعدتها 3 سم وارتفاعها 4 سم، وأسطوانة ثانية نصف قطر قاعدتها 4 سم وارتفاعها 3 سم.","e":"الحجم = ط × نق^2 × ع. الأولى: ط × 9 × 4 = 36ط، والثانية: ط × 16 × 3 = 48ط. نصف القطر يُربَّع فأثره أكبر من أثر الارتفاع.","c":["حجم الأسطوانة الأولى","حجم الأسطوانة الثانية"],"o":["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"a":1},{"id":"s5q21","s":5,"n":21,"t":"da","stem":"ما وسيط الدرجات؟","e":"الدرجات مرتبةً: 6، 6، 7، 7، 7، 8، 8، 8، 9، 10. الوسيط متوسط القيمتين الخامسة والسادسة: (7 + 8) ÷ 2 = 7,5.","f":"f6","o":["6,5","7","7,5","8"],"a":2},{"id":"s5q22","s":5,"n":22,"t":"da","stem":"ما المتوسط الحسابي للدرجات؟","e":"المجموع 6 × 2 + 7 × 3 + 8 × 3 + 9 + 10 = 76، والمتوسط 76 ÷ 10 = 7,6.","f":"f6","o":["7,5","7,6","7,8","8"],"a":1},{"id":"s5q23","s":5,"n":23,"t":"ar","stem":"في فصل 40 طالباً: 25 يحبون كرة القدم، و18 يحبون السباحة، و5 لا يحبون أياً منهما. كم طالباً يحب اللعبتين معاً؟","e":"من يحبون لعبة واحدة على الأقل 40 − 5 = 35. ومجموع 25 + 18 = 43 يزيد على 35 بمقدار 8، وهم من عُدّوا مرتين.","o":["8","10","13","18"],"a":0},{"id":"s5q24","s":5,"n":24,"t":"ar","stem":"قطع رجل الطريق بين مدينتين بسرعة 60 كم/س ذهاباً، وعاد في الطريق نفسه بسرعة 40 كم/س. ما متوسط سرعته في الرحلة كلها؟","e":"افرض المسافة 120 كم: الذهاب ساعتان والعودة 3 ساعات، فالمجموع 240 كم في 5 ساعات أي 48 كم/س. المتوسط ليس 50 لأن زمن السير بالسرعة الأقل أطول.","o":["44","45","48","50"],"a":2},{"id":"w1q1","s":0,"w":1,"n":1,"t":"rd","stem":"ما الفكرة الرئيسة للنص؟","o":["أدوات تحديد الطريق نافعة ما لم تُضعف معرفتنا بالمكان","السفر قديماً كان أسهل من اليوم","يجب ترك الهواتف عند السفر","الخرائط القديمة أدق من الحديثة"],"a":0,"e":"الفقرة الأخيرة تجمع النص: لا نترك الأدوات ولا نسلّم لها كل شيء. والنص لا يقول إن القديم أدق ولا إن السفر كان أسهل.","p":"w1"},{"id":"w1q2","s":0,"w":1,"n":2,"t":"rd","stem":"وفق الفقرة (1)، بمَ استعان المسافرون قديماً لمعرفة الطريق؟","o":["بأصوات تدلّهم على المنعطفات","بخرائط دقيقة لا تخطئ","بالنجوم والشمس ومعالم الطريق","بالمصادفة والحظ"],"a":2,"e":"نص الفقرة: «تعلّموا قراءة ما حولهم: النجوم ليلاً، والشمس نهاراً، ومعالم الطريق».","p":"w1"},{"id":"w1q3","s":0,"w":1,"n":3,"t":"rd","stem":"معنى «نسلّم لها كل شيء» في الفقرة (3):","o":["نرفض استعمالها","نبيعها لغيرنا","نصلحها إذا تعطلت","نعتمد عليها اعتماداً كاملاً"],"a":3,"e":"السياق يقابل بين ترك الأدوات والاعتماد التام عليها، والمطلوب حال وسط بينهما.","p":"w1"},{"id":"w2q1","s":0,"w":2,"n":1,"t":"rd","stem":"ما الخطأ الشائع الذي يصححه النص؟","o":["أن السنام مخزن للماء","أن الجمل يشرب كثيراً","أن الجمل يعيش في الصحراء","أن الجمل يصبر على العطش"],"a":0,"e":"أول النص: «يظن كثيرون أن الجمل يخزن الماء في سنامه، والصحيح أن السنام مخزن للدهن».","p":"w2"},{"id":"w2q2","s":0,"w":2,"n":2,"t":"rd","stem":"أيّ الآتي لم يذكره النص من عُدّة الجمل في الصحراء؟","o":["أهداب طويلة","منخران يُغلقان","خفّ عريض","فرو سميك يقيه البرد"],"a":3,"e":"ذكر النص الأهداب والمنخرين والخفّ، ولم يذكر الفرو. في أسئلة «لم يرد» احذف ما تجده في النص.","p":"w2"},{"id":"w2q3","s":0,"w":2,"n":3,"t":"rd","stem":"لماذا سُمّي الجمل «سفينة الصحراء» وفق النص؟","o":["لأنه يخزن الماء كما تحمله السفينة","لأنه حمل الناس وتجارتهم عبر الصحراء","لأنه يشبه السفينة في شكله","لأنه يعيش قرب البحر"],"a":1,"e":"علّل النص التسمية بعدها مباشرة: «فقد حمل تجارتهم وأسفارهم قروناً».","p":"w2"},{"id":"w3q1","s":0,"w":3,"n":1,"t":"rd","stem":"وفق الفقرة (1)، لماذا يؤجل المرء عمله؟","o":["لأن غيره يؤجل مثله","لأنه لا يعرف طريقة العمل","لأن البدء فيه يبدو له أكبر من حقيقته","لأن العمل طويل في الغالب"],"a":2,"e":"النص ينفي أن يكون السبب طول العمل، ويثبت أن «الشروع فيه يبدو في ذهنه أكبر من حقيقته».","p":"w3"},{"id":"w3q2","s":0,"w":3,"n":2,"t":"rd","stem":"ما الغرض من حيلة الدقائق الخمس؟","o":["إنهاء العمل في خمس دقائق","الاستراحة بين الواجبات","تجاوز صعوبة البداية","تقليل وقت المذاكرة"],"a":2,"e":"«العقبة كانت في البداية لا في الاستمرار»: الحيلة تُدخل صاحبها في العمل، ثم يكمل في الغالب.","p":"w3"},{"id":"w3q3","s":0,"w":3,"n":3,"t":"rd","stem":"يُفهم من الفقرة (3) أن التأجيل:","o":["يُنسي الواجب تماماً","يريح قليلاً ثم يُقلق طويلاً","يريح صاحبه راحة دائمة","يزيد المتعة بالوقت"],"a":1,"e":"«راحة قصيرة، ثم يردّها عليه قلقاً أطول»، والواجب المؤجل «لا يغيب عن الذهن».","p":"w3"},{"id":"w4q1","s":0,"w":4,"n":1,"t":"rd","stem":"لماذا كانت الكتب قليلة قبل الورق، وفق الفقرة (1)؟","o":["لأن المكتبات لم تكن موجودة","لأن الناس لم يعرفوا الكتابة","لأن العلماء كانوا قلة","لأن مواد الكتابة كانت غالية أو ثقيلة أو سريعة التلف"],"a":3,"e":"وصف النص مواد الكتابة القديمة بأنها «غالية أو ثقيلة أو سريعة التلف»، ورتّب على ذلك قلة الكتب.","p":"w4"},{"id":"w4q2","s":0,"w":4,"n":2,"t":"rd","stem":"ما ترتيب انتقال صناعة الورق كما في النص؟","o":["أوروبا ثم الصين ثم العالم الإسلامي","الصين ثم العالم الإسلامي ثم أوروبا","الصين ثم أوروبا ثم العالم الإسلامي","العالم الإسلامي ثم الصين ثم أوروبا"],"a":1,"e":"الفقرة (2): عُرفت في الصين، وانتقلت إلى العالم الإسلامي، «ومن هناك عرفته أوروبا».","p":"w4"},{"id":"w4q3","s":0,"w":4,"n":3,"t":"rd","stem":"ما الذي يستخلصه الكاتب في آخر النص؟","o":["أن اختراعاً بسيطاً قد يغيّر العالم إذا أتاح النافع للجميع","أن الورق أهم الاختراعات كلها","أن الصين أكثر الأمم اختراعاً","أن الكتب الورقية ستبقى إلى الأبد"],"a":0,"e":"آخر جملة في النص: «يغيّر العالمَ اختراعٌ بسيط يجعل النافع في يد الجميع». بقية الخيارات أوسع مما قاله.","p":"w4"},{"id":"w5q1","s":0,"w":5,"n":1,"t":"rd","stem":"ما الذي يركّز عليه النص من فوائد الرياضة؟","o":["أثرها في المزاج والتركيز","أثرها في إنقاص الوزن","أثرها في طول العمر","أثرها في بناء العضلات"],"a":0,"e":"النص يبدأ بأن أثر الرياضة في الذهن أقل شهرة، ثم يدور كله حول المزاج والتركيز.","p":"w5"},{"id":"w5q2","s":0,"w":5,"n":2,"t":"rd","stem":"معنى «الانتظام لا الشدة» في الفقرة (2):","o":["لا بد من التمرين في نادٍ","الرياضة الشديدة أنفع دائماً","القليل المستمر خير من الكثير المنقطع","لا فائدة من الرياضة الخفيفة"],"a":2,"e":"فسّرها النص بعدها: من مشى كل يوم قليلاً نال أكثر ممن أجهد نفسه يوماً ثم انقطع.","p":"w5"},{"id":"w5q3","s":0,"w":5,"n":3,"t":"rd","stem":"بمَ يُنصح الطالب إذا أثقلته المذاكرة؟","o":["أن يذاكر وهو يمشي","أن يترك المذاكرة ذلك اليوم","أن يزيد ساعات المذاكرة","أن يقطعها بحركة قصيرة ثم يعود"],"a":3,"e":"الفقرة (3): «ألا يزيد ساعاتها، بل يقطعها بحركة قصيرة: يمشي دقائق ثم يعود».","p":"w5"},{"id":"w6q1","s":0,"w":6,"n":1,"t":"rd","stem":"ما الفرق بين الحاجة والرغبة وفق الفقرة (1)؟","o":["الحاجة غالية والرغبة رخيصة","الحاجة لا تستقيم الحياة بدونها، والرغبة يمكن العيش بدونها","الحاجة للكبار والرغبة للصغار","لا فرق بينهما في الحقيقة"],"a":1,"e":"تعريف النص: الحاجة «ما لا تستقيم الحياة بدونه»، والرغبة «ما نحبه ونقدر على العيش بدونه».","p":"w6"},{"id":"w6q2","s":0,"w":6,"n":2,"t":"rd","stem":"ماذا يقصد الكاتب بأن الإعلان «يُلبس الرغبة ثوب الحاجة»؟","o":["يجعل ما نرغب فيه يبدو ضرورياً","يبيع الملابس بأسعار عالية","يخفي عيوب السلع","يمنع الناس من شراء حاجاتهم"],"a":0,"e":"التعبير مجازي، وفسّره ما بعده: «يُقنع المرء أنه لا يستغني عمّا لم يكن يعرفه بالأمس».","p":"w6"},{"id":"w6q3","s":0,"w":6,"n":3,"t":"rd","stem":"ما موقف الكاتب من الرغبات؟","o":["يجب تركها كلها","هي أهم من الحاجات","لا تُشترى إلا بالدَّين","لا عيب فيها ما لم تتقدم على الحاجات"],"a":3,"e":"«وليس في الرغبات عيب، وإنما العيب أن تتقدم على الحاجات».","p":"w6"},{"id":"w7q1","s":0,"w":7,"n":1,"t":"rd","stem":"ما الميزة التي يتحدث عنها النص؟","o":["كثرة الحروف في العربية","صعوبة المعاجم العربية","اشتقاق كلمات كثيرة من جذر واحد","تشابه العربية مع اللغات الأخرى"],"a":2,"e":"النص كله عن الجذر الثلاثي وما يُشتق منه، وكيف يعين ذلك على تخمين المعاني.","p":"w7"},{"id":"w7q2","s":0,"w":7,"n":2,"t":"rd","stem":"وفق الفقرة (2)، علامَ يدل وزن «مَفعَل» غالباً؟","o":["على الآلة","على المكان","على من يقوم بالفعل","على الزمان"],"a":1,"e":"نص الفقرة: «وزن مَفعَل يدل غالباً على المكان»، ومثّل بالمصنع والملعب.","p":"w7"},{"id":"w7q3","s":0,"w":7,"n":3,"t":"rd","stem":"بناءً على النص، ما المعنى الأقرب لكلمة «مَسبَح»؟","o":["من يسبح","وقت السباحة","أداة السباحة","مكان السباحة"],"a":3,"e":"الكلمة على وزن «مَفعَل» من الجذر «س ب ح»، فهي مكان السباحة، كما أن الملعب مكان اللعب.","p":"w7"},{"id":"w8q1","s":0,"w":8,"n":1,"t":"rd","stem":"من أين يأتي نور القمر وفق النص؟","o":["من النجوم القريبة","من ضوء الشمس المنعكس عن سطحه","من داخله","من ضوء الأرض"],"a":1,"e":"أول النص: القمر «لا يضيء بنفسه»، ونوره «ضوء الشمس منعكساً عن سطحه».","p":"w8"},{"id":"w8q2","s":0,"w":8,"n":2,"t":"rd","stem":"ما سبب تغيّر شكل القمر خلال الشهر؟","o":["تغيّر مقدار ما نراه من نصفه المضيء مع دوران const CMP=['القيمة الأولى أكبر','القيمة الثانية أكبر','القيمتان متساويتان','المعطيات غير كافية'];

/* العدد مع معدوده: 3–10 جمع، 11–99 مفرد منصوب، المئات مفرد مجرور، و2 مثنى */
const RIYAL={a:'ريالاً',p:'ريالات',g:'ريال',d:'ريالين'},SAA={a:'ساعة',p:'ساعات',g:'ساعة',d:'ساعتين'},
  SANA={a:'سنة',p:'سنوات',g:'سنة',d:'سنتين'},YAWM={a:'يوماً',p:'أيام',g:'يوم',d:'يومين'},AMIL={a:'عاملاً',p:'عمال',g:'عامل',d:'عاملين'},
  KITAB={a:'كتاباً',p:'كتب',g:'كتاب',d:'كتابين'},TALIB={a:'طالباً',p:'طلاب',g:'طالب',d:'طالبين'},DAQ={a:'دقيقة',p:'دقائق',g:'دقيقة',d:'دقيقتين'};
function U(n,w){
  if(n===2)return w.d;
  const r=n%100;
  if(r>=3&&r<=10)return n+' '+w.p;
  if(r>=11)return n+' '+w.a;
  return n+' '+w.g;
}

/* اختيار ثلاثة مشتتات حول الجواب بحيث يقع الجواب في موضع عشوائي بعد الترتيب التصاعدي.
   pri: المرشحون (الأول هو الخطأ الأشهر ويُقدَّم إن وقع في الجهة المطلوبة)، syn: قيم قريبة تُولَّد عند الحاجة */
function around(isLow,pri,syn){
  const pl=pri.filter(isLow),ph=pri.filter(x=>!isLow(x)),sl=syn.filter(isLow),sh=syn.filter(x=>!isLow(x));
  let r=ri(0,3);
  r=Math.min(r,pl.length+sl.length);
  if(3-r>ph.length+sh.length)r=3-(ph.length+sh.length);
  const take=(c,s,k)=>{
    const head=c.length&&c[0]===pri[0]?[c[0]]:[],out=[];
    head.concat(shuf(c.slice(head.length))).concat(s).forEach(x=>{if(out.length<k)out.push(x);});
    return out;
  };
  return take(pl,sl,r).concat(take(ph,sh,3-r));
}
/* خيارات عددية مرتبة تصاعدياً */
function num(ans,cands,o){
  o=o||{};
  const A=r2(ans),intA=isInt(A),set=[],syn=[];
  const fits=v=>v>0&&v!==A&&set.indexOf(v)<0&&syn.indexOf(v)<0&&(o.max==null||v<=o.max);
  cands.forEach(v=>{
    if(v==null||!isFinite(v))return;
    v=r2(v);
    if(!fits(v)||(intA&&!isInt(v)))return;
    set.push(v);
  });
  const step=o.step||(A>=200?20:A>=50?10:A>=20?5:A>=8?2:1);
  for(let m=1;m<=8;m++){const l=r2(A-step*m),h=r2(A+step*m);if(fits(l))syn.push(l);if(fits(h))syn.push(h);}
  const all=around(v=>v<A,set,syn).concat([A]).sort((x,y)=>x-y);
  return {o:all.map(v=>fN(v)+(o.suf||'')),a:all.indexOf(A)};
}
/* خيارات كسرية مرتبة تصاعدياً بلا تكرار في القيمة */
function fracs(n,d,cands,lt1){
  const A=n/d,seen=[A],set=[],syn=[];
  const ok=c=>c[0]>0&&c[1]>0&&(!lt1||c[0]<c[1])&&seen.every(v=>Math.abs(v-c[0]/c[1])>1e-9);
  const add=(c,to)=>{if(ok(c)){to.push(c);seen.push(c[0]/c[1]);}};
  cands.forEach(c=>add(c,set));
  for(let k=1;k<=5;k++)[[n,d+k],[n+k,d],[n,d-k],[n-k,d],[n+k,d+k+1]].forEach(c=>add(c,syn));
  const all=around(c=>c[0]/c[1]<A,set,syn).concat([[n,d]]).sort((x,y)=>x[0]/x[1]-y[0]/y[1]);
  return {o:all.map(c=>fr(c[0],c[1])),a:all.findIndex(c=>c[0]===n&&c[1]===d)};
}
function strs(ok,wrong){
  const ds=[];wrong.forEach(w=>{if(w!==ok&&ds.indexOf(w)<0)ds.push(w);});
  const o=shuf(ds.slice(0,3).concat([ok]));
  return {o:o,a:o.indexOf(ok)};
}
function Q(k,t,stem,op,e,v,x){
  const q={k:k,t:t,stem:stem,o:op.o,a:op.a,e:e,v:v!==false};
  if(x)Object.keys(x).forEach(n=>{q[n]=x[n];});
  return q;
}
function verdict(x,y){return x>y?[0,'فالقيمة الأولى أكبر']:x<y?[1,'فالقيمة الثانية أكبر']:[2,'فالقيمتان متساويتان'];}

const T={};
T.pct_of=()=>{
  let p,N,a;
  do{p=pick([5,10,15,20,25,30,35,40,45,60,75,80]);N=pick([40,60,80,120,140,160,200,240,300,360,400,500,600]);a=p*N/100;}while(!isInt(a)||a===N-a);
  const v=ri(0,2),short={10:'10% هي العُشر، فاقسم على 10.',20:'20% هي الخُمس، فاقسم على 5.',25:'25% هي الربع، فاقسم على 4.',75:'75% هي ثلاثة أرباع: اقسم على 4 ثم اضرب في 3.'}[p];
  const stem=v===0?'ما قيمة '+p+'% من '+N+'؟':v===1?'في مكتبة '+U(N,KITAB)+'، '+p+'% منها كتب علمية. كم كتاباً علمياً فيها؟':'في مدرسة '+U(N,TALIB)+'، شارك '+p+'% منهم في رحلة. كم طالباً شارك؟';
  return Q('pct_of','ar',stem,num(a,[N-a,a*2,a/2,a+N/10,a-N/10,a+5,a-5,a+10]),
    p+'% من '+N+' = '+fr(p,100)+' × '+N+' = '+a+'.'+(short?' '+short:''),isInt(a)&&Math.abs(a/N*100-p)<1e-9);
};
T.pct_disc=()=>{
  let P,d,x;
  do{P=20*ri(4,30);d=pick([10,15,20,25,30,40]);x=P*d/100;}while(!isInt(x));
  const a=P-x,it=pick(['حقيبة','ساعة','دراجة','نظارة','سماعة']);
  return Q('pct_disc','ar',it+' سعرها '+U(P,RIYAL)+'، وعليها خصم '+d+'%. كم ريالاً يدفع من يشتريها؟',
    num(a,[x,P-d,P+x,a+10,a-10,a+20,a-20]),
    'قيمة الخصم = '+d+'% × '+P+' = '+x+'. السعر بعد الخصم = '+P+' − '+x+' = '+a+'. وبخطوة واحدة: '+(100-d)+'% × '+P+' = '+a+'. الفخ: '+x+' هي قيمة الخصم لا السعر.',
    Math.abs(a-P*(1-d/100))<1e-9);
};
T.pct_rev=()=>{

    num(O,[W,S+d,O+20,O-20,O+40,S+S*d/200]),
    'بعد خصم '+d+'% يبقى '+(100-d)+'% من السعر الأصلي، وهذا الباقي هو '+S+'. إذن السعر الأصلي = '+S+' ÷ '+fr(100-d,100)+' = '+O+'. الفخ: زيادة '+d+'% على '+S+' تعطي '+W+'، وهي خطأ لأن الخصم حُسب من السعر الأصلي لا من '+S+'.',
    O*(100-d)===S*100);

T.pct_change=()=>{

    num(k,[D/B*100,D,100-k,k/2,k*2,k+10,k-5,k+5],{suf:'%',max:100}),
    'مقدار التغير = '+Math.max(A,B)+' − '+Math.min(A,B)+' = '+D+'. النسبة = '+raw(D,A)+' × 100 = '+k+'%. يُنسب التغير دائماً إلى القيمة الأصلية ('+A+') لا إلى الجديدة.',

T.ratio_split=()=>{
  let a,b;
  do{a=ri(1,7);b=ri(1,7);}while(a===b||gcd(a,b)!==1);
  const u=5*ri(2,12),Tt=(a+b)*u,sec=ri(0,1)===1,nm=pick([['سعد','ماجد'],['علي','حسن'],['فيصل','تركي']]),want=sec?b:a,oth=sec?a:b,ans=want*u;
  return Q('ratio_split','ar','قُسم مبلغ '+U(Tt,RIYAL)+' بين '+nm[0]+' و'+nm[1]+' بنسبة '+a+' : '+b+' على الترتيب. كم ريالاً نصيب '+nm[sec?1:0]+'؟',
    num(ans,[oth*u,u,Tt/2,Tt/want,ans+u,ans-u,ans+2*u]),
    'مجموع الأجزاء = '+a+' + '+b+' = '+(a+b)+'. قيمة الجزء الواحد = '+Tt+' ÷ '+(a+b)+' = '+u+'. نصيب '+nm[sec?1:0]+' = '+want+' × '+u+' = '+ans+'.',
    ans*(a+b)===want*Tt);
};

T.prop_inverse=()=>{

  do{W=pick([24,36,48,60,72,96,120]);w1=ri(3,12);w2=ri(3,12);}while(w1===w2||W%w1||W%w2||W/w1<3||W/w2<3);
  const d1=W/w1,d2=W/w2;

    num(d2,[d1*w2/w1,d1+(w1-w2),d1-(w1-w2),d2+1,d2-1,d2+2,d2+3]),
    'العلاقة عكسية: كلما زاد العمال قلّت الأيام. حجم العمل = '+w1+' × '+d1+' = '+W+' (يوم عمل). عدد الأيام = '+W+' ÷ '+w2+' = '+d2+'. الفخ: التناسب الطردي هنا يعطي جواباً معكوساً.',

T.avg_missing=()=>{

T.frac_add=()=>{
  let a,b;
  do{a=ri(2,9);b=ri(2,9);}while(a===b);
  if(ri(0,3)===0){
    if(a>b){const t=a;a=b;b=t;}
    const op=fracs(b-a,a*b,[[1,b-a],[1,a*b],[b-a,a+b],[1,a+b],[2,a*b],[b-a+1,a*b]]);
    return Q('frac_add','ar',raw(1,a)+' − '+raw(1,b)+' = ؟',op,
      'وحّد المقامين بضربهما: '+raw(1,a)+' = '+raw(b,a*b)+' و'+raw(1,b)+' = '+raw(a,a*b)+'. الفرق = '+raw(b-a,a*b)+(gcd(b-a,a*b)>1?' = '+fr(b-a,a*b):'')+'. الفخ: طرح المقامين مباشرة خطأ.',
      Math.abs(1/a-1/b-(b-a)/(a*b))<1e-12);
  }
  const op=fracs(a+b,a*b,[[2,a+b],[1,a+b],[1,a*b],[2,a*b],[a+b+1,a*b],[a+b,a*b+a]]);
  return Q('frac_add','ar',raw(1,a)+' + '+raw(1,b)+' = ؟',op,
    'وحّد المقامين بضربهما: '+raw(1,a)+' = '+raw(b,a*b)+' و'+raw(1,b)+' = '+raw(a,a*b)+'. المجموع = '+raw(a+b,a*b)+(gcd(a+b,a*b)>1?' = '+fr(a+b,a*b):'')+'. الفخ: جمع البسطين والمقامين ('+raw(2,a+b)+') خطأ.',
    Math.abs(1/a+1/b-(a+b)/(a*b))<1e-12);
};

      ['س عدد صحيح أكبر من 1','س^2','2س',3,'س = 2 يعطي 4 و4 فتتساويان، و س = 3 يعطي 9 و6 فالأولى أكبر. النتيجة تتغير، فالمعطيات غير كافية.'],
      ['س عدد سالب','س^2','س^3',0,'مربع العدد السالب موجب ومكعبه سالب، والموجب أكبر من السالب دائماً.'],
      ['س + ص = 10','س','ص',3,'قد يكون س = 7 و ص = 3، وقد يكون العكس، وقد يتساويان عند 5. المعطيات غير كافية.'],
      ['س أكبر من ص','س^2','ص^2',3,'إن كانا موجبين فالأولى أكبر. لكن لو كان ص سالباً وبعيداً عن الصفر و س = 1 لصار مربع ص هو الأكبر. النتيجة تتغير، فالمعطيات غير كافية.'],
      ['س عدد صحيح موجب',raw(1,'س'),raw(1,'س + 1'),0,'إذا تساوى البسطان فالكسر ذو المقام الأصغر أكبر. و س أصغر من س + 1، فالكسر الأول أكبر.'],

T.exp_rules=()=>{

      'اضرب '+B+' في نفسه حتى تصل إلى '+val+': '+ch.join('، ')+'. إذن ن = '+n+'.',Math.pow(B,n)===val);
  }

  pct_of:['ar',1,'نسبة من عدد'],pct_disc:['ar',1,'الخصم'],pct_rev:['ar',2,'السعر قبل الخصم'],pct_change:['ar',2,'نسبة التغير'],

  avg_missing:['ar',1,'المتوسط والعدد الناقص'],avg_new:['ar',2,'تغيّر المتوسط'],speed:['ar',1,'السرعة والمسافة'],speed_time:['ar',2,'السرعة والزمن'],
  frac_add:['ar',1,'جمع الكسور وطرحها'],frac_rest:['ar',2,'الكسر والباقي'],work:['ar',2,'العمل المشترك'],cmp:['ar',2,'المقارنة'],
  ages:['al',2,'مسائل الأعمار'],exp_rules:['al',1,'الأسس'],linear:['al',1,'معادلة بمجهول'],consec:['al',2,'الأعداد المتتالية'],
  rect:['ge',1,'المستطيل'],tri_angle:['ge',1,'زوايا المثلث'],pyth:['ge',2,'فيثاغورس'],circle:['ge',2,'الدائرة'],cube:['ge',2,'المكعب'],
  stats:['da',1,'الوسيط والمتوسط والمدى'],prob:['da',2,'الاحتمال'],table:['da',1,'قراءة جدول أو رسم']

const KEYS=Object.keys(META);

/* اختيار قوالب الجلسة: الأضعف أولاً، ثم ما لم يُجرَّب، دون تكرار قالب ما أمكن */
function errOf(st,k){const a=st&&st[k];return a&&a[1]?1-a[0]/a[1]:null;}
function quant(n,o){
  o=o||{};
  let keys=KEYS.filter(k=>(!o.type||META[k][0]===o.type)&&(o.lv2||o.type||META[k][1]===1));
  if(o.only)keys=[o.only];
  if(o.weak){
    const w=KEYS.filter(k=>{const a=o.stats&&o.stats[k];return a&&a[1]>=2&&errOf(o.stats,k)>=0.25;}).sort((x,y)=>errOf(o.stats,y)-errOf(o.stats,x)).slice(0,4);
    if(w.length)keys=w;
  }

    const ws=bag.map(k=>{const e=errOf(o.stats,k);return e==null?1.5:0.6+3*e;}),tot=ws.reduce((p,q)=>p+q,0);

}

/* التناظر */
function relList(D,intro){
  const L=D.R.map(r=>({id:r.id,d:r.d,x:r.x,p:r.p,sym:false}));
  const one=t=>t&&t.indexOf(' ')<0;

  const syn=ws.filter(w=>one(w[1])).map(w=>[w[0],w[1]]),ant=ws.filter(w=>one(w[2])).map(w=>[w[0],w[2]]);
  if(syn.length>=8&&ant.length>=6){
    L.push({id:'syn',d:'ترادف: الكلمتان بمعنى واحد',x:[],p:syn,sym:true});
    L.push({id:'ant',d:'تضاد: كل كلمة ضد الأخرى',x:['degree'],p:ant,sym:true});
  }

}
function ana(D,intro){
  const L=relList(D,intro),by={};
  L.forEach(r=>{by[r.id]=r;});
  const clash=(a,b)=>a.id===b.id||a.x.indexOf(b.id)>=0||b.x.indexOf(a.id)>=0;
  const r=pick(L),ps=shuf(r.p),stem=ps[0];
  const uses=(p,q)=>p[0]===q[0]||p[1]===q[1]||p[0]===q[1]||p[1]===q[0];
  const okp=ps.slice(1).filter(p=>!uses(p,stem))[0]||ps[1];
  const taken=[stem,okp],opts=[],notes=[];
  const fmt=p=>p[0]+' : '+p[1];
  const free=p=>taken.every(q=>!uses(p,q));
  if(r.sym){
    const o2=by[r.id==='syn'?'ant':'syn'],t=shuf(o2.p).filter(free)[0];
    if(t){taken.push(t);opts.push(fmt(t));notes.push('«'+fmt(t)+'» '+(r.id==='syn'?'كلمتان متضادتان':'كلمتان مترادفتان'));}
  }else{
    const t=ps.filter(p=>p!==stem&&p!==okp&&free(p))[0];
    if(t){taken.push(t);opts.push(t[1]+' : '+t[0]);notes.push('«'+t[1]+' : '+t[0]+'» بالعلاقة نفسها لكن بترتيب معكوس');}
  }
  const others=shuf(L.filter(x=>!clash(x,r)&&!(r.sym&&x.sym)));
  for(let i=0;i<others.length&&opts.length<3;i++){
    const t=shuf(others[i].p).filter(free)[0];
    if(!t)continue;
    taken.push(t);opts.push(fmt(t));notes.push('«'+fmt(t)+'» '+others[i].d.split(':')[0]);
  }
  const o=shuf(opts.concat([fmt(okp)]));
  return {t:'an',stem:fmt(stem),o:o,a:o.indexOf(fmt(okp)),v:opts.length===3&&new Set(o).size===4,
    e:'العلاقة: '+r.d.split(':')[0]+'. «'+fmt(okp)+'» بالعلاقة نفسها'+(r.sym?'':' والترتيب نفسه')+'. وفي بقية الخيارات: '+notes.join('، ')+'.'};
}
function anaSet(n,D,intro){
  const out=[],seen={};
  let g=0;
  while(out.length<n&&g<n*20){g++;const q=ana(D,intro);if(q.v&&!seen[q.stem]){seen[q.stem]=1;out.push(q);}}
  return out;
}

/* سؤال مفردة: mode = 'm' المعنى، 'a' الضد */
function vocQ(D,i,mode){
  const V=D.V,AX=D.AX,w=V[i],ok=mode==='a'?w[2]:w[1],own=[w[0],w[1],w[2]],pool=[];
  V.forEach((x,j)=>{
    if(j===i||x[4]!==w[4]||x[3]===w[3]||(AX[x[3]]&AX[w[3]]))return;
    [x[1],x[2]].forEach(t=>{if(t&&own.indexOf(t)<0&&pool.indexOf(t)<0)pool.push(t);});
  });
  const sp=t=>t.indexOf(' ')>=0,ph=shuf(pool.filter(sp)),sg=shuf(pool.filter(t=>!sp(t)));
  let ds=sp(ok)?ph.slice(0,2):(RNG()<0.25?ph.slice(0,1):[]);
  ds=ds.concat(sg).slice(0,3);
  const trap=mode==='a'?w[1]:w[2];
  if(trap&&RNG()<0.6)ds[ds.length-1]=trap;
  const o=shuf(ds.concat([ok]));
  return {o:o,a:o.indexOf(ok),v:new Set(o).size===4};
}

return {T:T,META:META,KEYS:KEYS,CMP:CMP,quant:quant,ana:ana,anaSet:anaSet,vocQ:vocQ,relList:relList,seed:f=>{RNG=f||Math.random;}};
})();

const PH={a:'البناء',b:'الأنواع',1:'التأسيس',2:'التدريب المكثف',3:'المحاكاة',4:'التهيئة',5:'يوم الاختبار'};
const CD=56;
const SPR={t:'سباق الحساب الذهني: ثلاث جولات',m:5,a:'sprint'};
const SPR1={t:'سباق الحساب الذهني: جولة واحدة',m:3,a:'sprint'};
const VOC={t:'مفردات اليوم: كلمات جديدة ومراجعة ما حان موعده',m:5,a:'voc'};
const READ={t:'قراءة حرة: كتاب أو مقال تحبه',m:15};
const LESSONS=['exam','method','verbal','quant','time','sheet','traps','day'];
const TYPEWK=['an','ar','co','ge','er','da','rd','al'];
function quantTask(n,weak){return weak?{t:n+' مسائل من أضعف أنواعك',m:Math.round(n*1.3),a:'quant',n:n,weak:1}:{t:n+' مسائل كمية متجددة',m:Math.round(n*1.5),a:'quant',n:n};}
function anaTask(n){return {t:n+' أسئلة تناظر لفظي متجددة',m:Math.round(n*0.8),a:'ana',n:n};}
function ckTask(k){return k===1?{t:'قياس البداية: حل «القسم 1» موقوتاً. النتيجة لا تهمّ الآن، المهم أن تعرف من أين تبدأ',m:30,a:'sec',arg:1}
  :{t:'محطة قياس: حل «القسم '+k+'» موقوتاً ثم راجع أخطاءه',m:45,a:'sec',arg:k};}
function lessonTask(i){const id=LESSONS[i%LESSONS.length],g=GUIDE.filter(x=>x.id===id)[0];return {t:'درس الأسبوع من «الطريقة»: '+(g?g.title:''),m:10,a:'guide',arg:id};}
function preTasks(ph,wd,o){
  if(o.first)return [{t:'اقرأ «افهم الاختبار» في تبويب الطريقة: خمس دقائق تعرّفك بما أنت مقبل عليه',m:5,a:'guide',arg:'exam'},VOC,SPR1];
  if(wd===5)return [];
  const A=ph==='a';let ts;
  if(wd===6){
    ts=A?[]:[lessonTask(o.wk)];
    ts.push({t:'نص الأسبوع: اقرأه ثم أجب عن أسئلته الثلاثة',m:10,a:'wk'});
    ts.push(o.sec?ckTask(o.sec):quantTask(A?8:10,true));
    ts.push(VOC);
    ts.push(A?SPR1:{t:'راجع دفتر الأخطاء وحدّد سبب كل خطأ',m:5,a:'mis'});
  }else if(wd===0||wd===2||wd===4){
    ts=[VOC,quantTask(A?5:8),READ];
    if(A||wd===2)ts.push(SPR1);
  }else{
    ts=[VOC,anaTask(A?6:8),READ];
    if(!A&&wd===3){const g=TYPEWK[o.wk%TYPEWK.length];ts.push({t:'تدريب بلا وقت على «'+GRN[g].n+'»',m:10,a:'type',arg:g});}
  }
  if(o.boost)ts.push({t:'وضع الإجازة: درس من دورة تأسيس، أو جلسة إضافية من تبويب «تدريب»',m:30});
  return ts;
}

      SPR,
      {t:'سجّل أخطاء اليوم في دفتر الأخطاء مع سبب كل خطأ',m:10,a:'mis'}],
  p2:wd=>wd===5?[
      {t:'اختبار محاكٍ كامل: 5 أقسام متتالية بلا جوال، من اختبارات دورتك أو من هنا',m:125,a:'full'},
      {t:'راجع أخطاء الاختبار كلها وسجّلها بأسبابها',m:60,a:'mis'},
      {t:'قراءة حرة: مقال أو فصل من كتاب',m:20}]
    :wd===6?[
      {t:'أعد حل دفتر أخطاء هذا الأسبوع',m:40,a:'mis'},
      {t:'قسمان موقوتان متتاليان من بنك دورتك: 48 سؤالاً في 50 دقيقة',m:50},
      {t:'راجع في دورتك درس أضعف نوع عندك',m:40},SPR]
    :[
      {t:'24 سؤالاً لفظياً من بنك دورتك في 25 دقيقة',m:25},
      {t:'24 سؤالاً كمياً من بنك دورتك في 25 دقيقة',m:25},
      {t:'راجع كل خطأ وسجّله بسببه',m:30,a:'mis'},
      {t:'15 سؤالاً من أضعف نوع عندك',m:20},SPR],
  p3:(wd,j)=>(wd===5||wd===6)?[
      {t:'اختبار محاكٍ كامل في ساعة اختبارك الحقيقية',m:125,a:'full'},
      {t:'راجع أخطاءه واحداً واحداً',m:60,a:'mis'},
      {t:'نم في الموعد الذي ستنام فيه ليلة الاختبار',m:0}]
    :j%2===0?[
      {t:'قسمان موقوتان متتاليان في جلسة واحدة',m:50},

      {t:'ورقة القوانين: مرور كامل',m:10,a:'sheet'}]
    :[
      {t:'أعد حل دفتر الأخطاء كاملاً',m:40,a:'mis'},
      {t:'20 سؤالاً من أضعف نوعين عندك',m:25},
      {t:'نص قرائي بأسئلته في 6 دقائق',m:10},SPR],
  light:()=>[
      {t:'مراجعة خفيفة: ورقة القوانين وعناوين دفتر الأخطاء',m:45,a:'sheet'},
      {t:'قسم واحد موقوت للإحماء',m:25},
      {t:'تأكد من مقر الاختبار وموعد الحضور في حسابك',m:5},
      {t:'نم مبكراً',m:0}],
  eve:()=>[
      {t:'لا معلومة جديدة اليوم. تصفّح دفتر الأخطاء نصف ساعة ثم أغلقه',m:30,a:'mis'},
      {t:'جهّز أصل إثبات الهوية وما يلزم للدخول',m:5},
      {t:'اضبط منبهين، ونم ثماني ساعات',m:0}],
  testday:()=>[
      {t:'فطور خفيف وماء، واحضر قبل الموعد بنصف ساعة على الأقل',m:0},
      {t:'في كل قسم: جولتان، وثلاث نظرات إلى الساعة، ولا سؤال بلا إجابة',m:0},
      {t:'ما مضى من الأقسام مضى. السؤال الذي أمامك فقط',m:0}]
};
function goalFor(n,target){return Math.min(n,Math.ceil(n*target/100));}
function goalOf(n){return goalFor(n,S.cfg.target);}
const planMemo={};
function plan(){return planFor(S.cfg);}
function planFor(c){
  const k=c.start+'|'+c.test+'|'+c.target+'|'+(c.boost?1:0);
  if(planMemo[k])return planMemo[k];
  const n=diff(c.start,c.test),daysA=[],ph=[],ck=[];
  const add=(kk,from,len,goal)=>{if(len>0)ph.push({k:kk,name:PH[kk],from:addDays(c.start,from),to:addDays(c.start,from+len-1),len:len,goal:goal});};
  if(n>0){
    const C=n<=70?n:CD,pre=n-C;
    if(pre>0){
      const A=pre>=60?clamp(Math.round(pre*0.35),28,120):pre,sats=[],ckAt={};
      for(let i=5;i<pre;i++)if(pd(addDays(c.start,i)).getDay()===6)sats.push(i);
      const put=(sec,f)=>{let j=Math.round(f*(sats.length-1));while(j<sats.length&&ckAt[sats[j]]!=null)j++;if(j<sats.length)ckAt[sats[j]]=sec;};
      if(sats.length){put(1,0);if(sats.length>=8){put(2,0.4);put(3,0.8);}}
      let wk=0;
      for(let i=0;i<pre;i++){
        const date=addDays(c.start,i),wd=pd(date).getDay(),p=i<A?'a':'b';
        if(p==='b'&&wd===6)wk++;
        daysA.push({date:date,i:i,ph:p,tasks:preTasks(p,wd,{first:i===0,sec:ckAt[i],wk:wk,boost:c.boost})});
        if(ckAt[i])ck.push({date:date,sec:ckAt[i]});
      }
      add('a',0,A,'عادة يومية قصيرة: مفردات، وحساب ذهني، ومسائل قليلة، وربع ساعة قراءة. الغاية أن يصير التدريب عادة ثابتة لا تحتاج إلى قرار كل يوم.');
      add('b',A,pre-A,'تتعرف على أنواع الأسئلة واحداً واحداً: درس كل سبت من «الطريقة»، وتدريب على النوع في الأسبوع نفسه، والعادة اليومية مستمرة.');
    }
    /* العدّ التنازلي */
    const W=Math.max(0,C-2);
    let a=0,b=0,cc=W;
    if(W>=3){
      const f=W>=33?[.4,.35]:W>=13?[.3,.4]:[.2,.4];
      a=Math.max(1,Math.round(W*f[0]));b=Math.max(1,Math.round(W*f[1]));cc=W-a-b;
      if(cc<1){b=Math.max(1,b-(1-cc));cc=W-a-b;}
    }
    const secAt={};
    for(let s=1;s<=5;s++){const i=W>=5?Math.round((s-1)*(W-1)/4):(s-1);if(i<W&&secAt[i]==null)secAt[i]=s;}
    for(let i=0;i<C;i++){
      const date=addDays(c.start,pre+i),wd=pd(date).getDay();let p,tasks;
      if(i===C-1){p=4;tasks=T.eve();}
      else if(i===C-2){p=4;tasks=T.light();}
      else{
        p=i<a?1:i<a+b?2:3;
        const j=p===1?i:p===2?i-a:i-a-b;
        tasks=T['p'+p](wd,j).slice();
        if(secAt[i]){tasks.unshift(T.sec(secAt[i],pre===0&&i===0));ck.push({date:date,sec:secAt[i]});}
      }
      daysA.push({date:date,i:pre+i,ph:p,tasks:tasks});
    }
    daysA.push({date:c.test,i:n,ph:5,tasks:T.testday()});
    add(1,pre,a,pre>0?'تبدأ الخطة المكثفة: دروس التأسيس في دورة لفظية ودورة كمية، وحل تدريب كل درس يوم مشاهدته. الغاية ألا يبقى نوع لا تعرف طريقته.'
      :'أكمل دروس التأسيس في دورتَي اللفظي والكمي، وحل تدريب كل درس يوم مشاهدته. الغاية ألا يبقى نوع لا تعرف طريقته.');
    add(2,pre+a,b,'بنوك الأسئلة بالساعة، ودفتر الأخطاء كل يوم. هدفك التدريبي: '+goalFor(24,c.target)+' صحيحة من 24 في القسم الموقوت.');
    add(3,pre+a+b,cc,'اختبارات كاملة في ظروف الاختبار. المطلوب ثبات النتيجة والتوقيت، لا معلومات جديدة.');
    add(4,pre+W,C-W,'مراجعة خفيفة ونوم كافٍ. لا جديد.');
  }
  const P={k:k,n:n,days:daysA,ph:ph,ck:ck,by:{}};
  daysA.forEach(d=>{P.by[d.date]=d;});
  planMemo[k]=P;
  return P;
}
/* تُعلَّم مهمة اليوم المطابقة منجزةً حين يُنهي نشاطها داخل الصفحة */
function autoTick(a){
  const d=plan().by[today()];
  if(!d)return;
  for(let i=0;i<d.tasks.length;i++)if(d.tasks[i].a===a&&!isDone(S,d.date,i)){setDone(d.date,i,true);return;}
}
